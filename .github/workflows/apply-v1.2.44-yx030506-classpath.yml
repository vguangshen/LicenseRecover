name: Apply v1.2.44 YX030506 classpath-root fix

on:
  push:
    branches: [ "fix/yx030506-project-classpath-v1.2.44" ]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/yx030506-project-classpath-v1.2.44
          fetch-depth: 0
      - name: Patch classpath-root runtime detection and regression guards
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              s = p.read_text(encoding='utf-8')
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected 1 match, found {count}')
              p.write_text(s.replace(old, new, 1), encoding='utf-8')

          profile = 'src/main/java/JavaRegistrationRuntimeProfile.java'

          replace_once(profile,
          '''            String rootRelay = null;
            if (!best.servletRootEvidence && (best.ctorDescriptors.contains(D3)
                    || (!modern && best.ctorDescriptors.contains(D2)))) {
                rootRelay = findServletRootRelay(classes, best);
            }
            boolean rootEvidence = best.servletRootEvidence || rootRelay != null;

            ArrayList<Attempt> attempts = new ArrayList<Attempt>();
            if (modern) {
                if (best.ctorDescriptors.contains(D3)) {
                    if (!rootEvidence)
                        return fail(jar, "启动类使用 3 参 RegisterMain，但未证明 ServletContext.getRealPath(\\"/\\") 根路径: " + best.relativePath);
                    attempts.add(new Attempt(Mode.THREE_ARG_TOKEN_PATH, root, best.relativePath));
                }
''',
          '''            String rootRelay = null;
            if (!best.servletRootEvidence && !best.classpathRootEvidence
                    && (best.ctorDescriptors.contains(D3)
                    || (!modern && best.ctorDescriptors.contains(D2)))) {
                rootRelay = findServletRootRelay(classes, best);
            }
            boolean servletRootEvidence = best.servletRootEvidence || rootRelay != null;
            File explicitBase = selectExplicitBase(root, classes, servletRootEvidence, best.classpathRootEvidence);

            ArrayList<Attempt> attempts = new ArrayList<Attempt>();
            if (modern) {
                if (best.ctorDescriptors.contains(D3)) {
                    if (explicitBase == null)
                        return fail(jar, "启动类使用 3 参 RegisterMain，但未证明显式配置路径（ServletContext.getRealPath(\\"/\\") / ProjectSourcesPath.projectPath(\\"/\\")）: " + best.relativePath);
                    attempts.add(new Attempt(Mode.THREE_ARG_TOKEN_PATH, explicitBase, best.relativePath));
                }
''')

          replace_once(profile,
          '''            } else {
                if (best.ctorDescriptors.contains(D2)) {
                    if (!rootEvidence)
                        return fail(jar, "旧版启动类使用 2 参路径构造器，但未证明 ServletContext.getRealPath(\\"/\\") 根路径: " + best.relativePath);
                    attempts.add(new Attempt(Mode.TWO_ARG_PATH, root, best.relativePath));
                }
''',
          '''            } else {
                if (best.ctorDescriptors.contains(D2)) {
                    if (explicitBase == null)
                        return fail(jar, "旧版启动类使用 2 参路径构造器，但未证明显式配置路径（ServletContext.getRealPath(\\"/\\") / ProjectSourcesPath.projectPath(\\"/\\")）: " + best.relativePath);
                    attempts.add(new Attempt(Mode.TWO_ARG_PATH, explicitBase, best.relativePath));
                }
''')

          replace_once(profile,
          '''            StringBuilder ev = new StringBuilder();
            if (rootRelay != null) ev.append(rootRelay).append(" [ServletContext.getRealPath(/)] -> ");
            ev.append(best.relativePath).append(" -> ");
''',
          '''            StringBuilder ev = new StringBuilder();
            if (rootRelay != null) ev.append(rootRelay).append(" [ServletContext.getRealPath(/)] -> ");
            ev.append(best.relativePath);
            if (best.classpathRootEvidence)
                ev.append(" [ProjectSourcesPath.projectPath(/) -> WEB-INF/classes]");
            ev.append(" -> ");
''')

          replace_once(profile,
          '''        Candidate best = null;
        for (File f : files) {
''',
          '''        Candidate best = null;
        boolean projectClasspathProvider = hasProjectClasspathRootProvider(classes);
        for (File f : files) {
''')

          replace_once(profile,
          '''            boolean rootEvidence = refs.hasMethodRef("javax/servlet/ServletContext", "getRealPath",
                    "(Ljava/lang/String;)Ljava/lang/String;")
                    || refs.hasMethodRef("jakarta/servlet/ServletContext", "getRealPath",
                    "(Ljava/lang/String;)Ljava/lang/String;");
            Candidate c = new Candidate(rel, score, ctors, rootEvidence);
''',
          '''            boolean rootEvidence = refs.hasMethodRef("javax/servlet/ServletContext", "getRealPath",
                    "(Ljava/lang/String;)Ljava/lang/String;")
                    || refs.hasMethodRef("jakarta/servlet/ServletContext", "getRealPath",
                    "(Ljava/lang/String;)Ljava/lang/String;");
            boolean classpathRootEvidence = projectClasspathProvider
                    && refs.hasMethodRef("com/itmc/utils/ProjectSourcesPath", "projectPath",
                    "(Ljava/lang/String;)Ljava/lang/String;")
                    && refs.hasUtf8("/");
            Candidate c = new Candidate(rel, score, ctors, rootEvidence, classpathRootEvidence);
''')

          insert_anchor = '''        return best;
    }

    /**
     * Prove a QT401/RuoYi-style classpath-root factory relay.'''
          insert_new = '''        return best;
    }

    static File selectExplicitBase(File root, File classes,
                                   boolean servletRootEvidence, boolean classpathRootEvidence) {
        if (servletRootEvidence) return root;
        if (classpathRootEvidence) return classes;
        return null;
    }

    private static boolean hasProjectClasspathRootProvider(File classes) {
        if (classes == null || !classes.isDirectory()) return false;
        File provider = new File(classes, "com" + File.separator + "itmc" + File.separator
                + "utils" + File.separator + "ProjectSourcesPath.class");
        if (!provider.isFile()) return false;
        try {
            ClassRefs refs = ClassRefs.parse(Files.readAllBytes(provider.toPath()));
            return refs.hasUtf8("classpath:")
                    && refs.hasMethodRef("org/springframework/util/ResourceUtils", "getURL",
                    "(Ljava/lang/String;)Ljava/net/URL;")
                    && refs.hasMethodRef("java/net/URL", "getPath", "()Ljava/lang/String;")
                    && refs.hasMethodRef("java/io/File", "getAbsolutePath", "()Ljava/lang/String;");
        } catch (Throwable ignore) {
            return false;
        }
    }

    /**
     * Prove a QT401/RuoYi-style classpath-root factory relay.'''
          replace_once(profile, insert_anchor, insert_new)

          replace_once(profile,
          '''        if ("RegisterListener.class".equalsIgnoreCase(simple)) return 960;
        if ("RegisterUtil.class".equalsIgnoreCase(simple)) return 600;
''',
          '''        if ("RegisterListener.class".equalsIgnoreCase(simple)) return 960;
        if ("ProjectApplicationRunner.class".equalsIgnoreCase(simple)) return 950;
        if ("RegisterUtil.class".equalsIgnoreCase(simple)) return 600;
''')

          replace_once(profile,
          '''        final Set<String> ctorDescriptors;
        final boolean servletRootEvidence;
        Candidate(String relativePath, int score, Set<String> ctorDescriptors, boolean servletRootEvidence) {
            this.relativePath = relativePath;
            this.score = score;
            this.ctorDescriptors = ctorDescriptors;
            this.servletRootEvidence = servletRootEvidence;
        }
''',
          '''        final Set<String> ctorDescriptors;
        final boolean servletRootEvidence;
        final boolean classpathRootEvidence;
        Candidate(String relativePath, int score, Set<String> ctorDescriptors,
                  boolean servletRootEvidence, boolean classpathRootEvidence) {
            this.relativePath = relativePath;
            this.score = score;
            this.ctorDescriptors = ctorDescriptors;
            this.servletRootEvidence = servletRootEvidence;
            this.classpathRootEvidence = classpathRootEvidence;
        }
''')

          replace_once(profile,
          '''        boolean hasMethodRef(String owner, String name, String desc) {
''',
          '''        boolean hasUtf8(String value) {
            if (value == null) return false;
            for (String x : utf) if (value.equals(x)) return true;
            return false;
        }

        boolean hasMethodRef(String owner, String name, String desc) {
''')

          plan = 'src/main/java/LicenseRecoverModernGUIJavaPlan.java'
          replace_once(plan,
          '''        String libConfig = relative(root, new File(lib, "config.xml"));
        String targets = libConfig;
        if (rootConfig) targets += " + config.xml(webapp根)";
        String verify = rootConfig
                ? "RegisterMain.checkReInfo(): lib + webapp根"
                : "RegisterMain.checkReInfo(): lib";
''',
          '''        String libConfig = relative(root, new File(lib, "config.xml"));
        boolean projectClasspathBase = usesProjectClasspathRegistrationBase(root);
        String targets;
        String verify;
        if (projectClasspathBase) {
            targets = relative(root, classesConfig);
            verify = "RegisterMain.checkReInfo(): WEB-INF/classes (ProjectSourcesPath)";
        } else {
            targets = libConfig;
            if (rootConfig) targets += " + config.xml(webapp根)";
            verify = rootConfig
                    ? "RegisterMain.checkReInfo(): lib + webapp根"
                    : "RegisterMain.checkReInfo(): lib";
        }
''')

          plan_anchor = '''    private static boolean classFileContainsAll(File file, String... tokens) {
'''
          plan_insert = '''    static boolean usesProjectClasspathRegistrationBase(File root) {
        if (root == null) return false;
        File classes = new File(root, "WEB-INF" + File.separator + "classes");
        File provider = new File(classes, "com" + File.separator + "itmc" + File.separator
                + "utils" + File.separator + "ProjectSourcesPath.class");
        File runner = new File(classes, "com" + File.separator + "itmc" + File.separator
                + "utils" + File.separator + "ProjectApplicationRunner.class");
        return classFileContainsAll(provider, "classpath:", "org/springframework/util/ResourceUtils",
                        "getURL", "java/net/URL", "getPath", "java/io/File", "getAbsolutePath")
                && classFileContainsAll(runner, "com/itmc/utils/ProjectSourcesPath", "projectPath",
                        "itmc/regedit/RegisterMain", "checkReInfo");
    }

    private static boolean classFileContainsAll(File file, String... tokens) {
'''
          replace_once(plan, plan_anchor, plan_insert)

          test = 'src/test/java/RefactorSmokeTest.java'
          replace_once(test,
          '''        List<JavaRegistrationRuntimeProfile.Mode> ytWrapperModes =
                JavaRegistrationRuntimeProfile.chooseModes(true, modernRootFallback, true, true);
        check(ytWrapperModes.size() == 1
                        && ytWrapperModes.get(0) == JavaRegistrationRuntimeProfile.Mode.THREE_ARG_TOKEN_PATH,
                "YT001xx wrapper consumes proven servlet root without inventing two-token fallback");
''',
          '''        List<JavaRegistrationRuntimeProfile.Mode> ytWrapperModes =
                JavaRegistrationRuntimeProfile.chooseModes(true, modernRootFallback, true, true);
        check(ytWrapperModes.size() == 1
                        && ytWrapperModes.get(0) == JavaRegistrationRuntimeProfile.Mode.THREE_ARG_TOKEN_PATH,
                "YT001xx wrapper consumes proven servlet root without inventing two-token fallback");
        File yxRootBase = base.resolve("yx030506-root").toFile();
        File yxClassesBase = base.resolve("yx030506-root/WEB-INF/classes").toFile();
        check(JavaRegistrationRuntimeProfile.selectExplicitBase(yxRootBase, yxClassesBase, false, true)
                        .equals(yxClassesBase),
                "YX030506 ProjectSourcesPath classpath evidence selects WEB-INF/classes as RegisterMain base");
        check(JavaRegistrationRuntimeProfile.selectExplicitBase(yxRootBase, yxClassesBase, true, true)
                        .equals(yxRootBase),
                "Servlet root remains authoritative when both explicit path proofs are present");
''')

          verify = 'scripts/verify.ps1'
          verify_anchor = '''$javaRuntimeProfileSource = Get-Content -LiteralPath (Join-Path $mainSourceDir 'JavaRegistrationRuntimeProfile.java') -Raw
'''
          verify_insert = '''$javaRuntimeProfileSource = Get-Content -LiteralPath (Join-Path $mainSourceDir 'JavaRegistrationRuntimeProfile.java') -Raw
if (-not $javaRuntimeProfileSource.Contains('ProjectSourcesPath.projectPath(/) -> WEB-INF/classes')) { throw 'YX030506 ProjectSourcesPath classpath-root runtime marker is missing.' }
if (-not $javaRuntimeProfileSource.Contains('hasProjectClasspathRootProvider')) { throw 'YX030506 ProjectSourcesPath provider proof is missing.' }
'''
          replace_once(verify, verify_anchor, verify_insert)

          Path('VERSION.txt').write_text('1.2.44\n', encoding='utf-8')

          notes = Path('release-notes/v1.2.44.md')
          notes.write_text('''# LicenseRecover v1.2.44\n\n## YX030506 / ProjectSourcesPath 修复\n\n- 修复 YX030506 一类 Spring Java 应用的运行路径识别：目标 `ProjectApplicationRunner` 使用 `ProjectSourcesPath.projectPath("/")` 将 `WEB-INF/classes` 作为三参数 `RegisterMain` 的配置基目录，而不是 `ServletContext.getRealPath("/")` 的 WebApp 根目录。\n- runtime profile 只有在目标 `ProjectSourcesPath.class` 同时证明 `classpath:`、`ResourceUtils.getURL()`、`URL.getPath()`、`File.getAbsolutePath()` 链时，才接受该 classpath-root 路径；否则仍保持 fail-closed。\n- YX030506 的 native 写回因此落到目标实际消费的 `WEB-INF/classes/config.xml`，并继续要求 fresh JVM `checkReInfo()` + `getRegInfo().RegStr` 全部通过后才显示 OK。\n- 批量扫描中的配置目标展示同步改为 `WEB-INF/classes/config.xml`，避免把此代产品误显示为 lib/root 配置。\n\n## Verification\n\n- 新增 YX030506 classpath-root 显式路径选择回归。\n- `Verify source` 增加 `ProjectSourcesPath` provider/runtime marker 门禁。\n- 原有 Java 8、Java target-native、.NET Windows 集成、备份清理与发布门禁保持不变。\n''', encoding='utf-8')

          changelog = Path('CHANGELOG.md')
          ch = changelog.read_text(encoding='utf-8')
          if '## 1.2.44' not in ch:
              changelog.write_text('''## 1.2.44 - 2026-09-11\n\n- Fix YX030506-style `ProjectSourcesPath.projectPath("/")` startup chains by proving and selecting `WEB-INF/classes` as the explicit target-native RegisterMain base.\n- Keep fresh-JVM verification mandatory; no successful status is emitted until target `checkReInfo`/`RegStr` validation passes.\n- Correct the batch-plan configuration target display for this classpath-root generation.\n\n''' + ch, encoding='utf-8')

          readme = Path('README.md')
          rs = readme.read_text(encoding='utf-8')
          if 'v1.2.44' not in rs:
              rs = rs.replace('v1.2.43', 'v1.2.44', 1)
              rs += '\n\n### v1.2.44 Java classpath-root compatibility\nYX030506-style startup code that explicitly derives its registration base from `ProjectSourcesPath.projectPath("/")` is now mapped to `WEB-INF/classes`. The path is accepted only when the target class files prove the classpath provider chain, and the final success state still requires a fresh-JVM native verification.\n'
              readme.write_text(rs, encoding='utf-8')

          readme_txt = Path('README.txt')
          if readme_txt.exists():
              t = readme_txt.read_text(encoding='utf-8')
              if 'v1.2.44' not in t:
                  readme_txt.write_text('v1.2.44：修复 YX030506 / ProjectSourcesPath classpath-root 注册路径；只有 fresh JVM 原生验证通过才显示 OK。\n\n' + t, encoding='utf-8')

          wf = Path('.github/workflows/apply-v1.2.44-yx030506-classpath.yml')
          if wf.exists(): wf.unlink()

      - name: Commit fix
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: mirror YX030506 ProjectSourcesPath registration base"
          git push origin HEAD:fix/yx030506-project-classpath-v1.2.44
