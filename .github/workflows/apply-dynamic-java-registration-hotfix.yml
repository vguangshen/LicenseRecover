name: Apply dynamic Java registration hotfix

on:
  push:
    branches: [ main ]
    paths:
      - 'scripts/apply-dynamic-java-registration-hotfix.py'
      - '.github/workflows/apply-dynamic-java-registration-hotfix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Apply source hotfix
        run: python3 scripts/apply-dynamic-java-registration-hotfix.py
      - name: Validate patch shape
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff --exit-code -- src/main/java/LegacyJavaRegistrationMetadata.java || true
          grep -F 'LegacyJavaRegistrationMetadata.inspect' src/main/java/LicenseRecover.java
          grep -F '目标软件目录未解析出注册ID映射' src/main/java/LicenseRecoverModernGUIJavaPlan.java
          grep -F "'LicenseRecover*.class'" scripts/verify.ps1
      - name: Commit hotfix to main
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain -- src/main/java src/test/java scripts/verify.ps1)" ]; then
            echo 'No source changes produced.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main/java/LicenseRecover.java \
                  src/main/java/LicenseRecoverModernGUIJavaPlan.java \
                  src/main/java/LicenseRecoverModernGUIAutoRecovery.java \
                  src/main/java/LicenseRecoverModernGUI.java \
                  src/test/java/RefactorSmokeTest.java \
                  scripts/verify.ps1
          git commit -m 'fix: 从目标软件目录解析Java注册ID'
          git push origin HEAD:main
