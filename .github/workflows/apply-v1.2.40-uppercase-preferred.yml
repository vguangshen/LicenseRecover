name: Apply v1.2.40 uppercase-preferred registration chain

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/apply-v1.2.40-uppercase-preferred.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Patch v1.2.40 source, regression coverage and metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def read(path):
              return Path(path).read_text(encoding='utf-8')

          def write(path, text):
              Path(path).write_text(text, encoding='utf-8', newline='\n')

          def replace_once(path, old, new, label):
              text = read(path)
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              write(path, text.replace(old, new, 1))

          if read('VERSION.txt').strip() != '1.2.39':
              raise SystemExit('VERSION.txt is not 1.2.39; refusing one-time v1.2.40 patch')

          # 1) Java coordinator: match ITMC.Web runtime parity -- uppercase modern chain first.
          auto_path = 'src/main/java/LicenseRecoverModernGUIAutoRecovery.java'
          auto = read(auto_path)

          old_select = '''    static File selectDotNetRegeditAssembly(File runtimeDir) {
              File lower = findExactChild(runtimeDir, "itmcRegedit.dll");
              if (lower != null) return lower;
              return findExactChild(runtimeDir, "ITMC.Regedit.dll");
          }'''
          new_select = '''    static File selectDotNetRegeditAssembly(File runtimeDir) {
              // Match the target ITMC.Web runtime: modern uppercase registration is authoritative
              // when both generations are deployed; lowercase is compatibility fallback only.
              File upper = findExactChild(runtimeDir, "ITMC.Regedit.dll");
              if (upper != null) return upper;
              return findExactChild(runtimeDir, "itmcRegedit.dll");
          }'''
          if auto.count(old_select) != 1:
              raise SystemExit(f'AutoRecovery selectDotNetRegeditAssembly: expected 1 match, found {auto.count(old_select)}')
          auto = auto.replace(old_select, new_select, 1)

          old_lower_log = '''            log.accept("[dotnet-chain] lowercase itmcRegedit.dll preferred via ASP.NET host; appProduct=" + appProduct
                      + " registrationProduct=" + registrationProduct + "\\n");'''
          new_lower_log = '''            log.accept("[dotnet-chain] uppercase ITMC.Regedit.dll absent; lowercase itmcRegedit.dll compatibility fallback via ASP.NET host; appProduct=" + appProduct
                      + " registrationProduct=" + registrationProduct + "\\n");'''
          if auto.count(old_lower_log) != 1:
              raise SystemExit(f'AutoRecovery lowercase log: expected 1 match, found {auto.count(old_lower_log)}')
          auto = auto.replace(old_lower_log, new_lower_log, 1)

          old_upper_log = '''            log.accept("[dotnet-chain] lowercase itmcRegedit.dll absent; uppercase ITMC.Regedit.dll fallback via hosted AppDomain; product="
                      + appProduct + "\\n");'''
          new_upper_log = '''            log.accept("[dotnet-chain] uppercase ITMC.Regedit.dll preferred via hosted AppDomain; product="
                      + appProduct + "\\n");'''
          if auto.count(old_upper_log) != 1:
              raise SystemExit(f'AutoRecovery uppercase log: expected 1 match, found {auto.count(old_upper_log)}')
          auto = auto.replace(old_upper_log, new_upper_log, 1)

          # Add a config-specific modern RegStr reader so post-write verification checks the
          # site-root config actually consumed by uppercase ITMC.Regedit, not a stale bin copy.
          helper_anchor = '''    static String recoverDotNetLocalRegStr(File root, File runtimeDir, String product) {
              if (blank(product)) return null;'''
          helper_insert = '''    static String recoverDotNetLocalRegStrFromConfig(File cfg, String product) {
              if (blank(product) || cfg == null || !cfg.isFile()) return null;
              try {
                  String encrypted = firstElement(readUtf8(cfg), "regName");
                  if (blank(encrypted)) return null;
                  String plain = desDecryptHex(encrypted.trim(), "*ITMC" + product.trim() + "OK*");
                  int begin = plain.indexOf('{'), end = plain.lastIndexOf('}');
                  if (begin < 0 || end <= begin) return null;
                  String json = plain.substring(begin, end + 1);
                  String embeddedProduct = jsonStringField(json, "ProName");
                  String regStr = normalizeProductCsv(jsonStringField(json, "RegStr"));
                  return product.trim().equalsIgnoreCase(embeddedProduct) && !blank(regStr) ? regStr : null;
              } catch (Throwable ignore) {
                  return null;
              }
          }

          ''' + helper_anchor
          if auto.count(helper_anchor) != 1:
              raise SystemExit(f'AutoRecovery local RegStr helper anchor: expected 1 match, found {auto.count(helper_anchor)}')
          auto = auto.replace(helper_anchor, helper_insert, 1)

          verify_anchor = '''            log.accept("[dotnet-stage] VERIFY: OK\\n");

                      if (blockNet) {'''
          verify_insert = '''            log.accept("[dotnet-stage] VERIFY: OK\\n");

                      if (!lowercaseChain) {
                          File siteConfig = new File(d.appRoot, "config.xml");
                          String persistedRegStr = recoverDotNetLocalRegStrFromConfig(siteConfig, appProduct);
                          if (blank(persistedRegStr))
                              throw new IOException("[MODE_VERIFY] uppercase registration passed native CheckReInfo, but site-root config.xml does not contain a readable modern RegStr for ProName=" + appProduct);
                          if (!blank(d.versionId) && !containsRegStrToken(persistedRegStr, d.versionId))
                              throw new IOException("[MODE_VERIFY] site-root persisted RegStr does not contain current SoftVersionID=" + d.versionId + "; RegStr=" + persistedRegStr);
                          log.accept("[dotnet-mode-verify] persisted root RegStr=" + persistedRegStr + "\\n");
                      }

                      if (blockNet) {'''
          if auto.count(verify_anchor) != 1:
              raise SystemExit(f'AutoRecovery VERIFY insertion anchor: expected 1 match, found {auto.count(verify_anchor)}')
          auto = auto.replace(verify_anchor, verify_insert, 1)
          write(auto_path, auto)

          # 2) ASP.NET host and bridge must select/preload the same uppercase-first chain.
          host_path = 'src/dotnet/LicenseRecover.AspNetHost.cs'
          host = read(host_path)
          old_host = '''        if (File.Exists(lower))
                  {
                      chain = "lowercase-itmcRegedit";
                      helper = Path.Combine(toolDir, "LicenseRecover.NET.exe");
                  }
                  else if (File.Exists(upper))
                  {
                      chain = "uppercase-ITMC.Regedit";
                      helper = Path.Combine(toolDir, "LicenseRecover.NET.Modern.exe");
                  }'''
          new_host = '''        if (File.Exists(upper))
                  {
                      chain = "uppercase-ITMC.Regedit";
                      helper = Path.Combine(toolDir, "LicenseRecover.NET.Modern.exe");
                  }
                  else if (File.Exists(lower))
                  {
                      chain = "lowercase-itmcRegedit";
                      helper = Path.Combine(toolDir, "LicenseRecover.NET.exe");
                  }'''
          if host.count(old_host) != 1:
              raise SystemExit(f'AspNetHost SelectHelper: expected 1 match, found {host.count(old_host)}')
          host = host.replace(old_host, new_host, 1)
          write(host_path, host)

          bridge_path = 'src/dotnet/LicenseRecover.AspNetBridge.cs'
          bridge = read(bridge_path)
          old_bridge = '''        if (File.Exists(lower))
                  {
                      target = lower;
                      chain = "lowercase-itmcRegedit";
                  }
                  else if (File.Exists(upper))
                  {
                      target = upper;
                      chain = "uppercase-ITMC.Regedit";
                  }'''
          new_bridge = '''        if (File.Exists(upper))
                  {
                      target = upper;
                      chain = "uppercase-ITMC.Regedit";
                  }
                  else if (File.Exists(lower))
                  {
                      target = lower;
                      chain = "lowercase-itmcRegedit";
                  }'''
          if bridge.count(old_bridge) != 1:
              raise SystemExit(f'AspNetBridge preload selection: expected 1 match, found {bridge.count(old_bridge)}')
          bridge = bridge.replace(old_bridge, new_bridge, 1)
          write(bridge_path, bridge)

          # 3) Java regression tests: dual-assembly selection and persisted root RegStr readback.
          test_path = 'src/test/java/RefactorSmokeTest.java'
          test = read(test_path)
          old_chain_test = '''        check("itmcRegedit.dll".equals(LicenseRecoverModernGUIAutoRecovery.selectDotNetRegeditAssembly(
                                  chainBin.toFile()).getName()),
                          ".NET registration chain prefers lowercase itmcRegedit.dll when both assemblies exist");
                  Files.delete(chainBin.resolve("itmcRegedit.dll"));
                  check("ITMC.Regedit.dll".equals(LicenseRecoverModernGUIAutoRecovery.selectDotNetRegeditAssembly(
                                  chainBin.toFile()).getName()),
                          ".NET registration chain falls back to uppercase ITMC.Regedit.dll only when lowercase is absent");'''
          new_chain_test = '''        check("ITMC.Regedit.dll".equals(LicenseRecoverModernGUIAutoRecovery.selectDotNetRegeditAssembly(
                                  chainBin.toFile()).getName()),
                          ".NET registration chain prefers uppercase ITMC.Regedit.dll when both assemblies exist");
                  Files.delete(chainBin.resolve("ITMC.Regedit.dll"));
                  check("itmcRegedit.dll".equals(LicenseRecoverModernGUIAutoRecovery.selectDotNetRegeditAssembly(
                                  chainBin.toFile()).getName()),
                          ".NET registration chain falls back to lowercase itmcRegedit.dll only when uppercase is absent");'''
          if test.count(old_chain_test) != 1:
              raise SystemExit(f'RefactorSmokeTest chain selection block: expected 1 match, found {test.count(old_chain_test)}')
          test = test.replace(old_chain_test, new_chain_test, 1)

          insert_anchor = '''        check(LicenseRecoverModernGUIAutoRecovery.containsRegStrToken(
                                  LicenseRecoverModernGUIAutoRecovery.detectDotNetRegStr(yx030308ModeDetection), "YX030308"),
                          ".NET final RegStr explicitly contains the current system version mode");'''
          persisted_test = insert_anchor + '''

                  Path persistedModeConfig = base.resolve("persisted-modern-root-config.xml");
                  String persistedModeJson = "{\\\"RegStr\\\":\\\"YX030101,YX030102\\\",\\\"ProName\\\":\\\"YX0301\\\"}";
                  String persistedModeCipher = LicenseRecoverModernGUIAutoRecovery.desEncryptHex(
                          "12345678" + persistedModeJson, "*ITMCYX0301OK*");
                  Files.write(persistedModeConfig, Arrays.asList(
                          "<ROOT><reg><regType>1</regType><regName>" + persistedModeCipher + "</regName></reg></ROOT>"),
                          StandardCharsets.UTF_8);
                  check("YX030101,YX030102".equals(
                                  LicenseRecoverModernGUIAutoRecovery.recoverDotNetLocalRegStrFromConfig(
                                          persistedModeConfig.toFile(), "YX0301")),
                          ".NET mode verifier reads RegStr from the exact modern site-root config");
                  check(LicenseRecoverModernGUIAutoRecovery.recoverDotNetLocalRegStrFromConfig(
                                  persistedModeConfig.toFile(), "YX0302") == null,
                          ".NET mode verifier rejects a persisted modern record for the wrong ProName");'''
          if test.count(insert_anchor) != 1:
              raise SystemExit(f'RefactorSmokeTest persisted RegStr insertion anchor: expected 1 match, found {test.count(insert_anchor)}')
          test = test.replace(insert_anchor, persisted_test, 1)
          write(test_path, test)

          # 4) CI policy: source must remain uppercase-first and verify the actual root RegStr.
          verify_path = 'scripts/verify.ps1'
          verify = read(verify_path)
          old_guard1 = "if (-not $autoSource.Contains('LicenseRecover.NET.AspNetHost.exe') -or -not $autoSource.Contains('LicenseRecover.NET.Modern.exe')) { throw '.NET one-click must use the ASP.NET host for lowercase chain plus uppercase fallback adapter.' }"
          new_guard1 = "if (-not $autoSource.Contains('LicenseRecover.NET.AspNetHost.exe') -or -not $autoSource.Contains('LicenseRecover.NET.Modern.exe')) { throw '.NET one-click must use the ASP.NET host with the uppercase modern adapter and lowercase compatibility fallback.' }"
          if verify.count(old_guard1) != 1:
              raise SystemExit('verify.ps1 old helper-chain guard not found exactly once')
          verify = verify.replace(old_guard1, new_guard1, 1)

          old_guard2 = "if (-not $autoSource.Contains('selectDotNetRegeditAssembly') -or -not $autoSource.Contains('detectLowercaseDotNetRegistrationProduct')) { throw '.NET target-owned lowercase-first registration-chain policy is missing.' }"
          new_guard2 = '''if (-not $autoSource.Contains('selectDotNetRegeditAssembly') -or -not $autoSource.Contains('detectLowercaseDotNetRegistrationProduct')) { throw '.NET registration-chain selection or lowercase compatibility-family probe is missing.' }
          $autoUpperAt = $autoSource.IndexOf('File upper = findExactChild(runtimeDir, "ITMC.Regedit.dll");')
          $autoLowerAt = $autoSource.IndexOf('return findExactChild(runtimeDir, "itmcRegedit.dll");')
          if ($autoUpperAt -lt 0 -or $autoLowerAt -lt 0 -or $autoUpperAt -gt $autoLowerAt) { throw '.NET coordinator is not uppercase-first.' }
          $hostUpperAt = $aspHostSourceText.IndexOf('if (File.Exists(upper))')
          $hostLowerAt = $aspHostSourceText.IndexOf('else if (File.Exists(lower))')
          if ($hostUpperAt -lt 0 -or $hostLowerAt -lt 0 -or $hostUpperAt -gt $hostLowerAt) { throw 'ASP.NET host helper is not uppercase-first.' }
          $bridgeUpperAt = $aspBridgeSourceText.IndexOf('if (File.Exists(upper))')
          $bridgeLowerAt = $aspBridgeSourceText.IndexOf('else if (File.Exists(lower))')
          if ($bridgeUpperAt -lt 0 -or $bridgeLowerAt -lt 0 -or $bridgeUpperAt -gt $bridgeLowerAt) { throw 'ASP.NET bridge preload is not uppercase-first.' }
          if (-not $autoSource.Contains('[dotnet-mode-verify] persisted root RegStr=')) { throw '.NET site-root persisted RegStr verification is missing.' }'''
          if verify.count(old_guard2) != 1:
              raise SystemExit('verify.ps1 old lowercase-first guard not found exactly once')
          verify = verify.replace(old_guard2, new_guard2, 1)
          write(verify_path, verify)

          # 5) Windows integration: run on main and prove a valid lowercase decoy cannot steal selection.
          win_path = '.github/workflows/uppercase-host-windows-integration-v2.yml'
          win = read(win_path)
          old_branch = '    branches: [ "fix/v1.2.38-uppercase-host" ]'
          new_branch = '    branches: [ main, "fix/v1.2.38-uppercase-host" ]'
          if win.count(old_branch) != 1:
              raise SystemExit('Windows integration push branch anchor mismatch')
          win = win.replace(old_branch, new_branch, 1)
          win = win.replace('      - name: Build uppercase-only fixture and host',
                            '      - name: Build dual-assembly fixture and host', 1)

          compile_anchor = '''          & $csc /nologo /target:library /r:System.Web.dll /out:$bin\\ITMC.Regedit.dll (Join-Path $test 'FakeUpperRegedit.cs')
                    if ($LASTEXITCODE -ne 0) { throw "fixture compile failed: $LASTEXITCODE" }'''
          compile_insert = compile_anchor + '''

                    @'
                    using System;
                    namespace itmcRegedit
                    {
                        public sealed class RegeditMain
                        {
                            public RegeditMain(string productName, string check) { throw new InvalidOperationException("LOWERCASE DECOY MUST NOT BE SELECTED"); }
                        }
                    }
                    '@ | Set-Content -LiteralPath (Join-Path $test 'FakeLowerRegedit.cs') -Encoding UTF8
                    & $csc /nologo /target:library /out:$bin\\itmcRegedit.dll (Join-Path $test 'FakeLowerRegedit.cs')
                    if ($LASTEXITCODE -ne 0) { throw "lowercase decoy fixture compile failed: $LASTEXITCODE" }'''
          if win.count(compile_anchor) != 1:
              raise SystemExit(f'Windows integration fixture compile anchor: expected 1 match, found {win.count(compile_anchor)}')
          win = win.replace(compile_anchor, compile_insert, 1)

          run_check = '''          foreach ($needle in @('target registration chain=uppercase-ITMC.Regedit','[FAKE_UPPER] get_RegID BaseDirectory=','helperDispatch=RunDirect/hosted-AppDomain','RESULT: OK')) {
                      if ($text.IndexOf($needle,[StringComparison]::OrdinalIgnoreCase) -lt 0) { throw "missing marker: $needle" }
                    }'''
          run_check_new = run_check + '''
                    if ($text.IndexOf('lowercase-itmcRegedit',[StringComparison]::OrdinalIgnoreCase) -ge 0) { throw 'lowercase decoy stole registration-chain selection' }'''
          if win.count(run_check) != 1:
              raise SystemExit('Windows integration run marker block mismatch')
          win = win.replace(run_check, run_check_new, 1)
          win = win.replace("          Write-Host 'UPPERCASE HOSTED CHAIN V2 PASSED'",
                            "          Write-Host 'DUAL-ASSEMBLY UPPERCASE-PREFERRED HOSTED CHAIN PASSED'", 1)
          write(win_path, win)

          # 6) Version / release metadata.
          write('VERSION.txt', '1.2.40\n')

          readme_path = 'README.md'
          readme = read(readme_path)
          if readme.count('当前稳定版本：**v1.2.39**') != 1:
              raise SystemExit('README stable version marker mismatch')
          readme = readme.replace('当前稳定版本：**v1.2.39**', '当前稳定版本：**v1.2.40**', 1)
          readme_anchor = '避免本地授权写入成功但当前系统代号未进入 `RegStr`，最终出现“系统不支持任何模式”。'
          readme_note = (' v1.2.40 进一步与目标 `ITMC.Web` 的运行时链保持一致：当大小写两个注册组件同时存在时，'
                         '优先使用大写 `ITMC.Regedit.dll` 现代链，小写 `itmcRegedit.dll` 仅作为兼容回退；现代链完成后还会重新读取站点根 `config.xml`，'
                         '要求实际持久化的 `RegStr` 包含当前 `SoftVersionID`，否则以 `MODE_VERIFY` 失败。')
          if readme.count(readme_anchor) != 1:
              raise SystemExit('README v1.2.39 anchor mismatch')
          readme = readme.replace(readme_anchor, readme_anchor + readme_note, 1)
          write(readme_path, readme)

          txt_path = 'README.txt'
          txt = read(txt_path)
          if txt.startswith('LicenseRecover v1.2.39'):
              txt = txt.replace('LicenseRecover v1.2.39', 'LicenseRecover v1.2.40', 1)
          section_anchor = '软件自动更新\n------------\n'
          if txt.count(section_anchor) != 1:
              raise SystemExit('README.txt update anchor mismatch')
          section = '''v1.2.40 .NET 注册链一致性修复
          ----------------------------
          - 同时存在 ITMC.Regedit.dll 与 itmcRegedit.dll 时优先现代大写链；
          - 小写旧链仅在大写组件缺失时作为兼容回退；
          - ASP.NET Host、Bridge 与 Java 协调器使用相同的链选择顺序；
          - 现代链完成后读取站点根 config.xml，验证真实持久化 RegStr 包含当前 SoftVersionID。

          '''
          section = '\n'.join(line[10:] if line.startswith('          ') else line for line in section.splitlines()) + '\n'
          txt = txt.replace(section_anchor, section + section_anchor, 1)
          write(txt_path, txt)

          changelog_path = 'CHANGELOG.md'
          changelog = read(changelog_path)
          if changelog.startswith('## [1.2.40]'):
              raise SystemExit('CHANGELOG already contains v1.2.40')
          entry = '''## [1.2.40] - 2026-09-10

          ### Fixed

          - 修复同一 .NET 站点同时包含 `ITMC.Regedit.dll` 与 `itmcRegedit.dll` 时，LicenseRecover 过去无条件选择小写旧链的问题。链顺序现在与目标 `ITMC.Web` 的运行时行为保持一致：大写现代链优先，小写旧链仅在大写组件缺失时回退。
          - `LicenseRecover.NET.AspNetHost.exe` 的 helper 选择、ASP.NET Bridge 的预加载和 Java 一键恢复协调器统一采用相同的 uppercase-first 顺序，避免 helper 与预加载组件分叉。
          - 大写现代链通过 `DoRegistry + CheckReInfo` 后，新增站点根 `config.xml` 的持久化模式验证：必须能够按当前 `ProName` 解出 `RegStr`，且 `RegStr` 必须包含当前 `SoftVersionID`；否则返回 `[MODE_VERIFY]`，不再把“注册有效但业务模式为空”报告为成功。

          ### Regression

          - Java smoke test 改为验证双 DLL 场景优先 `ITMC.Regedit.dll`，删除大写组件后才回退 `itmcRegedit.dll`。
          - 新增现代站点根 `config.xml` RegStr 精确读取与错误 ProName 拒绝测试。
          - Windows hosted integration 现在在 `main` 上运行，并加入一个可加载但调用即失败的小写 decoy DLL，证明双组件部署仍会执行大写现代链。

          '''
          entry = '\n'.join(line[10:] if line.startswith('          ') else line for line in entry.splitlines()) + '\n'
          write(changelog_path, entry + changelog)

          release = '''# LicenseRecover v1.2.40

          本版修复 .NET 站点“本地注册已经有效、连接限制可读取，但网页仍显示系统不支持任何模式”的注册链一致性问题。

          ## 关键修复

          - 当 `bin` 同时存在 `ITMC.Regedit.dll` 与 `itmcRegedit.dll` 时，优先执行大写 `ITMC.Regedit.dll` 现代链；只有大写组件不存在时才回退小写兼容链。
          - Java 一键恢复协调器、`LicenseRecover.NET.AspNetHost.exe` 和 ASP.NET Bridge 的组件选择顺序完全统一。
          - v1.2.39 的 `SoftVersionID -> RegStr` 合并规则保留不变。
          - 大写链完成原生 `DoRegistry()` / `CheckReInfo()` 后，LicenseRecover 会再次读取站点根 `config.xml`，按当前应用 `ProName` 解出实际持久化 `RegStr`；若读不到或不包含当前 `SoftVersionID`，直接以 `[MODE_VERIFY]` 失败。

          ## 回归覆盖

          Windows 集成测试现在同时部署大小写两个注册 DLL，其中小写 DLL 是“调用即失败”的 decoy；测试必须仍然完成大写链的 gencode、DoRegistry 与 CheckReInfo，确保以后不会重新退化为 lowercase-first。

          ## 保持不变

          - ASP.NET Hosted AppDomain 与站点根路径绑定不变；
          - PRE-BLOCK FIRST、临时防火墙隔离、备份与失败回滚不变；
          - 目标 DLL 本身不被修改；
          - 小写链的独立 registrationProduct/加密族识别仍保留，用于大写组件确实不存在的兼容场景。
          '''
          release = '\n'.join(line[10:] if line.startswith('          ') else line for line in release.splitlines()) + '\n'
          write('release-notes/v1.2.40.md', release)

          docs_path = 'docs/DOTNET_ONE_CLICK_COMPATIBILITY.md'
          docs = read(docs_path).rstrip() + '''

          ## v1.2.40 registration-chain parity

          If both registration generations are present, `ITMC.Regedit.dll` is selected before `itmcRegedit.dll`. The Java coordinator, ASP.NET host and bridge preload use the same order. After an uppercase-chain native verification succeeds, one-click reads the site-root `config.xml` again and requires a modern record whose `ProName` matches the detected application product and whose persisted `RegStr` contains the current `SoftVersionID`. A stale or unrelated `bin/config.xml` cannot satisfy this post-write check.
          '''
          docs = '\n'.join(line[10:] if line.startswith('          ') else line for line in docs.splitlines()) + '\n'
          write(docs_path, docs)

          print('v1.2.40 patch prepared')
          PY

          git diff --check
          git status --short

      - name: Commit v1.2.40 to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add VERSION.txt README.md README.txt CHANGELOG.md \
            docs/DOTNET_ONE_CLICK_COMPATIBILITY.md release-notes/v1.2.40.md \
            scripts/verify.ps1 src/main/java/LicenseRecoverModernGUIAutoRecovery.java \
            src/dotnet/LicenseRecover.AspNetHost.cs src/dotnet/LicenseRecover.AspNetBridge.cs \
            src/test/java/RefactorSmokeTest.java \
            .github/workflows/uppercase-host-windows-integration-v2.yml
          git commit -m 'fix: prefer uppercase .NET registration chain and verify persisted modes (v1.2.40)'
          git push origin HEAD:main
