name: Apply robust GitHub updater network chain

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply updater network patch
        run: python3 scripts/apply-robust-github-update-network.py
      - name: Validate patch
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          changed="$(git diff --name-only | sort)"
          test "$changed" = $'scripts/package-native-launcher.ps1\nsrc/main/java/LicenseRecoverModernGUILauncher.java\nsrc/native/LicenseRecoverGUI.c\nsrc/test/java/RefactorSmokeTest.java'
          grep -q 'Windows WinINet 下载成功' src/main/java/LicenseRecoverModernGUILauncher.java
          grep -q -- '--native-download' src/native/LicenseRecoverGUI.c
          grep -q 'INTERNET_OPEN_TYPE_PRECONFIG' src/native/LicenseRecoverGUI.c
          grep -q -- '-lwininet' scripts/package-native-launcher.ps1
          grep -q 'preferIPv4Stack=true' src/native/LicenseRecoverGUI.c
      - name: Commit to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main/java/LicenseRecoverModernGUILauncher.java src/native/LicenseRecoverGUI.c scripts/package-native-launcher.ps1 src/test/java/RefactorSmokeTest.java
          git commit -m 'fix: GitHub更新增加Windows原生下载兜底'
          git push origin HEAD:main
