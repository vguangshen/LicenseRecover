name: Apply Java XMT0102 parity v3
on:
  push:
    branches: [ refactor/java-native-host-v1.2.41 ]
    paths: [ .github/workflows/apply-java-xmt0102-v3.yml ]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refactor/java-native-host-v1.2.41
          fetch-depth: 0
      - name: Apply staged patch
        run: python3 scripts/apply-xmt0102-profile.py
      - name: Commit and clean staging files
        run: |
          rm -f scripts/apply-xmt0102-profile.py .github/workflows/apply-java-xmt0102-v3.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: mirror XMT0102 JSON RegStr startup flow'
          git push origin HEAD:refactor/java-native-host-v1.2.41
