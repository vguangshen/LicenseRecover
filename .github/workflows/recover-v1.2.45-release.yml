name: Recover v1.2.45 release

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/recover-v1.2.45-release.yml'

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Download already verified v1.2.45 artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p build
          gh run download 34749469094 --repo "$GITHUB_REPOSITORY" --name LicenseRecover-latest --dir build
          test -f build/LicenseRecover-latest.zip
          test -f build/LicenseRecover-update.zip
          test -f build/SHA256SUMS.txt
          echo 'c4a76d5bd570f98971628f537361227c401a9e7c5187545b42f5ac0092885a5a  build/LicenseRecover-latest.zip' | sha256sum -c -
          echo 'c9ff629f3377a360abb08cdf3550a786bf754565d7b8f24ddfd77ac89fd1864f  build/LicenseRecover-update.zip' | sha256sum -c -
      - name: Recover and publish stable v1.2.45
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag='v1.2.45'
          target='46e40a2f4dd07c30c5d36bf6b48925eb5bd83cfe'
          notes_file='release-notes/v1.2.45.md'
          releases_api="repos/${GITHUB_REPOSITORY}/releases?per_page=100"

          published_id="$(gh api "$releases_api" --jq ".[] | select(.tag_name == \"$tag\" and .draft == false) | .id" | head -n 1 || true)"
          if [ -n "$published_id" ]; then
            echo "v1.2.45 is already published as release $published_id."
            exit 0
          fi

          cleanup_draft() {
            local draft_id
            draft_id="$(gh api "$releases_api" --jq ".[] | select(.tag_name == \"$tag\" and .draft == true) | .id" | head -n 1 || true)"
            if [ -n "$draft_id" ]; then
              echo "Deleting orphan v1.2.45 draft release $draft_id."
              gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/${draft_id}"
            fi
          }

          cleanup_draft

          for attempt in 1 2 3 4; do
            if gh release create "$tag" \
              build/LicenseRecover-latest.zip \
              build/LicenseRecover-update.zip \
              build/SHA256SUMS.txt \
              --target "$target" \
              --title 'LicenseRecover v1.2.45' \
              --notes-file "$notes_file"; then
              echo 'v1.2.45 release recovery succeeded.'
              exit 0
            fi

            published_id="$(gh api "$releases_api" --jq ".[] | select(.tag_name == \"$tag\" and .draft == false) | .id" | head -n 1 || true)"
            if [ -n "$published_id" ]; then
              echo "v1.2.45 is visible as published release $published_id after transient API failure."
              exit 0
            fi

            cleanup_draft
            echo "::warning::release recovery attempt $attempt failed; retrying"
            sleep $((attempt * 10))
          done

          echo 'v1.2.45 release recovery failed after 4 attempts.' >&2
          exit 1
