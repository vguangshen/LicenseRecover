name: Apply v1.2.29 one-click error dialog

on:
  push:
    branches: [ main ]
    paths:
      - scripts/apply-v1.2.29.py
      - scripts/fix-v1.2.29-dialog-newlines.py
      - .github/workflows/apply-v1.2.29.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Apply staged v1.2.29 patch
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/apply-v1.2.29.py
          python3 scripts/fix-v1.2.29-dialog-newlines.py

      - name: Review generated changes
        shell: bash
        run: |
          set -euo pipefail
          git status --short
          git diff --check
          test "$(tr -d '\r\n[:space:]' < VERSION.txt)" = "1.2.29"
          test -f release-notes/v1.2.29.md
          grep -Fq 'showOneClickFailureDialog' src/main/java/LicenseRecoverModernGUIUiPatchLauncher.java
          grep -Fq 'describeOneClickFailure' src/main/java/LicenseRecoverModernGUIUiPatchLauncher.java
          grep -Fq '复制详情' src/main/java/LicenseRecoverModernGUIUiPatchLauncher.java
          grep -Fq '打开日志' src/main/java/LicenseRecoverModernGUIUiPatchLauncher.java
          grep -Fq 'one-click failure dialog extracts stage/exit/product' src/test/java/RefactorSmokeTest.java

      - name: Commit v1.2.29 source changes
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain)" ]; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'ui: improve one-click failure diagnostics'
          git push origin HEAD:main
