name: One-time DS2406 v1.2.11 fix

on:
  push:
    branches:
      - fix/ds2406-v1.2.11
    paths:
      - .github/workflows/one-time-ds2406-v1.2.11.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ds2406-v1.2.11
          fetch-depth: 0

      - name: Apply exact DS2406 sample fix
        run: python .github/ds2406-v1.2.11-patch.py

      - name: Verify staged changes
        run: |
          set -euo pipefail
          grep -n 'DS2406' src/main/java/LicenseRecover.java src/main/java/LicenseRecoverModernGUIJavaPlan.java src/test/java/RefactorSmokeTest.java
          grep -n '^1.2.11$' VERSION.txt

      - name: Commit fix
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'v1.2.11: 修复 DS2406 授权族与 Java 校验回滚'
          git push origin HEAD:fix/ds2406-v1.2.11
