name: Finalize v1.2.2 Java batch

on:
  push:
    branches: [ work/java-plan-batch-v1.2.2 ]
    paths: [ '.github/workflows/fix-v1.2.2-final.yml' ]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '8'
      - name: Apply final fixes
        run: python3 ./scripts/fix-v1.2.2-final.py
      - name: Compile and run smoke tests
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/lr-v122-main /tmp/lr-v122-test
          mkdir -p /tmp/lr-v122-main /tmp/lr-v122-test
          javac -encoding UTF-8 -cp LicenseRecoverGUI.jar -d /tmp/lr-v122-main $(find src/main/java -maxdepth 1 -name '*.java' -print | sort)
          javac -encoding UTF-8 -cp "/tmp/lr-v122-main:LicenseRecoverGUI.jar" -d /tmp/lr-v122-test src/test/java/RefactorSmokeTest.java
          java -cp "/tmp/lr-v122-main:/tmp/lr-v122-test:LicenseRecoverGUI.jar" RefactorSmokeTest
      - name: Commit finalized v1.2.2 tree
        shell: bash
        run: |
          set -euo pipefail
          rm -f scripts/fix-v1.2.2-final.py
          rm -f .github/workflows/fix-v1.2.2-final.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'v1.2.2：修正日志定位与批量取消'
          git push origin HEAD:work/java-plan-batch-v1.2.2
