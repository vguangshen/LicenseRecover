name: Update dynamic RegStr smoke

on:
  push:
    branches: [ main ]
    paths:
      - 'scripts/update-dynamic-regstr-smoke.py'
      - '.github/workflows/update-dynamic-regstr-smoke.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: python3 scripts/update-dynamic-regstr-smoke.py
      - run: |
          git diff --check
          grep -F 'QT40101 never invents RegStr' src/test/java/RefactorSmokeTest.java
          grep -F 'QT100101 keeps RegStr unset' src/test/java/RefactorSmokeTest.java
      - shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/test/java/RefactorSmokeTest.java
          git commit -m 'test: 允许目标组件动态读取RegStr'
          git push origin HEAD:main
