name: Apply v1.2.32 release staging v3

on:
  push:
    branches: [ patch/v1.2.32-direct-helper ]
    paths:
      - .github/workflows/apply-v1.2.32-v3.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Patch release metadata and tests
        shell: bash
        run: |
          set -euo pipefail
          test "$(tr -d '\r\n' < VERSION.txt)" = "1.2.31"
          printf '1.2.32\n' > VERSION.txt
          python3 -c "from pathlib import Path; p=Path('README.md'); s=p.read_text(encoding='utf-8'); assert s.count('当前稳定版本：**v1.2.31**')==1; p.write_text(s.replace('当前稳定版本：**v1.2.31**','当前稳定版本：**v1.2.32**',1),encoding='utf-8')"
          python3 -c "from pathlib import Path; import base64; p=Path('CHANGELOG.md'); s=p.read_text(encoding='utf-8'); assert s.startswith('## [1.2.30]'); p.write_text(base64.b64decode('').decode('utf-8')+s,encoding='utf-8')"
          python3 -c "from pathlib import Path; import base64; Path('release-notes/v1.2.32.md').write_text(base64.b64decode('').decode('utf-8'),encoding='utf-8')"
          python3 -c "from pathlib import Path; import base64; p=Path('src/test/java/RefactorSmokeTest.java'); s=p.read_text(encoding='utf-8'); a=base64.b64decode('').decode(); b=base64.b64decode('').decode(); assert s.count(a)==1; p.write_text(s.replace(a,b,1),encoding='utf-8')"
          python3 -c "from pathlib import Path; import base64; p=Path('scripts/verify.ps1'); s=p.read_text(encoding='utf-8'); a=base64.b64decode('').decode(); b=base64.b64decode('').decode(); assert s.count(a)==1; p.write_text(s.replace(a,b,1),encoding='utf-8')"
          git diff --check
      - name: Commit release staging
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add VERSION.txt README.md CHANGELOG.md release-notes/v1.2.32.md src/test/java/RefactorSmokeTest.java scripts/verify.ps1
          git commit -m 'fix: keep lowercase helper in ASP.NET host AppDomain'
          git push origin HEAD:patch/v1.2.32-direct-helper
