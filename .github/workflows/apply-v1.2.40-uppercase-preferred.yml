name: Apply v1.2.40 uppercase-preferred registration chain

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/apply-v1.2.40-uppercase-preferred.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Patch v1.2.40 source, tests and metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          def read(p):
              return Path(p).read_text(encoding='utf-8')

          def write(p, s):
              Path(p).write_text(s, encoding='utf-8', newline='\n')

          def sub1(text, pattern, replacement, label, flags=0):
              out, n = re.subn(pattern, replacement, text, count=1, flags=flags)
              if n != 1:
                  raise SystemExit(f'{label}: expected 1 match, found {n}')
              return out

          def rep1(text, old, new, label):
              n = text.count(old)
              if n != 1:
                  raise SystemExit(f'{label}: expected 1 match, found {n}')
              return text.replace(old, new, 1)

          if read('VERSION.txt').strip() != '1.2.39':
              raise SystemExit('VERSION.txt is not 1.2.39')

          # ----- coordinator: uppercase modern chain is authoritative when both exist -----
          p = 'src/main/java/LicenseRecoverModernGUIAutoRecovery.java'
          s = read(p)
          s = sub1(
              s,
              r'''    static File selectDotNetRegeditAssembly\(File runtimeDir\) \{\n\s*File lower = findExactChild\(runtimeDir, "itmcRegedit\.dll"\);\n\s*if \(lower != null\) return lower;\n\s*return findExactChild\(runtimeDir, "ITMC\.Regedit\.dll"\);\n\s*\}''',
              '''    static File selectDotNetRegeditAssembly(File runtimeDir) {
              // Match ITMC.Web runtime parity: modern uppercase first, legacy lowercase fallback.
              File upper = findExactChild(runtimeDir, "ITMC.Regedit.dll");
              if (upper != null) return upper;
              return findExactChild(runtimeDir, "itmcRegedit.dll");
          }''',
              'selectDotNetRegeditAssembly')

          s = rep1(s,
              '[dotnet-chain] lowercase itmcRegedit.dll preferred via ASP.NET host; appProduct=',
              '[dotnet-chain] uppercase ITMC.Regedit.dll absent; lowercase itmcRegedit.dll compatibility fallback via ASP.NET host; appProduct=',
              'lowercase chain log')
          s = rep1(s,
              '[dotnet-chain] lowercase itmcRegedit.dll absent; uppercase ITMC.Regedit.dll fallback via hosted AppDomain; product=',
              '[dotnet-chain] uppercase ITMC.Regedit.dll preferred via hosted AppDomain; product=',
              'uppercase chain log')

          anchor = '    static String recoverDotNetLocalRegStr(File root, File runtimeDir, String product) {'
          helper = '''    static String recoverDotNetLocalRegStrFromConfig(File cfg, String product) {
              if (blank(product) || cfg == null || !cfg.isFile()) return null;
              try {
                  String encrypted = firstElement(readUtf8(cfg), "regName");
                  if (blank(encrypted)) return null;
                  String plain = desDecryptHex(encrypted.trim(), "*ITMC" + product.trim() + "OK*");
                  int begin = plain.indexOf('{'), end = plain.lastIndexOf('}');
                  if (begin < 0 || end <= begin) return null;
                  String json = plain.substring(begin, end + 1);
                  String embeddedProduct = jsonStringField(json, "ProName");
                  String regStr = normalizeProductCsv(jsonStringField(json, "RegStr"));
                  return product.trim().equalsIgnoreCase(embeddedProduct) && !blank(regStr) ? regStr : null;
              } catch (Throwable ignore) {
                  return null;
              }
          }

          ''' + anchor
          s = rep1(s, anchor, helper, 'site-root RegStr reader insertion')

          verify_needle = '            log.accept("[dotnet-stage] VERIFY: OK\\n");\n\n            if (blockNet) {'
          verify_body = '''            log.accept("[dotnet-stage] VERIFY: OK\\n");

                      if (!lowercaseChain) {
                          File siteConfig = new File(d.appRoot, "config.xml");
                          String persistedRegStr = recoverDotNetLocalRegStrFromConfig(siteConfig, appProduct);
                          if (blank(persistedRegStr))
                              throw new IOException("[MODE_VERIFY] uppercase CheckReInfo passed, but site-root config.xml has no readable modern RegStr for ProName=" + appProduct);
                          if (!blank(d.versionId) && !containsRegStrToken(persistedRegStr, d.versionId))
                              throw new IOException("[MODE_VERIFY] site-root persisted RegStr does not contain current SoftVersionID=" + d.versionId + "; RegStr=" + persistedRegStr);
                          log.accept("[dotnet-mode-verify] persisted root RegStr=" + persistedRegStr + "\\n");
                      }

                      if (blockNet) {'''
          s = rep1(s, verify_needle, verify_body, 'post-write mode verification')
          write(p, s)

          # ----- ASP.NET host helper selection: uppercase first -----
          p = 'src/dotnet/LicenseRecover.AspNetHost.cs'
          s = read(p)
          pat = r'''        if \(File\.Exists\(lower\)\)\n        \{\n            chain = "lowercase-itmcRegedit";\n            helper = Path\.Combine\(toolDir, "LicenseRecover\.NET\.exe"\);\n        \}\n        else if \(File\.Exists\(upper\)\)\n        \{\n            chain = "uppercase-ITMC\.Regedit";\n            helper = Path\.Combine\(toolDir, "LicenseRecover\.NET\.Modern\.exe"\);\n        \}'''
          repl = '''        if (File.Exists(upper))
                  {
                      chain = "uppercase-ITMC.Regedit";
                      helper = Path.Combine(toolDir, "LicenseRecover.NET.Modern.exe");
                  }
                  else if (File.Exists(lower))
                  {
                      chain = "lowercase-itmcRegedit";
                      helper = Path.Combine(toolDir, "LicenseRecover.NET.exe");
                  }'''
          s = sub1(s, pat, repl, 'AspNetHost SelectHelper')
          write(p, s)

          # ----- ASP.NET bridge preload: same order as host -----
          p = 'src/dotnet/LicenseRecover.AspNetBridge.cs'
          s = read(p)
          pat = r'''        if \(File\.Exists\(lower\)\)\n        \{\n            target = lower;\n            chain = "lowercase-itmcRegedit";\n        \}\n        else if \(File\.Exists\(upper\)\)\n        \{\n            target = upper;\n            chain = "uppercase-ITMC\.Regedit";\n        \}'''
          repl = '''        if (File.Exists(upper))
                  {
                      target = upper;
                      chain = "uppercase-ITMC.Regedit";
                  }
                  else if (File.Exists(lower))
                  {
                      target = lower;
                      chain = "lowercase-itmcRegedit";
                  }'''
          s = sub1(s, pat, repl, 'AspNetBridge preload')
          write(p, s)

          # ----- regression tests -----
          p = 'src/test/java/RefactorSmokeTest.java'
          s = read(p)
          s = rep1(s,
              'check("itmcRegedit.dll".equals(LicenseRecoverModernGUIAutoRecovery.selectDotNetRegeditAssembly(\n                        chainBin.toFile()).getName()),\n                ".NET registration chain prefers lowercase itmcRegedit.dll when both assemblies exist");',
              'check("ITMC.Regedit.dll".equals(LicenseRecoverModernGUIAutoRecovery.selectDotNetRegeditAssembly(\n                        chainBin.toFile()).getName()),\n                ".NET registration chain prefers uppercase ITMC.Regedit.dll when both assemblies exist");',
              'dual chain first expectation')
          s = rep1(s,
              'Files.delete(chainBin.resolve("itmcRegedit.dll"));',
              'Files.delete(chainBin.resolve("ITMC.Regedit.dll"));',
              'dual chain delete')
          s = rep1(s,
              'check("ITMC.Regedit.dll".equals(LicenseRecoverModernGUIAutoRecovery.selectDotNetRegeditAssembly(\n                        chainBin.toFile()).getName()),\n                ".NET registration chain falls back to uppercase ITMC.Regedit.dll only when lowercase is absent");',
              'check("itmcRegedit.dll".equals(LicenseRecoverModernGUIAutoRecovery.selectDotNetRegeditAssembly(\n                        chainBin.toFile()).getName()),\n                ".NET registration chain falls back to lowercase itmcRegedit.dll only when uppercase is absent");',
              'dual chain fallback expectation')

          test_anchor = '''        check(LicenseRecoverModernGUIAutoRecovery.containsRegStrToken(
                          LicenseRecoverModernGUIAutoRecovery.detectDotNetRegStr(yx030308ModeDetection), "YX030308"),
                  ".NET final RegStr explicitly contains the current system version mode");'''
          test_extra = test_anchor + '''

                  Path persistedModeConfig = base.resolve("persisted-modern-root-config.xml");
                  String persistedModeJson = "{\\\"RegStr\\\":\\\"YX030101,YX030102\\\",\\\"ProName\\\":\\\"YX0301\\\"}";
                  String persistedModeCipher = LicenseRecoverModernGUIAutoRecovery.desEncryptHex(
                          "12345678" + persistedModeJson, "*ITMCYX0301OK*");
                  Files.write(persistedModeConfig, Arrays.asList(
                          "<ROOT><reg><regType>1</regType><regName>" + persistedModeCipher + "</regName></reg></ROOT>"),
                          StandardCharsets.UTF_8);
                  check("YX030101,YX030102".equals(
                                  LicenseRecoverModernGUIAutoRecovery.recoverDotNetLocalRegStrFromConfig(
                                          persistedModeConfig.toFile(), "YX0301")),
                          ".NET mode verifier reads persisted RegStr from exact site-root modern config");
                  check(LicenseRecoverModernGUIAutoRecovery.recoverDotNetLocalRegStrFromConfig(
                                  persistedModeConfig.toFile(), "YX0302") == null,
                          ".NET mode verifier rejects persisted RegStr with the wrong ProName");'''
          s = rep1(s, test_anchor, test_extra, 'persisted root mode tests')
          write(p, s)

          # ----- source-level CI guards -----
          p = 'scripts/verify.ps1'
          s = read(p)
          s = rep1(s,
              "if (-not $autoSource.Contains('LicenseRecover.NET.AspNetHost.exe') -or -not $autoSource.Contains('LicenseRecover.NET.Modern.exe')) { throw '.NET one-click must use the ASP.NET host for lowercase chain plus uppercase fallback adapter.' }",
              "if (-not $autoSource.Contains('LicenseRecover.NET.AspNetHost.exe') -or -not $autoSource.Contains('LicenseRecover.NET.Modern.exe')) { throw '.NET one-click must use the ASP.NET host with uppercase modern and lowercase compatibility helpers.' }",
              'verify helper wording')
          old = "if (-not $autoSource.Contains('selectDotNetRegeditAssembly') -or -not $autoSource.Contains('detectLowercaseDotNetRegistrationProduct')) { throw '.NET target-owned lowercase-first registration-chain policy is missing.' }"
          new = '''if (-not $autoSource.Contains('selectDotNetRegeditAssembly') -or -not $autoSource.Contains('detectLowercaseDotNetRegistrationProduct')) { throw '.NET registration-chain selection or lowercase compatibility-family probe is missing.' }
          $autoUpperAt = $autoSource.IndexOf('File upper = findExactChild(runtimeDir, "ITMC.Regedit.dll");')
          $autoLowerAt = $autoSource.IndexOf('return findExactChild(runtimeDir, "itmcRegedit.dll");')
          if ($autoUpperAt -lt 0 -or $autoLowerAt -lt 0 -or $autoUpperAt -gt $autoLowerAt) { throw '.NET coordinator is not uppercase-first.' }
          $hostUpperAt = $aspHostSourceText.IndexOf('if (File.Exists(upper))')
          $hostLowerAt = $aspHostSourceText.IndexOf('else if (File.Exists(lower))')
          if ($hostUpperAt -lt 0 -or $hostLowerAt -lt 0 -or $hostUpperAt -gt $hostLowerAt) { throw 'ASP.NET host is not uppercase-first.' }
          $bridgeUpperAt = $aspBridgeSourceText.IndexOf('if (File.Exists(upper))')
          $bridgeLowerAt = $aspBridgeSourceText.IndexOf('else if (File.Exists(lower))')
          if ($bridgeUpperAt -lt 0 -or $bridgeLowerAt -lt 0 -or $bridgeUpperAt -gt $bridgeLowerAt) { throw 'ASP.NET bridge preload is not uppercase-first.' }
          if (-not $autoSource.Contains('[dotnet-mode-verify] persisted root RegStr=')) { throw '.NET site-root persisted RegStr verification is missing.' }'''
          s = rep1(s, old, new, 'verify uppercase-first policy')
          write(p, s)

          # ----- Windows hosted integration: run on main and add a valid lowercase decoy -----
          p = '.github/workflows/uppercase-host-windows-integration-v2.yml'
          s = read(p)
          s = rep1(s,
              '    branches: [ "fix/v1.2.38-uppercase-host" ]',
              '    branches: [ main, "fix/v1.2.38-uppercase-host" ]',
              'Windows integration main trigger')
          s = rep1(s,
              '      - name: Build uppercase-only fixture and host',
              '      - name: Build dual-assembly fixture and host',
              'Windows integration step name')
          compile_anchor = '''          & $csc /nologo /target:library /r:System.Web.dll /out:$bin\\ITMC.Regedit.dll (Join-Path $test 'FakeUpperRegedit.cs')
                    if ($LASTEXITCODE -ne 0) { throw "fixture compile failed: $LASTEXITCODE" }'''
          decoy = compile_anchor + '''

                    @'
                    using System;
                    namespace itmcRegedit
                    {
                        public sealed class RegeditMain
                        {
                            public RegeditMain(string productName, string encryptedCheck)
                            {
                                throw new InvalidOperationException("LOWERCASE DECOY MUST NOT BE SELECTED");
                            }
                        }
                    }
                    '@ | Set-Content -LiteralPath (Join-Path $test 'FakeLowerRegedit.cs') -Encoding UTF8
                    & $csc /nologo /target:library /out:$bin\\itmcRegedit.dll (Join-Path $test 'FakeLowerRegedit.cs')
                    if ($LASTEXITCODE -ne 0) { throw "lowercase decoy fixture compile failed: $LASTEXITCODE" }'''
          s = rep1(s, compile_anchor, decoy, 'Windows lowercase decoy insertion')
          marker = '''          foreach ($needle in @('target registration chain=uppercase-ITMC.Regedit','[FAKE_UPPER] get_RegID BaseDirectory=','helperDispatch=RunDirect/hosted-AppDomain','RESULT: OK')) {
                      if ($text.IndexOf($needle,[StringComparison]::OrdinalIgnoreCase) -lt 0) { throw "missing marker: $needle" }
                    }'''
          marker_new = marker + '''
                    if ($text.IndexOf('target registration chain=lowercase-itmcRegedit',[StringComparison]::OrdinalIgnoreCase) -ge 0) { throw 'lowercase decoy stole chain selection' }'''
          s = rep1(s, marker, marker_new, 'Windows uppercase selection assertion')
          s = s.replace("UPPERCASE HOSTED CHAIN V2 PASSED", "DUAL-ASSEMBLY UPPERCASE-PREFERRED HOSTED CHAIN PASSED")
          write(p, s)

          # ----- versioned documentation -----
          write('VERSION.txt', '1.2.40\n')

          p = 'README.md'
          s = read(p)
          s = rep1(s, '当前稳定版本：**v1.2.39**', '当前稳定版本：**v1.2.40**', 'README version')
          anchor = '避免本地授权写入成功但当前系统代号未进入 `RegStr`，最终出现“系统不支持任何模式”。'
          note = (' v1.2.40 起，当大小写注册组件同时存在时改为大写 `ITMC.Regedit.dll` 现代链优先，小写链只作为兼容回退；'
                  '现代链完成后还会重新读取站点根 `config.xml`，验证实际持久化 `RegStr` 包含当前 `SoftVersionID`。')
          s = rep1(s, anchor, anchor + note, 'README v1.2.40 note')
          write(p, s)

          p = 'README.txt'
          s = read(p)
          if s.startswith('LicenseRecover v1.2.39'):
              s = s.replace('LicenseRecover v1.2.39', 'LicenseRecover v1.2.40', 1)
          section_anchor = '软件自动更新\n------------\n'
          section = '''v1.2.40 .NET 注册链一致性修复
          ----------------------------
          - 大小写注册 DLL 同时存在时优先 ITMC.Regedit.dll 现代链；
          - itmcRegedit.dll 仅在大写组件缺失时回退；
          - Host、Bridge、Java 协调器统一链顺序；
          - 现代链结束后验证站点根 config.xml 的持久化 RegStr 包含当前 SoftVersionID。

          '''
          section = '\n'.join(x[10:] if x.startswith('          ') else x for x in section.splitlines()) + '\n'
          s = rep1(s, section_anchor, section + section_anchor, 'README.txt section')
          write(p, s)

          p = 'CHANGELOG.md'
          s = read(p)
          entry = '''## [1.2.40] - 2026-09-10

          ### Fixed

          - .NET 双注册组件部署改为 `ITMC.Regedit.dll` 现代链优先，`itmcRegedit.dll` 仅作为兼容回退，与目标 Web 运行时的链顺序保持一致。
          - Java 协调器、ASP.NET Host 与 Bridge 预加载统一使用同一选择顺序，避免 helper 和预加载组件分叉。
          - 大写现代链完成 `DoRegistry + CheckReInfo` 后，重新读取站点根 `config.xml`，按当前 `ProName` 解出实际持久化 `RegStr`，并要求其中包含当前 `SoftVersionID`；否则以 `[MODE_VERIFY]` 失败。

          ### Regression

          - Java smoke test 覆盖双 DLL 的 uppercase-first 与 lowercase-only fallback。
          - 新增站点根现代授权 `RegStr` 读取及错误 `ProName` 拒绝测试。
          - Windows hosted integration 在 `main` 上运行，并加入可加载但调用即失败的小写 decoy DLL，防止重新退化为 lowercase-first。

          '''
          entry = '\n'.join(x[10:] if x.startswith('          ') else x for x in entry.splitlines()) + '\n'
          write(p, entry + s)

          release = '''# LicenseRecover v1.2.40

          本版修复 .NET 站点“本地注册有效、连接限制可读取，但业务层仍显示系统不支持任何模式”的注册链一致性问题。

          ## 修复

          - 同时存在 `ITMC.Regedit.dll` 与 `itmcRegedit.dll` 时，大写现代链优先；只有大写组件不存在时才回退小写兼容链。
          - Java 一键恢复协调器、ASP.NET Host 和 Bridge 预加载采用完全相同的顺序。
          - 保留 v1.2.39 的 `SoftVersionID -> RegStr` 合并规则。
          - 大写链原生 `DoRegistry()` / `CheckReInfo()` 成功后，再读取站点根 `config.xml` 的实际持久化授权；`RegStr` 读不到或不含当前 `SoftVersionID` 时以 `[MODE_VERIFY]` 失败。

          ## 回归

          Windows 集成测试新增一个小写 decoy DLL；双 DLL 同时存在时必须仍完成大写链，确保以后不会重新回到 lowercase-first。
          '''
          release = '\n'.join(x[10:] if x.startswith('          ') else x for x in release.splitlines()) + '\n'
          write('release-notes/v1.2.40.md', release)

          p = 'docs/DOTNET_ONE_CLICK_COMPATIBILITY.md'
          s = read(p).rstrip() + '''

          ## v1.2.40 registration-chain parity

          When both registration generations are deployed, `ITMC.Regedit.dll` is selected before `itmcRegedit.dll`. The Java coordinator, ASP.NET host and bridge preload use the same order. After uppercase native verification succeeds, one-click reads the site-root `config.xml` again and requires a modern record whose `ProName` matches the detected product and whose persisted `RegStr` contains the current `SoftVersionID`. A stale `bin/config.xml` cannot satisfy this post-write check.
          '''
          s = '\n'.join(x[10:] if x.startswith('          ') else x for x in s.splitlines()) + '\n'
          write(p, s)

          print('v1.2.40 patch prepared')
          PY

          git diff --check
          git status --short

      - name: Commit v1.2.40 to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add VERSION.txt README.md README.txt CHANGELOG.md \
            docs/DOTNET_ONE_CLICK_COMPATIBILITY.md release-notes/v1.2.40.md \
            scripts/verify.ps1 src/main/java/LicenseRecoverModernGUIAutoRecovery.java \
            src/dotnet/LicenseRecover.AspNetHost.cs src/dotnet/LicenseRecover.AspNetBridge.cs \
            src/test/java/RefactorSmokeTest.java \
            .github/workflows/uppercase-host-windows-integration-v2.yml
          git commit -m 'fix: prefer uppercase .NET registration chain and verify persisted modes (v1.2.40)'
          git push origin HEAD:main
