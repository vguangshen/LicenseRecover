name: Apply YX0102 native identity v1.2.20

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/apply-yx0102-native-identity-v1.2.20.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply evidence-based YX0102 fix
        run: python scripts/apply-yx0102-native-identity-v1.2.20.py
      - name: Review diff
        run: git diff --check && git diff -- src/main/java/LicenseRecoverModernGUIAutoRecovery.java src/test/java/RefactorSmokeTest.java
      - name: Commit
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main/java/LicenseRecoverModernGUIAutoRecovery.java src/test/java/RefactorSmokeTest.java
          git commit -m 'fix: YX0102使用目标原生注册身份与版本库证据'
          git push origin HEAD:main
