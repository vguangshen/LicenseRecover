name: Fix v1.2.5 escapes

on:
  push:
    branches:
      - feature/java-family-model-v1.2.5
    paths:
      - .github/workflows/fix-v1.2.5-escapes.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/java-family-model-v1.2.5
      - run: python3 scripts/fix-v1.2.5-escapes.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "v1.2.5：修复 Java 正则转义"
          git push origin HEAD:feature/java-family-model-v1.2.5
