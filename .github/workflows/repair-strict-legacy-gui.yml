name: Repair strict legacy GUI

on:
  push:
    branches: [ main ]
    paths:
      - 'scripts/repair-strict-legacy-gui.py'
      - '.github/workflows/repair-strict-legacy-gui.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Restore and selectively harden legacy GUI
        run: python3 scripts/repair-strict-legacy-gui.py
      - name: Validate legacy GUI policy
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -F '目标 ITMC.Web.dll 未解析出 ProName' src/main/java/LicenseRecoverGUI.java
          grep -F 'plan.authorizationFamily, plan.regStr' src/main/java/LicenseRecoverGUI.java
          if grep -Fq 'LegacyDotNetProtocol.PRODUCT_NAME' src/main/java/LicenseRecoverGUI.java; then exit 1; fi
          if grep -Fq '+ ALL_NUMS' src/main/java/LicenseRecoverGUI.java; then exit 1; fi
      - name: Commit repaired GUI
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main/java/LicenseRecoverGUI.java
          git commit -m 'fix: 旧GUI同样禁用注册代号默认兜底'
          git push origin HEAD:main
