name: Apply GM00401 v1.2.6 support

on:
  push:
    branches: [ "fix/gm00401-v1.2.6" ]
    paths: [ ".github/workflows/apply-gm00401-v1.2.6.yml" ]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/gm00401-v1.2.6
      - name: Apply GM00401 detector patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              s = p.read_text(encoding='utf-8')
              if old not in s:
                  raise SystemExit('pattern not found in %s: %r' % (path, old[:180]))
              p.write_text(s.replace(old, new, 1), encoding='utf-8')

          src = 'src/main/java/LicenseRecoverModernGUIAutoRecovery.java'
          replace(src,
'''    static String detectProduct(File webDll,String version) {
        Set<String> s=extractUtf16Ascii(webDll);
        if(s.contains("itmcIEC"))return "itmcIEC";
        if(version!=null && version.matches("YX\\\\d{6}"))return version.substring(0,6);
        for(String x:s)if(x.matches("YX\\\\d{4}"))return x;
        TreeSet<String> derived=new TreeSet<String>(); for(String x:s)if(x.matches("YX\\\\d{6}"))derived.add(x.substring(0,6));
        return derived.size()==1?derived.first():null;
    }
    static String detectProductList(File webDll,String product) {
        Set<String>s=extractUtf16Ascii(webDll);TreeSet<String> out=new TreeSet<String>();
        if("itmcIEC".equals(product)){for(String x:s)if(x.matches("DS\\\\d{4}"))out.add(x);} else if(product!=null&&product.matches("YX\\\\d{4}")){for(String x:s)if(x.matches(Pattern.quote(product)+"\\\\d{2}"))out.add(x);}
        StringBuilder b=new StringBuilder();for(String x:out){if(b.length()>0)b.append(',');b.append(x);}return b.toString();
    }
''',
'''    static String detectProduct(File webDll,String version) {
        Set<String> s=extractUtf16Ascii(webDll);
        if(s.contains("itmcIEC"))return "itmcIEC";
        // GM00401 sample: config.xml declares the concrete GM00401 id while ITMC.Web.dll
        // contains both GM00401 and the registration family GM004. Require both strings
        // before accepting the derived family so folder/file names alone can never select it.
        if(version!=null && version.matches("GM\\\\d{5}")) {
            String family=version.substring(0,5);
            if(s.contains(version) && s.contains(family)) return family;
        }
        if(version!=null && version.matches("YX\\\\d{6}"))return version.substring(0,6);
        for(String x:s)if(x.matches("YX\\\\d{4}"))return x;
        TreeSet<String> gmFamilies=new TreeSet<String>();
        for(String x:s)if(x.matches("GM\\\\d{5}")) {
            String family=x.substring(0,5);
            if(s.contains(family)) gmFamilies.add(family);
        }
        if(gmFamilies.size()==1)return gmFamilies.first();
        TreeSet<String> derived=new TreeSet<String>(); for(String x:s)if(x.matches("YX\\\\d{6}"))derived.add(x.substring(0,6));
        return derived.size()==1?derived.first():null;
    }
    static String detectProductList(File webDll,String product) {
        Set<String>s=extractUtf16Ascii(webDll);TreeSet<String> out=new TreeSet<String>();
        if("itmcIEC".equals(product)){for(String x:s)if(x.matches("DS\\\\d{4}"))out.add(x);}
        else if(product!=null&&product.matches("YX\\\\d{4}")){for(String x:s)if(x.matches(Pattern.quote(product)+"\\\\d{2}"))out.add(x);}
        else if(product!=null&&product.matches("GM\\\\d{3}")){for(String x:s)if(x.matches(Pattern.quote(product)+"\\\\d{2}"))out.add(x);}
        StringBuilder b=new StringBuilder();for(String x:out){if(b.length()>0)b.append(',');b.append(x);}return b.toString();
    }
''')

          test = 'src/test/java/RefactorSmokeTest.java'
          replace(test,
'''        Path dsFixture = base.resolve("DS01-Web.dll");
        writeUtf16Fixture(dsFixture, "itmcIEC", "DS0101", "DS0107", "DS0110", "DS0112");
        check("itmcIEC".equals(LicenseRecoverModernGUIAutoRecovery.detectProduct(
                        dsFixture.toFile(), null)),
                "one-click detects itmcIEC DS01xx ProName");
        check("DS0101,DS0107,DS0110,DS0112".equals(
                        LicenseRecoverModernGUIAutoRecovery.detectProductList(
                                dsFixture.toFile(), "itmcIEC")),
                "one-click derives DS01xx local product list");

''',
'''        Path dsFixture = base.resolve("DS01-Web.dll");
        writeUtf16Fixture(dsFixture, "itmcIEC", "DS0101", "DS0107", "DS0110", "DS0112");
        check("itmcIEC".equals(LicenseRecoverModernGUIAutoRecovery.detectProduct(
                        dsFixture.toFile(), null)),
                "one-click detects itmcIEC DS01xx ProName");
        check("DS0101,DS0107,DS0110,DS0112".equals(
                        LicenseRecoverModernGUIAutoRecovery.detectProductList(
                                dsFixture.toFile(), "itmcIEC")),
                "one-click derives DS01xx local product list");

        Path gmFixture = base.resolve("GM004-Web.dll");
        writeUtf16Fixture(gmFixture, "GM004", "GM00401", "SoftVersionID", "ProName", "RegStr");
        check("GM004".equals(LicenseRecoverModernGUIAutoRecovery.detectProduct(
                        gmFixture.toFile(), "GM00401")),
                "one-click confirms GM004 family only when DLL contains family and concrete id");
        check("GM00401".equals(LicenseRecoverModernGUIAutoRecovery.detectProductList(
                        gmFixture.toFile(), "GM004")),
                "one-click derives GM00401 RegStr from target assembly strings");

''')

          Path('VERSION.txt').write_text('1.2.6\n', encoding='utf-8')

          p=Path('README.md'); s=p.read_text(encoding='utf-8')
          s=s.replace('当前稳定版本：**v1.2.5**','当前稳定版本：**v1.2.6**',1)
          old='支持包含 `ITMC.Web.dll` 与 `ITMC.Regedit.dll` / `itmcRegedit.dll` 等组件的 ASP.NET / .NET 应用。DS01xx、YX0301/YX0302/YX0303 等已验证家族会按检测结果自动选择兼容路径。'
          new=old+' v1.2.6 根据 GM00401 实际安装样本新增 GM004 家族识别：仅当 `config.xml` 的具体 `GM00401` 与 `ITMC.Web.dll` 内同时存在 `GM00401` + `GM004` 证据时确认 `ProName=GM004`，并从 DLL 得到 `RegStr=GM00401`；不会采用该样本 `Web.config` 中遗留的 `productName=YX0301`。'
          if old not in s: raise SystemExit('README .NET marker missing')
          p.write_text(s.replace(old,new,1),encoding='utf-8')

          p=Path('README.txt'); s=p.read_text(encoding='utf-8')
          s=s.replace('LicenseRecover v1.2.5','LicenseRecover v1.2.6',1)
          marker='软件自动更新\n------------\n'
          block='v1.2.6 GM00401 .NET 识别\n-------------------------\n- 根据实际 GM00401 配置与 ITMC.Web.dll，确认授权产品族 GM004；\n- 只有 DLL 同时包含 GM004 与具体 GM00401 时才接受该映射，避免仅按目录名猜测；\n- GM004 家族的 RegStr 从 DLL 中同族具体产品项提取，本样本为 GM00401；\n- 忽略该样本 Web.config 中与实际产品冲突的历史 productName=YX0301 字段。\n\n'
          if marker not in s: raise SystemExit('README.txt marker missing')
          p.write_text(s.replace(marker,block+marker,1),encoding='utf-8')

          p=Path('CHANGELOG.md'); s=p.read_text(encoding='utf-8')
          anchor='All notable user-visible and engineering changes are tracked here from the first stable release onward.\n\n'
          entry='''## [1.2.6] - 2026-09-07\n\n### Fixed\n\n- 根据 GM00401 实际安装样本补齐 .NET `GM004` 产品族识别；此前只能读取 `SoftVersionID=GM00401`，但由于 detector 仅支持 itmcIEC / YX 系列而无法得到 ProName。\n- GM004 识别要求目标 `ITMC.Web.dll` 同时包含具体 `GM00401` 与家族 `GM004`，不会仅凭目录名或 SoftVersionID 猜测产品族。\n- GM004 的 RegStr 从 DLL 内同家族具体产品项提取；当前样本得到 `GM00401`。\n- 不采用该样本 `Web.config` 中与实际 GM00401 配置冲突的遗留 `productName=YX0301`。\n\n### Tests\n\n- 新增 GM004 / GM00401 UTF-16 程序集字符串 fixture，覆盖 ProName 与 RegStr 推导。\n\n'''
          if anchor not in s: raise SystemExit('CHANGELOG anchor missing')
          p.write_text(s.replace(anchor,anchor+entry,1),encoding='utf-8')

          Path('release-notes/v1.2.6.md').write_text('''# LicenseRecover v1.2.6\n\n本版本根据实际 GM00401 ASP.NET 安装样本补齐 GM004 家族识别。\n\n## GM00401 样本结论\n\n- 根目录 `config.xml` 明确 `SoftVersionID=GM00401`，但没有 `regInfo`。\n- 目标 `ITMC.Web.dll` 同时包含 `GM00401` 与 `GM004`，且 `GM004` 位于 SystemSoft / SoftVersionID / WebSerSoftNo / regName / regType 等注册配置字符串附近。\n- 因此本版本确认该样本的授权产品族 / ProName 为 `GM004`。\n- DLL 中当前仅发现同族具体项 `GM00401`，因此 RegStr 为 `GM00401`。\n- `Web.config` 中存在 `productName=YX0301`，但它与实际 `config.xml`、DLL 产品标识冲突，视为历史遗留业务配置，不参与授权产品识别。\n\n## 安全识别规则\n\n程序不会仅看到 `GM00401` 文件夹名就推导 `GM004`。只有目标程序集自身同时包含具体产品ID和对应家族字符串时才确认映射；否则保持产品号未确认并拒绝 .NET 一键写回。\n\n原有 Java 家族模型、批量扫描、v1.2.4 更新器和其他 .NET 家族行为保持不变。\n''',encoding='utf-8')

          Path('.github/workflows/apply-gm00401-v1.2.6.yml').unlink()
          PY
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "v1.2.6：补齐 GM00401 .NET 产品族识别"
          git push origin HEAD:fix/gm00401-v1.2.6
