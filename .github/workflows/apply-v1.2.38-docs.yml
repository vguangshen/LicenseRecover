name: Apply v1.2.38 docs update

on:
  push:
    branches: [ "fix/v1.2.38-uppercase-host" ]
    paths:
      - "scripts/apply-v1.2.38-docs.py"
      - ".github/workflows/apply-v1.2.38-docs.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Apply docs update
        run: python3 scripts/apply-v1.2.38-docs.py
      - name: Commit docs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md CHANGELOG.md
          if git diff --cached --quiet; then
            echo 'No docs changes to commit.'
            exit 0
          fi
          git commit -m 'docs: document v1.2.38 uppercase hosted chain'
          git push origin HEAD:fix/v1.2.38-uppercase-host
