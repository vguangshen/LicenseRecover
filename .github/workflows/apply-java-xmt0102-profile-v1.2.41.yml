name: Apply Java XMT0102 runtime-profile parity

on:
  push:
    branches:
      - refactor/java-native-host-v1.2.41
    paths:
      - .github/workflows/apply-java-xmt0102-profile-v1.2.41.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refactor/java-native-host-v1.2.41
          fetch-depth: 0
      - name: Apply patch
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/xmt0102_patch.py
          python3 /tmp/xmt0102_patch.py
      - name: Commit patch and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-java-xmt0102-profile-v1.2.41.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main/java/LicenseRecoverModernGUIJavaPlan.java src/test/java/RefactorSmokeTest.java docs/java-runtime-profile-v1.2.41.md .github/workflows/apply-java-xmt0102-profile-v1.2.41.yml
          git commit -m 'fix: mirror XMT0102 JSON RegStr startup flow'
          git push origin HEAD:refactor/java-native-host-v1.2.41
