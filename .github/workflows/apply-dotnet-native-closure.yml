name: Apply .NET native registration closure

on:
  push:
    branches: [ main ]
    paths:
      - 'scripts/apply-dotnet-native-closure.py'
      - '.github/workflows/apply-dotnet-native-closure.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Apply selective .NET transplant
        run: python3 scripts/apply-dotnet-native-closure.py
      - name: Validate selective scope
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -F 'gencode -> DoRegistry -> CheckReInfo' src/main/java/LicenseRecoverModernGUIAutoRecovery.java
          grep -F 'LegacyJavaRegistrationMetadata.inspect' src/main/java/LicenseRecoverModernGUIJavaPlan.java
          grep -F 'target RegeditMain.CheckReInfo() did not confirm the native write-back' src/main/java/LicenseRecoverModernGUIAutoRecovery.java
          grep -F 'native .NET one-click parses target request code' src/test/java/RefactorSmokeTest.java
          grep -F 'LicenseRecover.NET helper command surface' scripts/verify.ps1
      - name: Commit .NET native closure to main
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain -- src/main/java/LicenseRecoverModernGUIAutoRecovery.java src/test/java/RefactorSmokeTest.java scripts/verify.ps1)" ]; then
            echo 'No source changes produced.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main/java/LicenseRecoverModernGUIAutoRecovery.java \
                  src/test/java/RefactorSmokeTest.java \
                  scripts/verify.ps1
          git commit -m 'fix: .NET一键Patch改为应用原生注册闭环'
          git push origin HEAD:main
