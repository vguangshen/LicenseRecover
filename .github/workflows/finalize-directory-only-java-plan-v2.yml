name: Finalize directory-only Java plan v2

on:
  push:
    branches: [ main ]
    paths:
      - 'scripts/finalize-directory-only-java-plan-v2.py'
      - '.github/workflows/finalize-directory-only-java-plan-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Apply strict Java plan
        run: python3 scripts/finalize-directory-only-java-plan-v2.py
      - name: Validate strict plan
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -F 'No product-family/runtime-id guessing here' src/main/java/LicenseRecoverModernGUIJavaPlan.java
          grep -F 'YT00129 inferred QT0420 is not accepted without target-directory evidence' src/test/java/RefactorSmokeTest.java
          ! grep -Fq 'FALLBACK_ALL_NUMS' src/main/java/LicenseRecoverModernGUIJavaPlan.java
          ! grep -Fq 'return "QT0420"' src/main/java/LicenseRecoverModernGUIJavaPlan.java
      - name: Commit strict plan
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main/java/LicenseRecoverModernGUIJavaPlan.java src/test/java/RefactorSmokeTest.java scripts/verify.ps1
          git commit -m 'fix: Java计划只接受目标目录注册证据'
          git push origin HEAD:main
