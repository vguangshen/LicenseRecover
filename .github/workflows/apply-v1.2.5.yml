name: Apply v1.2.5 patch

on:
  push:
    branches:
      - feature/java-family-model-v1.2.5
    paths:
      - .github/workflows/apply-v1.2.5.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/java-family-model-v1.2.5
      - name: Apply patch
        run: python3 scripts/apply-v1.2.5.py
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "v1.2.5：区分 Java 授权族与运行校验ID"
          git push origin HEAD:feature/java-family-model-v1.2.5
