name: Apply batch scan progress

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply scan progress patch
        run: python3 scripts/apply-batch-scan-progress.py
      - name: Validate patch
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          changed="$(git diff --name-only)"
          test "$changed" = "src/main/java/LicenseRecoverModernGUI.java"
          grep -q 'new SwingWorker<Void, BatchScanRow>()' src/main/java/LicenseRecoverModernGUI.java
          grep -q '正在扫描：' src/main/java/LicenseRecoverModernGUI.java
          grep -q '扫描已取消：已完成' src/main/java/LicenseRecoverModernGUI.java
          grep -q 'scanBatch(true)' src/main/java/LicenseRecoverModernGUI.java
      - name: Commit to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main/java/LicenseRecoverModernGUI.java
          git commit -m 'feat: 批量扫描增加实时进度并移出UI线程'
          git push origin HEAD:main
