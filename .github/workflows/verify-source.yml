name: Verify source

on:
  push:
    branches: [ main, "refactor/**" ]
  pull_request:

concurrency:
  group: verify-source-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile-java:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '8'
      - name: Prepare Windows native and .NET helper toolchains
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v x86_64-w64-mingw32-gcc >/dev/null 2>&1 \
             || ! command -v x86_64-w64-mingw32-windres >/dev/null 2>&1 \
             || ! command -v mcs >/dev/null 2>&1; then
            # The hosted image may carry Chrome apt metadata in either .list or
            # deb822 .sources form. Its index rotates independently and can cause
            # a transient Hash Sum mismatch; none of the toolchains below use it.
            shopt -s nullglob
            for source in /etc/apt/sources.list.d/*; do
              if grep -q 'dl.google.com/linux/chrome' "$source" 2>/dev/null; then
                echo "Disabling unrelated Chrome apt source: $source"
                sudo mv "$source" "$source.disabled"
              fi
            done
            if [ -f /etc/apt/sources.list ] && grep -q 'dl.google.com/linux/chrome' /etc/apt/sources.list; then
              sudo sed -i '\|dl.google.com/linux/chrome|s|^|# disabled by LicenseRecover CI: |' /etc/apt/sources.list
            fi
            timeout 120s sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
            timeout 240s sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y --no-install-recommends \
              gcc-mingw-w64-x86-64 binutils-mingw-w64-x86-64 mono-mcs libmono-system-web4.0-cil
          fi
          x86_64-w64-mingw32-gcc --version | head -n 1
          mcs --version
      - name: Prepare Java sample compatibility
        shell: bash
        run: |
          python3 ./scripts/prepare-java-sample-profiles.py
          python3 ./scripts/prepare-java-detection.py
      - name: Prepare local authorization runtime
        shell: pwsh
        run: ./scripts/prepare-local-auth-userid.ps1
      - name: Fetch embedded Corretto JRE runtime
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p build/runtime-jre
          gh release download runtime-corretto8-8.492.09.2-win-x64 \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'LicenseRecover-jre8-win-x64.zip' \
            --pattern 'LicenseRecover-jre8-win-x64.sha256' \
            --pattern 'JRE_SOURCE_NOTICE.txt' \
            --dir build/runtime-jre
      - name: Compile, test and assemble verified distribution
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/verify.ps1
      - name: Build and package native EXE launcher
        shell: pwsh
        run: ./scripts/package-native-launcher.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: LicenseRecover-latest
          path: |
            build/LicenseRecover-latest.zip
            build/LicenseRecover-update.zip
            build/SHA256SUMS.txt
          if-no-files-found: error
      - name: Sync verified runtime to refactor branch
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/refactor/')
        shell: bash
        run: |
          set -euo pipefail
          cp build/LicenseRecoverOverlay.jar LicenseRecoverOverlay.jar
          tracked=(
            src/main/java/LicenseRecover.java
            src/main/java/AppDetector.java
            src/main/java/LicenseRecoverModernGUIAutoRecovery.java
            src/test/java/RefactorSmokeTest.java
            LicenseRecover.jar
            LicenseRecoverOverlay.jar
          )
          if [ -z "$(git status --porcelain -- "${tracked[@]}")" ]; then
            echo 'Verified source/runtime already matches the branch.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "${tracked[@]}"
          git commit -m '同步Java样本识别与一键授权运行时'
          git push origin "HEAD:${GITHUB_REF_NAME}"
      - name: Publish rolling latest release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag='rolling-latest'
          title='LicenseRecover Rolling Latest'
          notes_file='build/rolling-release-notes.md'

          cat > "$notes_file" <<EOF
          Automated verified build from main.

          Commit: ${GITHUB_SHA}
          Workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}

          Assets:
          - LicenseRecover-latest.zip (portable, embedded JRE)
          - LicenseRecover-update.zip (slim self-update package)
          - SHA256SUMS.txt

          This is a rolling prerelease. The tag moves to the latest successfully verified main commit.
          EOF

          git tag -f "$tag" "$GITHUB_SHA"
          git push --force origin "refs/tags/$tag"

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --title "$title" --notes-file "$notes_file" --prerelease
          else
            gh release create "$tag" --title "$title" --notes-file "$notes_file" --prerelease
          fi

          gh release upload "$tag" \
            build/LicenseRecover-latest.zip \
            build/LicenseRecover-update.zip \
            build/SHA256SUMS.txt \
            --clobber
      - name: Publish versioned stable release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n[:space:]' < VERSION.txt)"
          tag="v${version}"
          notes_file="release-notes/${tag}.md"

          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid VERSION.txt value: $version" >&2
            exit 1
          fi
          if [ ! -f "$notes_file" ]; then
            echo "Missing stable release notes: $notes_file" >&2
            exit 1
          fi

          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Stable release $tag already exists; leaving it unchanged."
            exit 0
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "Tag $tag exists without a matching GitHub Release; refusing to overwrite it." >&2
            exit 1
          fi

          gh release create "$tag" \
            build/LicenseRecover-latest.zip \
            build/LicenseRecover-update.zip \
            build/SHA256SUMS.txt \
            --target "$GITHUB_SHA" \
            --title "LicenseRecover $tag" \
            --notes-file "$notes_file"
