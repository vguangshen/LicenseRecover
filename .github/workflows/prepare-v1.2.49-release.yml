name: Prepare v1.2.49 release

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/prepare-v1.2.49-release.yml'

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - name: Prepare v1.2.49 metadata
        shell: python
        run: |
          from pathlib import Path
          from textwrap import dedent

          Path('VERSION.txt').write_text('1.2.49\n', encoding='utf-8')

          readme = Path('README.md')
          text = readme.read_text(encoding='utf-8')
          old = '当前稳定版本：**v1.2.48**'
          if old not in text:
              raise SystemExit('README v1.2.48 anchor missing')
          readme.write_text(text.replace(old, '当前稳定版本：**v1.2.49**', 1), encoding='utf-8')

          changelog = Path('CHANGELOG.md')
          oldlog = changelog.read_text(encoding='utf-8')
          if oldlog.startswith('## 1.2.49'):
              raise SystemExit('CHANGELOG already contains v1.2.49')
          entry = dedent('''\
              ## 1.2.49 - 2026-09-13

              ### Fixed
              - 修复另一种真实部署的 `DS50109` 结构仍可能显示“待确认”的问题：根 `systemConfig.yml` 的应用模式为 `DS50109`，而 `WEB-INF/classes/config.xml` 的 RegisterMain 产品实际为 `DS501`。
              - 将 DS501 的应用模式、授权族/运行产品与 RegStr 分离：应用模式保持 `DS50109`，目标原生注册链使用 `DS501`，RegStr 必须包含具体模式 `DS50109`。
              - 保持 fail-closed：只有目标 `SystemInfo`、`RegisterContant`、`RegisterListener`、`RegisterService` 与 `RegisterController` 同时证明该关系时才允许自动恢复。

              ### Verification
              - 使用用户提供的真实精简 DS50109 服务器样本核对 classes/config 与目标 class 调用链。
              - 新增部署版回归：`AuthorizationFamily=DS501`, `RuntimeProductID=DS501`, `RegStr=DS50109`, `automaticRecoveryReady=true`。
              - 删除目标本地 `DS501 -> doRegistry` 证据后，同一夹具必须回到 BLOCKED，避免按版本前缀猜测。
              - 完整 Verify source、Java 8 回归、备份安全检查与原生 EXE 打包通过后发布。

          ''')
          changelog.write_text(entry + oldlog, encoding='utf-8')

          notes = Path('release-notes/v1.2.49.md')
          notes.write_text(dedent('''\
              # LicenseRecover v1.2.49

              本版修复真实 DS50109 服务器部署结构在批量扫描中仍可能显示“待确认”的问题。

              ## 根因

              该部署同时存在三层身份：

              - `systemConfig.yml`: 当前应用模式 `DS50109`；
              - `WEB-INF/classes/config.xml`: RegisterMain 产品 `DS501`，并枚举包含 `DS50109` 的同族 System；
              - 目标启动校验：`RegisterMain(DS501)` 的 RegStr 必须包含当前应用模式 `DS50109`。

              旧逻辑更偏向“classes/config SoftVersionID 等于具体应用模式”的 DS501 布局，因此对这一真实部署会缺少运行注册 ID。

              ## 修复

              - 目标自身证据确认后，批量计划使用 `AuthorizationFamily=DS501`、`RuntimeProductID=DS501`。
              - 当前具体应用模式仍是 `DS50109`，并作为该部署需要持久化/验证的 RegStr token。
              - 自动恢复资格要求目标自身同时证明配置加载、启动校验、本地 doRegistry 和 newRegistry 链；缺任一关键证据即保持 BLOCKED。
              - v1.2.48 的 YX030506 PRODUCT_ALL_NUM 处理保持不变。

              ## 预期扫描结果

              `SoftVersionID=DS50109`  
              `AuthorizationFamily=DS501`  
              `RuntimeProductID=DS501`  
              `RegStr=DS50109`  
              `automaticRecoveryReady=true`
          '''), encoding='utf-8')
      - name: Validate release metadata
        shell: bash
        run: |
          set -euo pipefail
          test "$(tr -d '\r\n[:space:]' < VERSION.txt)" = '1.2.49'
          grep -q '当前稳定版本：\*\*v1.2.49\*\*' README.md
          grep -q '^## 1.2.49 - 2026-09-13' CHANGELOG.md
          test -f release-notes/v1.2.49.md
          git diff --check
      - name: Commit metadata and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/prepare-v1.2.49-release.yml
          git add VERSION.txt README.md CHANGELOG.md release-notes/v1.2.49.md
          git diff --cached --check
          git commit -m 'release: prepare v1.2.49 for deployed DS50109 layout'
          git push origin HEAD:main
