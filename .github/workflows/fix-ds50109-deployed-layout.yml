name: Fix deployed DS50109 runtime identity

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/fix-ds50109-deployed-layout.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '8'
      - name: Patch DS501 deployed identity model and regression
        shell: python
        run: |
          from pathlib import Path

          plan = Path('src/main/java/LicenseRecoverModernGUIJavaPlan.java')
          s = plan.read_text(encoding='utf-8')

          old = '''        String productAllPrimary = confirmedProductAllNumPrimaryRuntime(
                root, concrete, family, configured);
        if (!blank(productAllPrimary)) return productAllPrimary;

        if (blank(configured) || !concrete.equalsIgnoreCase(configured.trim())) return null;
'''
          new = '''        String productAllPrimary = confirmedProductAllNumPrimaryRuntime(
                root, concrete, family, configured);
        if (!blank(productAllPrimary)) return productAllPrimary;

        String ds501Primary = confirmedDs501FamilyRuntime(root, concrete, family, configured);
        if (!blank(ds501Primary)) return ds501Primary;

        if (blank(configured) || !concrete.equalsIgnoreCase(configured.trim())) return null;
'''
          if old not in s:
              raise SystemExit('config-driven runtime anchor missing')
          s = s.replace(old, new, 1)

          old = '''        String concrete = softId.trim();
        String family = confirmedFamily.trim();
        String runtime = confirmedRuntimeProduct.trim();
        if (!concrete.equalsIgnoreCase(runtime)) return null;
        if (!concrete.toUpperCase(Locale.ROOT).startsWith(family.toUpperCase(Locale.ROOT))) return null;

        String ymlVersion = readSystemConfigVersionId(root);
'''
          new = '''        String concrete = softId.trim();
        String family = confirmedFamily.trim();
        String runtime = confirmedRuntimeProduct.trim();
        if ("DS501".equalsIgnoreCase(family) && family.equalsIgnoreCase(runtime)) {
            File config = new File(root, "WEB-INF" + File.separator + "classes"
                    + File.separator + "config.xml");
            String configured = readElement(config, "SoftVersionID");
            if (!blank(confirmedDs501FamilyRuntime(root, concrete, family, configured))) return concrete;
        }
        if (!concrete.equalsIgnoreCase(runtime)) return null;
        if (!concrete.toUpperCase(Locale.ROOT).startsWith(family.toUpperCase(Locale.ROOT))) return null;

        String ymlVersion = readSystemConfigVersionId(root);
'''
          if old not in s:
              raise SystemExit('primary RegStr anchor missing')
          s = s.replace(old, new, 1)

          anchor = '''    static boolean confirmedProductAllNumRuntimeProduct(File classes) {
'''
          helper = '''    /**
     * Real deployed DS501xx layout: systemConfig.yml carries the concrete application
     * mode (for example DS50109), while WEB-INF/classes/config.xml supplies the
     * RegisterMain product DS501 and separately enumerates the concrete System ids.
     * Accept DS501 as the runtime product only when the target startup and local
     * registration code independently prove the same relationship.
     */
    static String confirmedDs501FamilyRuntime(File root, String softId,
                                              String confirmedFamily,
                                              String configuredProduct) {
        if (root == null || blank(softId) || blank(confirmedFamily) || blank(configuredProduct)) return null;
        String concrete = softId.trim();
        String family = confirmedFamily.trim();
        if (!concrete.toUpperCase(Locale.ROOT).startsWith("DS501")
                || !"DS501".equalsIgnoreCase(family)
                || !family.equalsIgnoreCase(configuredProduct.trim())) return null;

        String ymlVersion = readSystemConfigVersionId(root);
        if (blank(ymlVersion) || !concrete.equalsIgnoreCase(ymlVersion.trim())) return null;

        File classes = new File(root, "WEB-INF" + File.separator + "classes");
        File config = new File(classes, "config.xml");
        if (!hasEnumeratedClassesFamily(config, family, concrete)) return null;

        File systemInfo = new File(classes, "com" + File.separator + "itmc" + File.separator
                + "register" + File.separator + "utils" + File.separator + "SystemInfo.class");
        File registerContant = new File(classes, "com" + File.separator + "itmc" + File.separator
                + "register" + File.separator + "utils" + File.separator + "RegisterContant.class");
        File listener = new File(classes, "com" + File.separator + "itmc" + File.separator
                + "register" + File.separator + "service" + File.separator + "RegisterListener.class");
        File service = new File(classes, "com" + File.separator + "itmc" + File.separator
                + "register" + File.separator + "service" + File.separator + "RegisterService.class");
        File controller = new File(classes, "com" + File.separator + "itmc" + File.separator
                + "register" + File.separator + "controller" + File.separator + "RegisterController.class");

        if (!classFileContainsAll(systemInfo, "config.xml", "SystemSoft", "registerId")) return null;
        if (!classFileContainsAll(registerContant, "global.system.VersionID", "versionID",
                "java/util/Properties", "getProperty")) return null;
        if (!classFileContainsAll(listener,
                "com/itmc/register/utils/SystemInfo", "registerId",
                "itmc/regedit/RegisterMain", "checkReInfo", "getRegInfo", "getRegStr",
                "com/itmc/register/utils/RegisterContant", "versionID", "contains")) return null;
        if (!classFileContainsAll(service, family, "itmc/regedit/RegisterMain", "doRegistry")) return null;
        if (!classFileContainsAll(controller, family, "itmc/regedit/RegisterMain", "newRegistry")) return null;
        return family;
    }

'''
          if anchor not in s:
              raise SystemExit('helper insertion anchor missing')
          s = s.replace(anchor, helper + anchor, 1)
          plan.write_text(s, encoding='utf-8')

          test = Path('src/test/java/RefactorSmokeTest.java')
          t = test.read_text(encoding='utf-8')
          anchor = '''        Path ds501WeakRoot = base.resolve("java-DS50112-weak-primary-regstr");
'''
          block = '''        // Real deployed DS50109 variant supplied from the production server:
        // systemConfig.yml mode is DS50109, but classes/config.xml RegisterMain product is DS501.
        Files.write(ds501Classes.resolve("config.xml"), Arrays.asList(
                "<ROOT><reg><regType>3</regType></reg><SystemSoft><SoftVersionID>DS501</SoftVersionID></SystemSoft>"
                        + "<System id='DS50101'/><System id='DS50105'/><System id='DS50106'/>"
                        + "<System id='DS50107'/><System id='DS50108'/><System id='DS50109'/></ROOT>"),
                StandardCharsets.UTF_8);
        Files.write(ds501Listener,
                "com/itmc/register/utils/SystemInfo registerId itmc/regedit/RegisterMain checkReInfo getRegInfo getRegStr "
                        .concat("com/itmc/register/utils/RegisterContant versionID contains")
                        .getBytes(StandardCharsets.US_ASCII));
        Path ds501Service = ds501Classes.resolve("com/itmc/register/service/RegisterService.class");
        Path ds501Controller = ds501Classes.resolve("com/itmc/register/controller/RegisterController.class");
        Files.createDirectories(ds501Controller.getParent());
        Files.write(ds501Service,
                "DS501 itmc/regedit/RegisterMain doRegistry".getBytes(StandardCharsets.US_ASCII));
        Files.write(ds501Controller,
                "DS501 itmc/regedit/RegisterMain newRegistry".getBytes(StandardCharsets.US_ASCII));
        ds501Plan = LicenseRecoverModernGUIJavaPlan.inspect(ds501Root.toFile());
        check("DS501".equals(ds501Plan.authorizationFamily)
                        && "DS501".equals(ds501Plan.runtimeProductId)
                        && "DS50109".equals(ds501Plan.regStr)
                        && ds501Plan.automaticRecoveryReady,
                "DS50109 deployed family-config variant confirms DS501 runtime and concrete DS50109 RegStr");
        Files.write(ds501Service,
                "itmc/regedit/RegisterMain doRegistry".getBytes(StandardCharsets.US_ASCII));
        ds501Plan = LicenseRecoverModernGUIJavaPlan.inspect(ds501Root.toFile());
        check(ds501Plan.runtimeProductId == null && !ds501Plan.automaticRecoveryReady,
                "DS50109 family-config variant stays fail-closed without local DS501 doRegistry proof");

'''
          if anchor not in t:
              raise SystemExit('DS501 regression insertion anchor missing')
          t = t.replace(anchor, block + anchor, 1)
          test.write_text(t, encoding='utf-8')

          proof = Path('.ci/ds50109-real-sample-proof.txt')
          proof.parent.mkdir(parents=True, exist_ok=True)
          proof.write_text('''Deployed DS50109 reduced-sample evidence verified 2026-09-13

systemConfig.yml: global.system.VersionID=DS50109
WEB-INF/classes/config.xml SoftVersionID: DS501
WEB-INF/classes/config.xml enumerates DS50101, DS50105, DS50106, DS50107, DS50108, DS50109.
SystemInfo.class loads classes/config.xml SystemSoft into registerId.
RegisterContant.class loads global.system.VersionID into versionID.
RegisterListener.class constructs RegisterMain(SystemInfo.registerId), calls checkReInfo/getRegInfo,
and requires getRegInfo().getRegStr().contains(RegisterContant.versionID).
RegisterService.class local registration constructs RegisterMain("DS501") and calls doRegistry.
RegisterController.class local request-code generation constructs RegisterMain("DS501") and calls newRegistry.

Expected batch-plan result:
AuthorizationFamily=DS501
RuntimeProductID=DS501
RegStr=DS50109
automaticRecoveryReady=true

No database credentials or existing authorization material from the sample are stored here.
''', encoding='utf-8')
      - name: Compile and smoke test
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build/ds501-check
          mkdir -p build/ds501-check/main build/ds501-check/test
          javac -encoding UTF-8 -cp LicenseRecoverGUI.jar -d build/ds501-check/main src/main/java/*.java
          javac -encoding UTF-8 -cp "build/ds501-check/main:LicenseRecoverGUI.jar" -d build/ds501-check/test src/test/java/RefactorSmokeTest.java
          java -cp "build/ds501-check/main:build/ds501-check/test:LicenseRecoverGUI.jar" RefactorSmokeTest
      - name: Commit fix and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/fix-ds50109-deployed-layout.yml
          git add src/main/java/LicenseRecoverModernGUIJavaPlan.java src/test/java/RefactorSmokeTest.java .ci/ds50109-real-sample-proof.txt
          git diff --cached --check
          git commit -m 'fix: support deployed DS50109 family runtime layout'
          git push origin HEAD:main
