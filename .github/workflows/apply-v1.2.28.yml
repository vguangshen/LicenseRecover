name: Apply v1.2.28 lowercase .NET chain fix

on:
  push:
    branches: [ main ]
    paths:
      - scripts/apply-v1.2.28.py
      - .github/workflows/apply-v1.2.28.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Apply staged v1.2.28 patch
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/apply-v1.2.28.py

      - name: Review generated changes
        shell: bash
        run: |
          set -euo pipefail
          git status --short
          git diff --check
          test "$(tr -d '\r\n[:space:]' < VERSION.txt)" = "1.2.28"
          test -f release-notes/v1.2.28.md
          grep -Fq 'selectDotNetRegeditAssembly' src/main/java/LicenseRecoverModernGUIAutoRecovery.java
          grep -Fq 'detectLowercaseDotNetRegistrationProduct' src/main/java/LicenseRecoverModernGUIAutoRecovery.java
          grep -Fq 'registrationProduct' src/main/java/LicenseRecoverModernGUIAutoRecovery.java
          grep -Fq 'lowercase itmcRegedit.dll preferred' src/main/java/LicenseRecoverModernGUIAutoRecovery.java
          grep -Fq 'lowercase YX030101 registration family' src/test/java/RefactorSmokeTest.java
          grep -Fq 'lowercase YX0102 registration family' src/test/java/RefactorSmokeTest.java

      - name: Commit v1.2.28 source changes
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain)" ]; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: prefer target lowercase .NET registration chain'
          git push origin HEAD:main
