name: Fix YX JSON parser

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/fix-yx-json-parser.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Fix parser
        run: python3 scripts/fix-yx-json-parser.py
      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -Fq 'String marker = "\"" + name + "\"";' src/main/java/LicenseRecoverModernGUIAutoRecovery.java
          grep -Fq "json.indexOf(':', key + marker.length())" src/main/java/LicenseRecoverModernGUIAutoRecovery.java
      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main/java/LicenseRecoverModernGUIAutoRecovery.java
          git commit -m 'fix: 修正YX本地授权字段解析编译错误'
          git push origin HEAD:main
