name: One-time RegisterMain 2-arg v1.2.12 fix

on:
  push:
    branches:
      - fix/registermain-2arg-v1.2.12

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/registermain-2arg-v1.2.12
          fetch-depth: 0
      - name: Apply patch
        run: python3 scripts/one-time-registermain-2arg-v1.2.12.py
      - name: Verify patch
        run: |
          grep -n 'instantiateRegisterMainCompatible' src/main/java/LicenseRecover.java src/test/java/RefactorSmokeTest.java
          grep -n '^1.2.12$' VERSION.txt
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'v1.2.12: 修复旧版 RegisterMain 二参路径传参'
          git push origin HEAD:fix/registermain-2arg-v1.2.12
