name: Apply v1.2.43 batch cleanup operation

on:
  push:
    branches: [ "feature/batch-cleanup-operation-v1.2.43" ]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/batch-cleanup-operation-v1.2.43
      - name: Patch batch cleanup into operation selector
        shell: python
        run: |
          from pathlib import Path

          p = Path("src/main/java/LicenseRecoverModernGUI.java")
          s = p.read_text(encoding="utf-8")

          old = '    private final JRadioButton batchWay1 = new JRadioButton("一键恢复授权（推荐）", true);\n    private final JRadioButton batchWay3 = new JRadioButton("方式三：移除联网授权代码");\n'
          new = old + '    private final JRadioButton batchCleanup = new JRadioButton("批量删除备份");\n    private final JSpinner batchCleanupKeep = new JSpinner(new SpinnerNumberModel(3, 0, 50, 1));\n'
          if old not in s:
              raise SystemExit("radio field marker missing")
          s = s.replace(old, new, 1)

          old = '        ButtonGroup group = new ButtonGroup();\n        group.add(batchWay1);\n        group.add(batchWay3);\n'
          new = '        ButtonGroup group = new ButtonGroup();\n        group.add(batchWay1);\n        group.add(batchWay3);\n        group.add(batchCleanup);\n'
          if old not in s:
              raise SystemExit("button group marker missing")
          s = s.replace(old, new, 1)

          old = '        JPanel methods = new JPanel(new FlowLayout(FlowLayout.LEFT, 8, 0));\n        methods.add(batchWay1);\n        methods.add(batchWay3);\n        top.add(methods, c);\n'
          new = '        JPanel methods = new JPanel(new FlowLayout(FlowLayout.LEFT, 8, 0));\n        methods.add(batchWay1);\n        methods.add(batchWay3);\n        methods.add(batchCleanup);\n        top.add(methods, c);\n'
          if old not in s:
              raise SystemExit("methods marker missing")
          s = s.replace(old, new, 1)

          old = '        batchOptions.add(batchBackupCheck);\n        batchOptions.add(batchBlockNetCheck);\n        batchOptions.add(batchDryRunCheck);\n        top.add(batchOptions, c);\n        root.add(top, BorderLayout.NORTH);\n'
          new = '''        batchOptions.add(batchBackupCheck);\n        batchOptions.add(batchBlockNetCheck);\n        batchOptions.add(batchDryRunCheck);\n        batchOptions.add(Box.createHorizontalStrut(12));\n        batchOptions.add(new JLabel("清理时每个原文件保留最近"));\n        batchCleanupKeep.setPreferredSize(new Dimension(58, batchCleanupKeep.getPreferredSize().height));\n        batchCleanupKeep.setToolTipText("仅用于‘批量删除备份’；0 表示删除全部受管理备份");\n        batchOptions.add(batchCleanupKeep);\n        batchOptions.add(new JLabel("份"));\n        top.add(batchOptions, c);\n\n        batchWay1.addActionListener(e -> updateBatchOperationUi());\n        batchWay3.addActionListener(e -> updateBatchOperationUi());\n        batchCleanup.addActionListener(e -> updateBatchOperationUi());\n        updateBatchOperationUi();\n        root.add(top, BorderLayout.NORTH);\n'''
          if old not in s:
              raise SystemExit("batch options marker missing")
          s = s.replace(old, new, 1)

          marker = '    private JComponent buildLogPanel() {\n'
          method = '''    private void updateBatchOperationUi() {\n        boolean cleanup = batchCleanup.isSelected();\n        batchBackupCheck.setEnabled(!cleanup);\n        batchBlockNetCheck.setEnabled(!cleanup);\n        batchDryRunCheck.setEnabled(!cleanup);\n        batchCleanupKeep.setEnabled(cleanup);\n        batchRunButton.setText(cleanup ? "批量删除备份" : "批量执行");\n        batchRunButton.setToolTipText(cleanup\n                ? "扫描所选父目录并清理 LicenseRecover 管理的历史备份"\n                : null);\n    }\n\n'''
          if marker not in s:
              raise SystemExit("buildLogPanel marker missing")
          s = s.replace(marker, method + marker, 1)

          old = '''    private void runBatch() {\n        if (batchWorker != null && !batchWorker.isDone()) {\n            setStatus("请等待当前批量任务完成，或先取消当前任务", false);\n            return;\n        }\n        if (batchTargets.isEmpty()) {\n            scanBatch(true);\n            return;\n        }\n'''
          new = '''    private void runBatch() {\n        if (batchWorker != null && !batchWorker.isDone()) {\n            setStatus("请等待当前批量任务完成，或先取消当前任务", false);\n            return;\n        }\n        if (batchCleanup.isSelected()) {\n            runBatchBackupCleanup();\n            return;\n        }\n        if (batchTargets.isEmpty()) {\n            scanBatch(true);\n            return;\n        }\n'''
          if old not in s:
              raise SystemExit("runBatch marker missing")
          s = s.replace(old, new, 1)

          marker = '    private String recommendedBatchBlockReason(BatchTarget target) {\n'
          method = '''    private void runBatchBackupCleanup() {\n        final File root = new File(batchRootField.getText().trim());\n        if (!root.isDirectory()) {\n            setStatus("批量父目录无效", false);\n            JOptionPane.showMessageDialog(frame, "请先选择有效的批量父目录。",\n                    "批量删除备份", JOptionPane.WARNING_MESSAGE);\n            return;\n        }\n        final int keep = ((Number) batchCleanupKeep.getValue()).intValue();\n        batchRunButton.setEnabled(false);\n        batchScanButton.setEnabled(false);\n        batchCancelButton.setEnabled(false);\n        batchProgress.setIndeterminate(true);\n        batchProgress.setString("正在扫描受管理备份...");\n        setStatusInfo("正在扫描 LicenseRecover 历史备份");\n        appendLog("[备份清理] 扫描: " + root.getAbsolutePath()\n                + "；每个原文件保留最近 " + keep + " 份。\\n");\n\n        batchWorker = new SwingWorker<LicenseRecoverModernGUIBackupCleanup.Plan, Void>() {\n            protected LicenseRecoverModernGUIBackupCleanup.Plan doInBackground() throws Exception {\n                return LicenseRecoverModernGUIBackupCleanup.scan(root, keep);\n            }\n\n            protected void done() {\n                final LicenseRecoverModernGUIBackupCleanup.Plan plan;\n                try {\n                    plan = get();\n                } catch (Exception ex) {\n                    finishBatchBackupCleanup("备份扫描失败", false);\n                    JOptionPane.showMessageDialog(frame, "扫描备份失败：\\n" + safeBatchCleanupError(ex),\n                            "批量删除备份", JOptionPane.ERROR_MESSAGE);\n                    return;\n                }\n\n                batchProgress.setIndeterminate(false);\n                batchProgress.setMinimum(0);\n                batchProgress.setMaximum(Math.max(1, plan.matched.size()));\n                batchProgress.setValue(plan.matched.size());\n                batchProgress.setString("受管理备份 " + plan.matched.size() + "；拟删除 " + plan.delete.size());\n\n                if (plan.matched.isEmpty()) {\n                    finishBatchBackupCleanup("没有找到受管理备份", true);\n                    JOptionPane.showMessageDialog(frame,\n                            "没有找到 LicenseRecover 管理的备份文件。\\n普通 .bak 文件不会被匹配。",\n                            "批量删除备份", JOptionPane.INFORMATION_MESSAGE);\n                    return;\n                }\n                if (plan.delete.isEmpty()) {\n                    finishBatchBackupCleanup("当前保留策略无需删除", true);\n                    JOptionPane.showMessageDialog(frame,\n                            "找到 " + plan.matched.size() + " 个 LicenseRecover 备份，当前保留策略无需删除。",\n                            "批量删除备份", JOptionPane.INFORMATION_MESSAGE);\n                    return;\n                }\n\n                String zero = keep == 0\n                        ? "\\n\\n注意：当前设置为保留 0 份，将删除扫描范围内全部受管理备份。"\n                        : "";\n                int yes = JOptionPane.showConfirmDialog(frame,\n                        "扫描目录：" + plan.root.getAbsolutePath()\n                                + "\\n找到受管理备份：" + plan.matched.size() + " 个"\n                                + "\\n保留：" + plan.keepCount + " 个"\n                                + "\\n准备删除：" + plan.delete.size() + " 个"\n                                + "\\n预计释放：" + LicenseRecoverModernGUIBackupCleanup.formatBytes(plan.deleteBytes)\n                                + "\\n\\n只匹配 LicenseRecover 生成的备份；普通 .bak 不处理。"\n                                + zero + "\\n\\n确定执行删除吗？",\n                        "确认批量删除备份", JOptionPane.OK_CANCEL_OPTION, JOptionPane.WARNING_MESSAGE);\n                if (yes != JOptionPane.OK_OPTION) {\n                    appendLog("[备份清理] 用户取消；未删除任何文件。\\n");\n                    finishBatchBackupCleanup("已取消，未删除任何文件", true);\n                    return;\n                }\n\n                batchProgress.setIndeterminate(true);\n                batchProgress.setString("正在删除历史备份...");\n                setStatusInfo("正在批量删除历史备份");\n                batchWorker = new SwingWorker<LicenseRecoverModernGUIBackupCleanup.DeleteResult, Void>() {\n                    protected LicenseRecoverModernGUIBackupCleanup.DeleteResult doInBackground() {\n                        return LicenseRecoverModernGUIBackupCleanup.execute(plan, LicenseRecoverModernGUI.this::appendLog);\n                    }\n\n                    protected void done() {\n                        try {\n                            LicenseRecoverModernGUIBackupCleanup.DeleteResult r = get();\n                            String message = "清理完成。\\n已删除：" + r.deleted + " 个"\n                                    + "\\n失败：" + r.failed + " 个"\n                                    + "\\n实际释放：" + LicenseRecoverModernGUIBackupCleanup.formatBytes(r.freedBytes);\n                            finishBatchBackupCleanup(r.failed == 0 ? "备份清理完成" : "备份清理完成（存在失败）",\n                                    r.failed == 0);\n                            JOptionPane.showMessageDialog(frame, message, "批量删除备份",\n                                    r.failed == 0 ? JOptionPane.INFORMATION_MESSAGE : JOptionPane.WARNING_MESSAGE);\n                        } catch (Exception ex) {\n                            finishBatchBackupCleanup("备份清理失败", false);\n                            JOptionPane.showMessageDialog(frame, "清理失败：\\n" + safeBatchCleanupError(ex),\n                                    "批量删除备份", JOptionPane.ERROR_MESSAGE);\n                        }\n                    }\n                };\n                batchWorker.execute();\n            }\n        };\n        batchWorker.execute();\n    }\n\n    private void finishBatchBackupCleanup(String text, boolean success) {\n        batchWorker = null;\n        batchRunButton.setEnabled(true);\n        batchScanButton.setEnabled(true);\n        batchCancelButton.setEnabled(false);\n        batchProgress.setIndeterminate(false);\n        batchProgress.setValue(0);\n        batchProgress.setString(text);\n        setStatus(text, success);\n        updateBatchOperationUi();\n    }\n\n    private static String safeBatchCleanupError(Throwable ex) {\n        Throwable x = ex;\n        while (x != null && x.getCause() != null) x = x.getCause();\n        String s = x == null ? "未知错误" : x.getMessage();\n        return s == null || s.trim().isEmpty() ? String.valueOf(x) : s;\n    }\n\n'''
          if marker not in s:
              raise SystemExit("recommendedBatchBlockReason marker missing")
          s = s.replace(marker, method + marker, 1)
          p.write_text(s, encoding="utf-8")

          p = Path("src/main/java/LicenseRecoverModernGUIBackupCleanup.java")
          s = p.read_text(encoding="utf-8")
          old = '    private static String humanBytes(long b){if(b<1024)return b+" B";double v=b;String[]u={"KB","MB","GB","TB"};int i=-1;do{v/=1024;i++;}while(v>=1024&&i<u.length-1);return String.format(Locale.ROOT,"%.2f %s",v,u[i]);}\n'
          new = '    static String formatBytes(long b){if(b<1024)return b+" B";double v=b;String[]u={"KB","MB","GB","TB"};int i=-1;do{v/=1024;i++;}while(v>=1024&&i<u.length-1);return String.format(Locale.ROOT,"%.2f %s",v,u[i]);}\n    private static String humanBytes(long b){return formatBytes(b);}\n'
          if old not in s:
              raise SystemExit("humanBytes marker missing")
          p.write_text(s.replace(old, new, 1), encoding="utf-8")

          p = Path("src/main/java/LicenseRecoverModernGUILauncherUiPatch.java")
          s = p.read_text(encoding="utf-8")
          old = '        LicenseRecoverModernGUIUiPatchLauncher.main(args);\n        LicenseRecoverModernGUIBackupCleanup.installLater(args);\n'
          new = '        LicenseRecoverModernGUIUiPatchLauncher.main(args);\n'
          if old not in s:
              raise SystemExit("launcher cleanup injection marker missing")
          p.write_text(s.replace(old, new, 1), encoding="utf-8")

          Path("VERSION.txt").write_text("1.2.43\n", encoding="utf-8")

          p = Path("README.md")
          s = p.read_text(encoding="utf-8")
          s = s.replace("当前稳定版本：**v1.2.42**", "当前稳定版本：**v1.2.43**", 1)
          old = "v1.2.42 起，“批量应用”页增加“批量清理备份”维护功能。选择父目录后可递归扫描 LicenseRecover 自身生成的 `prewrite` / `prepatch` / `preoneclick` 和已知旧版时间戳备份，默认按每个原文件保留最近 3 份。删除前会显示匹配数量、保留数量、拟删除数量和预计释放空间，并要求再次确认；普通 `.bak`、无关时间戳备份和符号链接不会被清理。"
          new = "v1.2.43 起，备份清理由单独的“备份整理”栏合并进“操作”单选项，与“一键恢复授权”和“方式三”并列为“批量删除备份”。保留份数仍在同一“选项”行配置，选择该操作后普通写入/联网/预览选项自动禁用；执行时无需先扫描应用，直接对父目录下 LicenseRecover 自身生成的 `prewrite` / `prepatch` / `preoneclick` 和已知旧版时间戳备份进行安全扫描与确认删除。"
          if old not in s:
              raise SystemExit("README batch cleanup paragraph missing")
          p.write_text(s.replace(old, new, 1), encoding="utf-8")

          p = Path("README.txt")
          s = p.read_text(encoding="utf-8")
          s = s.replace("LicenseRecover v1.2.42", "LicenseRecover v1.2.43", 1)
          marker = "v1.2.42 批量备份整理"
          if marker in s and "v1.2.43 批量操作整合" not in s:
              s = s.replace(marker, "v1.2.43 批量操作整合\n------------------------\n- “批量删除备份”现在作为“操作”单选项，与一键恢复/方式三并列；\n- 保留最近 N 份仍在“选项”行设置，不再额外占用一整行；\n- 选择备份清理时会自动禁用与清理无关的写入前备份/阻止联网/只预览选项；\n- 清理无需先扫描应用，直接扫描所选父目录并在删除前展示统计和二次确认。\n\n" + marker, 1)
          p.write_text(s, encoding="utf-8")

          p = Path("CHANGELOG.md")
          s = p.read_text(encoding="utf-8")
          entry = '''## [1.2.43] - 2026-09-11\n\n### Changed\n- 将“批量删除备份”从批量页单独的“备份整理”行移动到“操作”单选组，与“一键恢复授权（推荐）”和“方式三”并列。\n- 保留最近 N 份设置合并到现有“选项”行；选中备份清理时自动禁用无关的一键恢复/方式三选项，并将执行按钮改为“批量删除备份”。\n- 备份清理不再要求先完成应用扫描，直接基于所选父目录执行受管理备份扫描、统计确认与安全删除。\n\n'''
          if not s.startswith("## [1.2.43]"):
              p.write_text(entry + s, encoding="utf-8")

          Path("release-notes/v1.2.43.md").write_text('''# LicenseRecover v1.2.43\n\n## 批量页交互调整\n\n- “批量删除备份”现在直接作为“操作”单选项，与“一键恢复授权（推荐）”及“方式三：移除联网授权代码”并列。\n- 不再在“选项”下方额外增加“备份整理”一整行；保留最近 N 份设置合并进现有“选项”行。\n- 选择“批量删除备份”时，写入前备份、阻止残留联网、只预览等无关选项自动禁用，主按钮文字同步变为“批量删除备份”。\n- 备份清理无需先扫描应用目录，可直接扫描所选父目录；仍保留受管理文件名识别、符号链接保护、删除前统计和二次确认。\n\n## Verification\n\n- 完整 Java 8 编译与现有回归继续执行。\n- backup-cleanup self-test 继续验证受管理备份匹配、保留策略、真实删除以及普通 `.bak` 保护。\n- Windows/.NET 集成工作流保持不变。\n''', encoding="utf-8")

      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main/java/LicenseRecoverModernGUI.java \
                  src/main/java/LicenseRecoverModernGUIBackupCleanup.java \
                  src/main/java/LicenseRecoverModernGUILauncherUiPatch.java \
                  VERSION.txt README.md README.txt CHANGELOG.md release-notes/v1.2.43.md
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m 'ui: make batch backup cleanup an operation'
          git push origin HEAD:feature/batch-cleanup-operation-v1.2.43
