name: Apply v1.2.44 YX030506 classpath-root fix

on:
  push:
    branches:
      - fix/yx030506-project-classpath-v1.2.44

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/yx030506-project-classpath-v1.2.44
          fetch-depth: 0
      - name: Apply YX030506 classpath-root patch
        run: python3 .github/scripts/apply_v1244_yx030506.py
      - name: Commit fix
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: mirror YX030506 ProjectSourcesPath registration base"
          git push origin HEAD:fix/yx030506-project-classpath-v1.2.44
