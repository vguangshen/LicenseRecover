name: Finalize Java v1.2.41

on:
  push:
    branches:
      - refactor/java-native-host-v1.2.41
    paths:
      - .github/workflows/finalize-java-v1.2.41.yml
      - scripts/finalize-java-v1.2.41.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refactor/java-native-host-v1.2.41
          fetch-depth: 0
      - name: Apply finalizer
        run: python3 scripts/finalize-java-v1.2.41.py
      - name: Validate patch
        run: git diff --check
      - name: Commit finalization
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/finalize-java-v1.2.41.yml scripts/finalize-java-v1.2.41.py
          git add src/main/java/LicenseRecoverModernGUIJavaPlan.java src/test/java/RefactorSmokeTest.java docs/java-runtime-profile-v1.2.41.md
          git commit -m "test: finalize Java target-native runtime profiles"
          git push origin HEAD:refactor/java-native-host-v1.2.41
