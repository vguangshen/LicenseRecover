name: Harden verify concurrency
on:
  push:
    branches: [ main ]
    paths:
      - 'scripts/harden-verify-concurrency.py'
      - '.github/workflows/harden-verify-concurrency.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - run: python scripts/harden-verify-concurrency.py
      - run: git diff --check
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/verify-source.yml
          git commit -m 'ci: 仅保留最新Verify并限制工具链安装超时'
          git push origin HEAD:main
