name: Apply Java family model v1.2.5

on:
  push:
    branches: [ "feature/java-family-model-v1.2.5" ]
    paths: [ ".github/workflows/apply-java-family-v1.2.5.yml" ]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/java-family-model-v1.2.5
      - name: Apply family/runtime-id model
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def repl(path, old, new):
              p=Path(path); s=p.read_text(encoding='utf-8')
              if old not in s:
                  raise SystemExit(f'pattern not found: {path}: {old[:120]!r}')
              p.write_text(s.replace(old,new,1),encoding='utf-8')

          # ---- Java preview/plan model ----
          p='src/main/java/LicenseRecoverModernGUIJavaPlan.java'
          repl(p,
'''    public final String generation;\n    public final String productName;\n    public final String regStr;\n''',
'''    public final String generation;\n    /** Vendor local-registration family (for example DS501 / YX0305). */\n    public final String authorizationFamily;\n    /** Product id used by the application at runtime RegisterMain.checkReInfo(). */\n    public final String runtimeProductId;\n    /** Backward-compatible alias: direct-rebuild ProName equals runtimeProductId. */\n    public final String productName;\n    public final String regStr;\n''')

          repl(p,
'''    private LicenseRecoverModernGUIJavaPlan(boolean detected, File appRoot, File libDir, File regJar,\n                                            String softVersionId, String generation, String productName,\n                                            String regStr, String configTargets, String verificationPlan,\n                                            boolean rootConfigStyle, boolean packedRegistrationJar) {\n''',
'''    private LicenseRecoverModernGUIJavaPlan(boolean detected, File appRoot, File libDir, File regJar,\n                                            String softVersionId, String generation, String authorizationFamily,\n                                            String runtimeProductId, String regStr, String configTargets,\n                                            String verificationPlan, boolean rootConfigStyle,\n                                            boolean packedRegistrationJar) {\n''')

          repl(p,
'''        this.generation = generation;\n        this.productName = productName;\n        this.regStr = regStr;\n''',
'''        this.generation = generation;\n        this.authorizationFamily = authorizationFamily;\n        this.runtimeProductId = runtimeProductId;\n        this.productName = runtimeProductId;\n        this.regStr = regStr;\n''')

          old='''        String generation;\n        if (newStyle) {\n            generation = "QT30xxx / data-config";\n        } else if (classesConfig.isFile()) {\n            generation = soft != null && soft.toUpperCase(Locale.ROOT).startsWith("XMT01")\n                    ? "XMT / classes-config" : "新式 / classes-config";\n        } else if (dataConfig.isFile()) {\n            generation = soft != null && soft.toUpperCase(Locale.ROOT).matches("DS28\\\\d{2}")\n                    ? "DS28 / data-config" : "YT/兼容根配置 / data-config";\n        } else if (relative(root, lib).toLowerCase(Locale.ROOT)\n                .contains("web-inf" + File.separator + "web-inf")) {\n            generation = "经典 Java / nested WEB-INF";\n        } else {\n            generation = "经典 Java / WEB-INF/lib";\n        }\n\n        String product = newStyle && !blank(soft) ? soft.trim() : productMainFor(soft);\n        String products = resolveRegStr(root, soft);\n'''
          new='''        String upper = soft == null ? "" : soft.toUpperCase(Locale.ROOT);\n        String generation;\n        if (newStyle) {\n            generation = "QT30xxx / data-config";\n        } else if (classesConfig.isFile()) {\n            if (upper.startsWith("XMT01")) generation = "XMT / classes-config";\n            else if (upper.startsWith("DS501")) generation = "DS501 / classes-config";\n            else if (upper.startsWith("YX0305")) generation = "YX0305 / classes-config";\n            else generation = "通用 / classes-config";\n        } else if (dataConfig.isFile()) {\n            generation = upper.matches("DS28\\\\d{2}")\n                    ? "DS28 / data-config" : "YT/兼容根配置 / data-config";\n        } else if (relative(root, lib).toLowerCase(Locale.ROOT)\n                .contains("web-inf" + File.separator + "web-inf")) {\n            generation = "经典 Java / nested WEB-INF";\n        } else {\n            generation = "经典 Java / WEB-INF/lib";\n        }\n\n        String family = authorizationFamilyFor(soft, newStyle);\n        String runtimeProduct = newStyle && !blank(soft) ? soft.trim() : runtimeProductFor(soft);\n        String products = resolveRegStr(root, soft);\n'''
          repl(p,old,new)

          repl(p,
'''        return new LicenseRecoverModernGUIJavaPlan(true, root, lib, jar,\n                soft, generation, product, products, targets, verify, rootConfig, packed);\n''',
'''        return new LicenseRecoverModernGUIJavaPlan(true, root, lib, jar,\n                soft, generation, family, runtimeProduct, products, targets, verify, rootConfig, packed);\n''')

          repl(p,
'''        out.append("[java-plan] SoftVersionID=").append(value(softVersionId))\n                .append(" ProName=").append(value(productName)).append('\\n');\n''',
'''        out.append("[java-plan] SoftVersionID=").append(value(softVersionId))\n                .append(" AuthorizationFamily=").append(value(authorizationFamily))\n                .append(" RuntimeProductID/ProName=").append(value(runtimeProductId)).append('\\n');\n''')

          repl(p,
'''        if (classes != null) return classes;\n        if (softId != null && softId.toUpperCase(Locale.ROOT).matches("DS28\\\\d{2}")) return softId.trim();\n''',
'''        if (classes != null) return classes;\n        if (softId != null && softId.toUpperCase(Locale.ROOT).startsWith("DS501")) return softId.trim();\n        if (softId != null && softId.toUpperCase(Locale.ROOT).matches("DS28\\\\d{2}")) return softId.trim();\n''')

          old='''    private static String productMainFor(String softId) {\n        if (softId != null && softId.toUpperCase(Locale.ROOT).matches("DS28\\\\d{2}")) return "DS28";\n        if (softId != null && softId.toUpperCase(Locale.ROOT).startsWith("XMT01")) return "XMT01";\n        if (softId == null) return "QT1001";\n        String id = softId.toUpperCase(Locale.ROOT);\n        if ("YT00128".equals(id) || "YT00127".equals(id) || "YT00129".equals(id)\n                || "YT00139".equals(id) || "YT00132".equals(id) || "YT00141".equals(id)\n                || "YT00126".equals(id) || "YT00154".equals(id) || "BKSM4".equals(id)) {\n            return "QT04";\n        }\n        return "QT1001";\n    }\n'''
          new='''    static String authorizationFamilyFor(String softId, boolean newStyle) {\n        if (blank(softId)) return newStyle ? "QT30xxx" : "QT1001";\n        String id = softId.toUpperCase(Locale.ROOT);\n        if (id.startsWith("DS501")) return "DS501";\n        if (id.startsWith("YX0305")) return "YX0305";\n        if (id.startsWith("XMT01")) return "XMT01";\n        if (id.matches("DS28\\\\d{2}")) return "DS28";\n        if (newStyle) return softId.trim();\n        if ("YT00128".equals(id) || "YT00127".equals(id) || "YT00129".equals(id)\n                || "YT00139".equals(id) || "YT00132".equals(id) || "YT00141".equals(id)\n                || "YT00126".equals(id) || "YT00154".equals(id) || "BKSM4".equals(id)) return "QT04";\n        return "QT1001";\n    }\n\n    static String runtimeProductFor(String softId) {\n        if (blank(softId)) return "QT1001";\n        String id = softId.toUpperCase(Locale.ROOT);\n        // Confirmed classes-config families use a broader id on the local-registration page,\n        // but startup checks the concrete SoftVersionID through RegisterMain.checkReInfo().\n        if (id.startsWith("DS501") || id.startsWith("YX0305")) return softId.trim();\n        if (id.matches("DS28\\\\d{2}")) return "DS28";\n        if (id.startsWith("XMT01")) return "XMT01";\n        if ("YT00128".equals(id) || "YT00127".equals(id) || "YT00129".equals(id)\n                || "YT00139".equals(id) || "YT00132".equals(id) || "YT00141".equals(id)\n                || "YT00126".equals(id) || "YT00154".equals(id) || "BKSM4".equals(id)) return "QT04";\n        return "QT1001";\n    }\n'''
          repl(p,old,new)

          repl(p,
'''        return new LicenseRecoverModernGUIJavaPlan(false, null, null, null,\n                null, "未识别", null, null, "—", "—", false, false);\n''',
'''        return new LicenseRecoverModernGUIJavaPlan(false, null, null, null,\n                null, "未识别", null, null, null, "—", "—", false, false);\n''')

          # ---- CLI direct recovery + local-registration family ----
          p='src/main/java/LicenseRecover.java'
          repl(p,
'''        if (classes != null) return classes;\n        if (softId != null && softId.toUpperCase(java.util.Locale.ROOT).matches("DS28\\\\d{2}")) return softId.trim();\n''',
'''        if (classes != null) return classes;\n        if (softId != null && softId.toUpperCase(java.util.Locale.ROOT).startsWith("DS501")) return softId.trim();\n        if (softId != null && softId.toUpperCase(java.util.Locale.ROOT).matches("DS28\\\\d{2}")) return softId.trim();\n''')

          repl(p,
'''    // 与 Global.registerProductBeans 的首个命中规则保持一致\n    static String productMainFor(String softId) {\n        if (softId != null && softId.toUpperCase(java.util.Locale.ROOT).matches("DS28\\\\d{2}")) return "DS28";\n        if (softId != null && softId.toUpperCase(java.util.Locale.ROOT).startsWith("XMT01")) return "XMT01";\n        if (softId == null) return "QT1001";\n''',
'''    // Direct config rebuild must use the id that application startup passes to RegisterMain.checkReInfo().\n    static String productMainFor(String softId) {\n        if (softId != null && softId.toUpperCase(java.util.Locale.ROOT).startsWith("DS501")) return softId.trim();\n        if (softId != null && softId.toUpperCase(java.util.Locale.ROOT).startsWith("YX0305")) return softId.trim();\n        if (softId != null && softId.toUpperCase(java.util.Locale.ROOT).matches("DS28\\\\d{2}")) return "DS28";\n        if (softId != null && softId.toUpperCase(java.util.Locale.ROOT).startsWith("XMT01")) return "XMT01";\n        if (softId == null) return "QT1001";\n''')

          old='''                if (isNewStyleApp(appArg)) {\n                    registerPid = softId.trim();\n                    System.out.println("[识别] 新架构(data/config.xml 存在)，注册码产品号 = " + registerPid);\n                } else {\n                    registerPid = "DS2601".equals(softId) ? "DS26" : "YT001";\n                    System.out.println("[识别] systemConfig.yml VersionID = " + softId + "  -> 注册码产品号 " + registerPid);\n                }\n'''
          new='''                boolean dataStyle = isNewStyleApp(appArg);\n                registerPid = localRegisterProductFor(softId, dataStyle);\n                System.out.println("[识别] VersionID = " + softId + "  -> 本地注册产品族 " + registerPid);\n'''
          repl(p,old,new)

          insert='''\n    /** Product family used by the vendor's local-registration page / doRegistry path. */\n    static String localRegisterProductFor(String softId, boolean dataStyle) {\n        if (softId == null || softId.trim().isEmpty()) return "YT001";\n        String id = softId.toUpperCase(java.util.Locale.ROOT);\n        if (id.startsWith("DS501")) return "DS501";\n        if (id.startsWith("YX0305")) return "YX0305";\n        if ("DS2601".equals(id)) return "DS26";\n        if (dataStyle) return softId.trim();\n        return "YT001";\n    }\n'''
          marker='''    // ================= 方式三: 移除联网授权代码 (暴力) =================\n'''
          repl(p,marker,insert+'\n'+marker)

          # ---- Batch table: family vs runtime id ----
          p='src/main/java/LicenseRecoverModernGUI.java'
          repl(p,
'''    private static final int BATCH_COL_VERIFY = 6;\n    private static final int BATCH_COL_STATUS = 7;\n    private final DefaultTableModel batchModel = new DefaultTableModel(\n            new String[]{"应用", "类型 / 授权代际", "SoftVersionID", "ProName", "RegStr", "配置目标", "原生校验", "状态", "路径"}, 0) {\n''',
'''    private static final int BATCH_COL_VERIFY = 7;\n    private static final int BATCH_COL_STATUS = 8;\n    private final DefaultTableModel batchModel = new DefaultTableModel(\n            new String[]{"应用", "类型 / 授权代际", "SoftVersionID", "授权族", "运行校验ID", "RegStr", "配置目标", "原生校验", "状态", "路径"}, 0) {\n''')

          repl(p,
'''        int[] widths = new int[]{120, 190, 120, 100, 220, 230, 160, 90, 420};\n''',
'''        int[] widths = new int[]{120, 190, 120, 100, 120, 220, 230, 160, 90, 420};\n''')

          repl(p,
'''                            valueOrDash(plan.softVersionId), valueOrDash(plan.productName),\n                            plan.regStrSummary(), plan.configTargets,\n''',
'''                            valueOrDash(plan.softVersionId), valueOrDash(plan.authorizationFamily),\n                            valueOrDash(plan.runtimeProductId), plan.regStrSummary(), plan.configTargets,\n''')

          repl(p,
'''                    batchModel.addRow(new Object[]{child.getName(), kind,\n                            valueOrDash(d.versionId), valueOrDash(d.productName), "—", "config.xml",\n                            verify, "待处理", info.binDir.getAbsolutePath()});\n''',
'''                    batchModel.addRow(new Object[]{child.getName(), kind,\n                            valueOrDash(d.versionId), valueOrDash(d.productName), valueOrDash(d.productName),\n                            "—", "config.xml", verify, "待处理", info.binDir.getAbsolutePath()});\n''')

          repl(p,
'''                    batchModel.addRow(new Object[]{child.getName(), "—", "—", "—", "—", "—", "—", "未识别", child.getAbsolutePath()});\n''',
'''                    batchModel.addRow(new Object[]{child.getName(), "—", "—", "—", "—", "—", "—", "—", "未识别", child.getAbsolutePath()});\n''')

          repl(p,
'''                batchModel.addRow(new Object[]{child.getName(), "检测异常", "—", "—", "—", "—", "—",\n                        reason, child.getAbsolutePath()});\n''',
'''                batchModel.addRow(new Object[]{child.getName(), "检测异常", "—", "—", "—", "—", "—", "—",\n                        reason, child.getAbsolutePath()});\n''')

          # ---- Single-app one-click detail card ----
          p='src/main/java/LicenseRecoverModernGUIUiPatchLauncher.java'
          repl(p,
'''        final JLabel generationValue = new JLabel("—");\n        final JLabel productValue = new JLabel("—");\n        final JTextArea regStrValue = detailArea();\n''',
'''        final JLabel generationValue = new JLabel("—");\n        final JLabel familyValue = new JLabel("—");\n        final JLabel runtimeValue = new JLabel("—");\n        final JTextArea regStrValue = detailArea();\n''')

          repl(p,
'''        addDetailRow(details, 0, "授权代际", generationValue);\n        addDetailRow(details, 1, "ProName", productValue);\n        addDetailRow(details, 2, "RegStr", regStrValue);\n        addDetailRow(details, 3, "配置目标", targetValue);\n        addDetailRow(details, 4, "授权组件", jarValue);\n        addDetailRow(details, 5, "原生校验", verifyValue);\n''',
'''        addDetailRow(details, 0, "授权代际", generationValue);\n        addDetailRow(details, 1, "授权族", familyValue);\n        addDetailRow(details, 2, "运行校验ID", runtimeValue);\n        addDetailRow(details, 3, "RegStr", regStrValue);\n        addDetailRow(details, 4, "配置目标", targetValue);\n        addDetailRow(details, 5, "授权组件", jarValue);\n        addDetailRow(details, 6, "原生校验", verifyValue);\n''')

          repl(p,
'''        recover.setToolTipText("Java 会展示授权代际 / ProName / RegStr / config 目标，并在写入后执行 RegisterMain 原生校验");\n        recover.addActionListener(e -> runOneClick(frame, recover,\n                generationValue, productValue, regStrValue, targetValue, jarValue, verifyValue));\n''',
'''        recover.setToolTipText("Java 会展示授权代际 / 授权族 / 运行校验ID / RegStr / config 目标，并在写入后执行 RegisterMain 原生校验");\n        recover.addActionListener(e -> runOneClick(frame, recover,\n                generationValue, familyValue, runtimeValue, regStrValue, targetValue, jarValue, verifyValue));\n''')

          repl(p,
'''        final Runnable refresh = () -> refreshPlan(frame, generationValue, productValue,\n                regStrValue, targetValue, jarValue, verifyValue);\n''',
'''        final Runnable refresh = () -> refreshPlan(frame, generationValue, familyValue, runtimeValue,\n                regStrValue, targetValue, jarValue, verifyValue);\n''')

          repl(p,
'''    private static void refreshPlan(JFrame frame, JLabel generation, JLabel product,\n                                    JTextArea regStr, JTextArea targets, JLabel jar, JLabel verify) {\n''',
'''    private static void refreshPlan(JFrame frame, JLabel generation, JLabel family, JLabel runtime,\n                                    JTextArea regStr, JTextArea targets, JLabel jar, JLabel verify) {\n''')

          repl(p,
'''            generation.setText("—"); product.setText("—"); regStr.setText("—"); targets.setText("—");\n''',
'''            generation.setText("—"); family.setText("—"); runtime.setText("—"); regStr.setText("—"); targets.setText("—");\n''')

          repl(p,
'''            generation.setText(plan.generation);\n            product.setText(value(plan.productName));\n            regStr.setText(value(plan.regStr)); regStr.setCaretPosition(0);\n''',
'''            generation.setText(plan.generation);\n            family.setText(value(plan.authorizationFamily));\n            runtime.setText(value(plan.runtimeProductId));\n            regStr.setText(value(plan.regStr)); regStr.setCaretPosition(0);\n''')

          repl(p,
'''            generation.setText(detection.kind.toString());\n            product.setText(value(detection.productName));\n            regStr.setText(".NET 由对应适配器自动识别");\n''',
'''            generation.setText(detection.kind.toString());\n            family.setText(value(detection.productName));\n            runtime.setText(value(detection.productName));\n            regStr.setText(".NET 由对应适配器自动识别");\n''')

          repl(p,
'''            generation.setText("未识别"); product.setText("—"); regStr.setText("—"); targets.setText("—");\n''',
'''            generation.setText("未识别"); family.setText("—"); runtime.setText("—"); regStr.setText("—"); targets.setText("—");\n''')

          repl(p,
'''    private static void runOneClick(final JFrame frame, final JButton button,\n                                    final JLabel generationValue, final JLabel productValue,\n                                    final JTextArea regStrValue, final JTextArea targetValue,\n''',
'''    private static void runOneClick(final JFrame frame, final JButton button,\n                                    final JLabel generationValue, final JLabel familyValue, final JLabel runtimeValue,\n                                    final JTextArea regStrValue, final JTextArea targetValue,\n''')

          repl(p,
'''        refreshPlan(frame, generationValue, productValue, regStrValue, targetValue, jarValue, verifyValue);\n''',
'''        refreshPlan(frame, generationValue, familyValue, runtimeValue, regStrValue, targetValue, jarValue, verifyValue);\n''')

          # ---- Regression fixtures ----
          p='src/test/java/RefactorSmokeTest.java'
          marker='''        Path nestedRoot = base.resolve("nestedApp");\n'''
          addition='''        Path ds501Root = base.resolve("java-DS50109");\n        Path ds501Lib = ds501Root.resolve("WEB-INF/lib");\n        Path ds501Classes = ds501Root.resolve("WEB-INF/classes");\n        Files.createDirectories(ds501Lib); Files.createDirectories(ds501Classes);\n        Files.write(ds501Lib.resolve("ITMCReg.jar"), new byte[]{1});\n        Files.write(ds501Classes.resolve("config.xml"), Arrays.asList(\n                "<ROOT><reg><regType>3</regType></reg><SystemSoft><SoftVersionID>DS50109</SoftVersionID></SystemSoft></ROOT>"), StandardCharsets.UTF_8);\n        check("DS50109".equals(LicenseRecover.productMainFor("DS50109")),\n                "DS501 direct rebuild uses concrete runtime check id");\n        check("DS501".equals(LicenseRecover.localRegisterProductFor("DS50109", false)),\n                "DS501 local-registration page uses DS501 family");\n        check("DS50109".equals(LicenseRecover.resolveJavaRegStr(ds501Root.toString(), "DS50109")),\n                "DS501 fallback RegStr contains concrete SoftVersionID");\n        LicenseRecoverModernGUIJavaPlan ds501Plan = LicenseRecoverModernGUIJavaPlan.inspect(ds501Root.toFile());\n        check(ds501Plan.generation.contains("DS501") && "DS501".equals(ds501Plan.authorizationFamily),\n                "Java GUI plan names DS501 family instead of generic classes-config");\n        check("DS50109".equals(ds501Plan.runtimeProductId) && "DS50109".equals(ds501Plan.regStr),\n                "Java GUI plan separates DS501 family from runtime id and RegStr");\n\n        Path yx305Root = base.resolve("java-YX030506");\n        Path yx305Lib = yx305Root.resolve("WEB-INF/lib");\n        Path yx305Classes = yx305Root.resolve("WEB-INF/classes");\n        Files.createDirectories(yx305Lib); Files.createDirectories(yx305Classes);\n        Files.write(yx305Lib.resolve("ITMCReg.jar"), new byte[]{1});\n        Files.write(yx305Root.resolve("systemConfig.yml"), Arrays.asList("global.system.VersionID=YX030506"), StandardCharsets.UTF_8);\n        Files.write(yx305Classes.resolve("config.xml"), Arrays.asList(\n                "<ROOT><SystemSoft><SoftVersionID>YX030506</SoftVersionID><regInfo>QT100101,QT100102</regInfo></SystemSoft></ROOT>"), StandardCharsets.UTF_8);\n        check("YX030506".equals(LicenseRecover.productMainFor("YX030506")),\n                "YX0305 direct rebuild uses concrete runtime check id");\n        check("YX0305".equals(LicenseRecover.localRegisterProductFor("YX030506", false)),\n                "YX0305 local-registration page uses YX0305 family");\n        check("QT100101,QT100102".equals(LicenseRecover.resolveJavaRegStr(yx305Root.toString(), "YX030506")),\n                "YX030506 preserves declared classes-config regInfo");\n        LicenseRecoverModernGUIJavaPlan yx305Plan = LicenseRecoverModernGUIJavaPlan.inspect(yx305Root.toFile());\n        check(yx305Plan.generation.contains("YX0305") && "YX0305".equals(yx305Plan.authorizationFamily),\n                "Java GUI plan names YX0305 family instead of generic classes-config");\n        check("YX030506".equals(yx305Plan.runtimeProductId)\n                        && "QT100101,QT100102".equals(yx305Plan.regStr),\n                "Java GUI plan separates YX0305 family, runtime id and feature RegStr");\n\n'''
          repl(p,marker,addition+marker)

          # Version/docs
          Path('VERSION.txt').write_text('1.2.5\n',encoding='utf-8')

          p=Path('README.md'); s=p.read_text(encoding='utf-8')
          s=s.replace('当前稳定版本：**v1.2.4**','当前稳定版本：**v1.2.5**',1)
          anchor='## Java 一键恢复授权\n'
          if anchor in s:
              s=s.replace(anchor,anchor+'\n- v1.2.5 起将 classes-config 平台拆分为“授权族 / 运行校验ID / RegStr”三层；已按实际样本确认 DS501 与 YX0305，不再笼统显示“新式”。\n- DS501xx：本地注册族为 `DS501`，运行 `RegisterMain.checkReInfo()` 使用具体 SoftVersionID（如 `DS50109`），未声明 regInfo 时 RegStr 使用具体 SoftVersionID。\n- YX0305xx：本地注册族为 `YX0305`，运行校验使用具体 SoftVersionID（如 `YX030506`），RegStr 读取 `WEB-INF/classes/config.xml` 的显式 regInfo（样本为 `QT100101,QT100102`）。\n',1)
          else:
              # Insert before update section when older README has no dedicated heading.
              anchor='## 软件自动更新\n'
              if anchor not in s: raise SystemExit('README insertion anchor not found')
              s=s.replace(anchor,'## Java classes-config 授权族识别（v1.2.5）\n\n- 将“新式 / classes-config”改为明确授权族；已确认 DS501、YX0305。\n- 分开显示授权族、运行校验ID 与 RegStr，避免把本地注册产品族和运行期 ProName 混为一谈。\n\n'+anchor,1)
          p.write_text(s,encoding='utf-8')

          p=Path('README.txt'); s=p.read_text(encoding='utf-8')
          s=s.replace('LicenseRecover v1.2.4','LicenseRecover v1.2.5',1)
          anchor='软件自动更新\n------------\n'
          if anchor not in s: raise SystemExit('README.txt anchor not found')
          block='''v1.2.5 Java classes-config 授权族识别\n------------------------------------\n- 不再把已确认的 classes-config 平台统称为“新式”；\n- DS501xx：授权族 DS501，运行校验ID 为具体 SoftVersionID，缺少 regInfo 时 RegStr 使用具体 SoftVersionID；\n- YX0305xx：授权族 YX0305，运行校验ID 为具体 SoftVersionID，RegStr 使用 classes/config.xml 显式 regInfo；\n- 单应用与批量表均分别展示“授权族”和“运行校验ID”。\n\n'''
          s=s.replace(anchor,block+anchor,1); p.write_text(s,encoding='utf-8')

          p=Path('CHANGELOG.md'); s=p.read_text(encoding='utf-8')
          anchor='All notable user-visible and engineering changes are tracked here from the first stable release onward.\n\n'
          if anchor not in s: raise SystemExit('CHANGELOG anchor not found')
          entry='''## [1.2.5] - 2026-09-07\n\n### Fixed\n\n- 根据实际 DS50109 样本，将本地注册族 `DS501` 与运行校验ID `DS50109` 分离；直接授权重建使用运行期具体ID，RegStr 未显式配置时使用具体 SoftVersionID。\n- 根据实际 YX030506 样本，将本地注册族 `YX0305` 与运行校验ID `YX030506` 分离；保留 classes-config 中显式 `QT100101,QT100102` RegStr。\n- 修复上述 classes-config 平台此前回退为 `QT1001` ProName/44项通用 RegStr 的误导性识别。\n\n### Changed\n\n- “新式 / classes-config”改为明确的 `DS501 / classes-config`、`YX0305 / classes-config`；尚未有样本证据的 classes-config 平台显示为“通用 / classes-config”，不再冒充已确认代际。\n- 单应用授权详情和批量表增加“授权族”和“运行校验ID”两个独立字段。\n\n'''
          s=s.replace(anchor,anchor+entry,1); p.write_text(s,encoding='utf-8')

          Path('release-notes/v1.2.5.md').write_text('''# LicenseRecover v1.2.5\n\n本版本根据用户提供的 DS50109 与 YX030506 实际安装样本，修正 Java classes-config 平台的授权模型。\n\n## 授权族与运行校验ID分离\n\n此前界面把 classes-config 平台笼统显示为“新式”，并用一个 ProName 字段同时表达本地注册产品族和应用启动时的 RegisterMain 校验ID。实际样本证明两者并不总是相同。\n\n- DS50109：官方本地注册业务调用 `RegisterMain("DS501")`；应用启动通过具体 SoftVersionID `DS50109` 调用 `RegisterMain.checkReInfo()`，并额外要求 RegStr 包含当前 versionID。\n- YX030506：官方本地注册页面调用 `RegisterMain("YX0305", ...)`；启动逻辑从配置的 SoftVersionID 列表取 `YX030506` 执行 `RegisterMain.checkReInfo()`；配置明确声明 `regInfo=QT100101,QT100102`。\n\n因此 v1.2.5 将模型拆分为：\n\n1. 授权族：用于厂商本地注册页面 / doRegistry 路径；\n2. 运行校验ID：用于应用启动时 RegisterMain.checkReInfo()；\n3. RegStr：实际授权功能/版本项。\n\n## 界面\n\n- `新式 / classes-config` 不再作为确认代际名称。\n- 已确认的样本显示 `DS501 / classes-config`、`YX0305 / classes-config`。\n- 单应用“授权识别详情”新增“授权族”“运行校验ID”。\n- 批量表同样拆分这两个字段。\n- 尚未有真实样本支持的 classes-config 产品显示为 `通用 / classes-config`，等待后续样本再细分。\n\n## 执行逻辑\n\n- DS501xx 直接授权重建使用具体 SoftVersionID 作为运行期 ProName；若配置没有 regInfo，RegStr 使用具体 SoftVersionID，避免应用自身二次检查失败。\n- YX0305xx 直接授权重建使用具体 SoftVersionID 作为运行期 ProName；RegStr 优先使用 classes/config.xml 的显式 regInfo。\n- 手动“生成离线授权码”路径则分别使用已确认的本地注册族 `DS501` / `YX0305`。\n\n## 边界\n\n本版本不会根据命名猜测 QT40101 等尚未提供完整注册业务样本的平台；它们会显示为通用 classes-config，避免把推测写成正式识别规则。\n''',encoding='utf-8')

          # Self-remove one-shot workflow from final branch tree.
          Path('.github/workflows/apply-java-family-v1.2.5.yml').unlink()
          PY
      - name: Commit family model
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "v1.2.5：区分 Java 授权族与运行校验ID"
          git push origin HEAD:feature/java-family-model-v1.2.5
