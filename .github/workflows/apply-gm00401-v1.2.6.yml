name: Apply GM00401 v1.2.6 support

on:
  push:
    branches: [ "fix/gm00401-v1.2.6" ]
    paths: [ ".github/workflows/apply-gm00401-v1.2.6.yml" ]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/gm00401-v1.2.6
      - name: Apply patch
        shell: bash
        run: |
          echo '  E1DLlJlZ2VkaXQuZGxsYCAvIGBpdG1jUmVnZWRpdC5kbGxgIOetiee7hOS7tueahCBBU1AuTkVUIC8gLk5FVOW6lOeUqOOAglRTMDF4eO OAgVlYwMzAxL1lYMDMwMi9Z   IElUTUMuV2ViLmRsbO+8jOehruiupOaOiOadgOS6p+WTgeaXjyBHTTAwNO+8m1xuLSDlj6rmnIkgRExMIOWQjOaXtuWMheWQqyBHTTAwNCDkuI7lhbfkvZM gR00wMDQwMSDml7bmiY3mjqXlj5foorrmmKDvvIzpgb/lhY3ku4XmjInnm67lvZXlkI3njJzmtYv vvJt cbi0gR00wMDQg5a625peP55qEIFJlZ1N0ciDku47 BETEwg5Lit5ZCM5peP5YW35L2T5Lqn5ZOB6aG55o+Q5Y+W77yM5pys5qC35pys5Li6IEdNMDA0MDE77b  此前只能读取 `SoftVersionID=GM00401`，但由于 detector 仅支持 itmcIEC / YX 系列而无法得到 ProName。\n- GM004 识别要求目标 `ITMC.Web.dll` 同时包含具体 `GM00401` 与家族 `GM004`，不会仅凭目录名或 SoftVersionID 猜测产品族。\n- GM004 的 RegStr 从 DLL 内同家族具体产品项提取；当前样本得到 `GM00401`。\n- 不采用该样本 `Web.config` 中与实际 GM00401 配置冲突的遗留 `productName=YX0301`。\n\n### Tests\n\n- 新增 GM004 / GM00401 UTF-16 程序集字符串 fixture，覆盖 ProName 与 RegStr 推导。\n\n'''\nif anchor not in s: raise SystemExit('CHANGELOG anchor missing')\np.write_text(s.replace(anchor,anchor+entry,1),encoding='utf-8')\n\nPath('release-notes/v1.2.6.md').write_text('''# LicenseRecover v1.2.6\n\n本版本根据实际 GM00401 ASP.NET 安装样本补齐 GM004 家族识别。\n\n## GM00401 样本结论\n\n- 根目录 `config.xml` 明确 `SoftVersionID=GM00401`，但没有 `regInfo`。\n- 目标 `ITMC.Web.dll` 同时包含 `GM00401` 与 `GM004`，且 `GM004` 位于 SystemSoft / SoftVersionID / WebSerSoftNo / regName / regType 等注册配置字符串附近。\n- 因此本版本确认该样本的授权产品族 / ProName 为 `GM004`。\n- DLL 中当前仅发现同族具体项 `GM00401`，因此 RegStr 为 `GM00401`。\n- `Web.config` 中存在 `productName=YX0301`，但它与实际 `config.xml`、DLL 产品标识冲突，视为历史遗留业务配置，不参与授权产品识别。\n\n## 安全识别规则\n\n程序不会仅看到 `GM00401` 文件夹名就推导 `GM004`。只有目标程序集自身同时包含具体产品ID和对应家族字符串时才确认映射；否则保持产品号未确认并拒绝 .NET 一键写回。\n\n原有 Java 家族模型、批量扫描、v1.2.4 更新器和其他 .NET 家族行为保持不变。\n''',encoding='utf-8')\n\nPath('.github/workflows/apply-gm00401-v1.2.6.yml').unlink()\n' | base64 -d > /tmp/apply.py
          python3 /tmp/apply.py
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "v1.2.6：补齐 GM00401 .NET 产品族识别"
          git push origin HEAD:fix/gm00401-v1.2.6
