name: Apply v1.2.44 YX030506 projectPath fix v2

on:
  push:
    branches: [ "feature/yx030506-projectpath-v1.2.44" ]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/yx030506-projectpath-v1.2.44
      - name: Patch runtime profile
        shell: python
        run: |
          from pathlib import Path
          p=Path('src/main/java/JavaRegistrationRuntimeProfile.java')
          s=p.read_text(encoding='utf-8')
          old='''            boolean classpathRootEvidence = projectClasspathProvider\n                    && refs.hasMethodRef("com/itmc/utils/ProjectSourcesPath", "projectPath",\n                    "(Ljava/lang/String;)Ljava/lang/String;")\n                    && refs.hasUtf8("/");'''
          new='''            boolean projectPathCall = refs.hasMethodRef("com/itmc/utils/ProjectSourcesPath", "projectPath",\n                    "(Ljava/lang/String;)Ljava/lang/String;")\n                    && refs.hasUtf8("/");\n            boolean classpathRootEvidence = projectPathCall\n                    && (projectClasspathProvider || hasProjectClasspathRootProviderFallback(classes));'''
          if old not in s: raise SystemExit('candidate pattern not found')
          s=s.replace(old,new,1)
          anchor='''    /**\n     * Prove a QT401/RuoYi-style classpath-root factory relay.'''
          helper='''    /**\n     * Fallback proof for YX0305 Spring Boot generations. Keep this fail-closed:\n     * require the exact ProjectSourcesPath class and all constant strings proving\n     * classpath: -> ResourceUtils.getURL -> URL.getPath -> File.getAbsolutePath.\n     */\n    private static boolean hasProjectClasspathRootProviderFallback(File classes) {\n        if (classes == null || !classes.isDirectory()) return false;\n        File provider = new File(classes, "com" + File.separator + "itmc" + File.separator\n                + "utils" + File.separator + "ProjectSourcesPath.class");\n        if (!provider.isFile()) return false;\n        try {\n            byte[] data = Files.readAllBytes(provider.toPath());\n            return containsAscii(data, "classpath:")\n                    && containsAscii(data, "org/springframework/util/ResourceUtils")\n                    && containsAscii(data, "getURL")\n                    && containsAscii(data, "java/net/URL")\n                    && containsAscii(data, "getPath")\n                    && containsAscii(data, "java/io/File")\n                    && containsAscii(data, "getAbsolutePath");\n        } catch (Throwable ignore) {\n            return false;\n        }\n    }\n\n    private static boolean containsAscii(byte[] data, String value) {\n        if (data == null || value == null || value.isEmpty()) return false;\n        byte[] needle = value.getBytes(StandardCharsets.UTF_8);\n        outer: for (int i = 0; i + needle.length <= data.length; i++) {\n            for (int j = 0; j < needle.length; j++) if (data[i + j] != needle[j]) continue outer;\n            return true;\n        }\n        return false;\n    }\n\n'''
          if anchor not in s: raise SystemExit('relay anchor not found')
          s=s.replace(anchor,helper+anchor,1)
          p.write_text(s,encoding='utf-8')

          Path('VERSION.txt').write_text('1.2.44\n',encoding='utf-8')
          Path('release-notes/v1.2.44.md').write_text('''# LicenseRecover v1.2.44\n\n## YX030506 Java runtime-profile 修复\n\n- 修复 YX0305/YX030506 Spring Boot 产品的显式配置路径识别。\n- 目标启动链使用 `ProjectSourcesPath.projectPath("/")`，其实现通过 `ResourceUtils.getURL("classpath:")` 得到 `WEB-INF/classes`，因此三参数 `RegisterMain(product, token, path)` 的真实 path 是 `WEB-INF/classes`。\n- 仍保持 fail-closed：必须同时证明启动类调用 `ProjectSourcesPath.projectPath("/")`，并证明目标 `ProjectSourcesPath.class` 的 classpath-root 实现。\n- 最终成功条件不变：只有 fresh JVM 的 target-native `VERIFY_FRESH: OK` 后才显示最终 `OK`。\n''',encoding='utf-8')
          for name in ['README.md','README.txt','CHANGELOG.md']:
              q=Path(name)
              if q.exists():
                  txt=q.read_text(encoding='utf-8')
                  txt=txt.replace('1.2.43','1.2.44',1)
                  q.write_text(txt,encoding='utf-8')
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/main/java/JavaRegistrationRuntimeProfile.java VERSION.txt README.md README.txt CHANGELOG.md release-notes/v1.2.44.md
          git commit -m "fix: mirror YX030506 ProjectSourcesPath startup path"
          git push
