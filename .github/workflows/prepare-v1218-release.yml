name: Prepare v1.2.18 release

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Prepare release metadata
        run: python3 scripts/prepare-v1218-release.py
      - name: Validate metadata
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test "$(tr -d '\r\n[:space:]' < VERSION.txt)" = '1.2.18'
          grep -Fq '当前稳定版本：**v1.2.18**' README.md
          test -f release-notes/v1.2.18.md
          grep -Fq 'Windows WinINet' release-notes/v1.2.18.md
      - name: Commit release metadata
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md VERSION.txt release-notes/v1.2.18.md
          git commit -m 'release: prepare LicenseRecover v1.2.18'
          git push origin HEAD:main
