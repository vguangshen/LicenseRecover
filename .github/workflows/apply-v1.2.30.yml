name: Apply v1.2.30 ASP.NET host fix

on:
  push:
    branches: [ main ]
    paths:
      - scripts/apply-v1.2.30.py
      - .github/workflows/apply-v1.2.30.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Repair staged import match
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/apply-v1.2.30.py')
          s = p.read_text(encoding='utf-8')
          old = "'import java.io.File;\\nimport java.util.ArrayList;'"
          new = "'import java.io.File;\\nimport java.text.SimpleDateFormat;\\nimport java.util.ArrayList;'"
          if old not in s:
              raise SystemExit('staged import-match expression not found')
          s = s.replace(old, new, 1)
          old = "'import java.io.File;\\nimport java.nio.charset.StandardCharsets;\\nimport java.nio.file.Files;\\nimport java.nio.file.StandardOpenOption;\\nimport java.text.SimpleDateFormat;\\nimport java.util.Date;\\nimport java.util.ArrayList;'"
          new = "'import java.io.File;\\nimport java.nio.charset.StandardCharsets;\\nimport java.nio.file.Files;\\nimport java.nio.file.StandardOpenOption;\\nimport java.text.SimpleDateFormat;\\nimport java.util.ArrayList;'"
          if old not in s:
              raise SystemExit('staged import replacement expression not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Apply staged v1.2.30 patch
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/apply-v1.2.30.py

      - name: Review generated changes
        shell: bash
        run: |
          set -euo pipefail
          git status --short
          git diff --check
          test "$(tr -d '\r\n[:space:]' < VERSION.txt)" = "1.2.30"
          test -f release-notes/v1.2.30.md
          test -f src/dotnet/LicenseRecover.AspNetHost.cs
          grep -Fq 'LicenseRecover.NET.AspNetHost.exe' src/main/java/LicenseRecoverModernGUIAutoRecovery.java
          grep -Fq 'SimpleWorkerRequest' src/dotnet/LicenseRecover.AspNetHost.cs
          grep -Fq 'HttpContext.Current = CreateContext' src/dotnet/LicenseRecover.AspNetHost.cs
          grep -Fq 'appendPersistentOneClickLog' src/main/java/LicenseRecoverModernGUIUiPatchLauncher.java
          grep -Fq 'mono-mcs' .github/workflows/verify-source.yml

      - name: Commit v1.2.30 source changes
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain)" ]; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: host lowercase .NET registration in ASP.NET context'
          git push origin HEAD:main
