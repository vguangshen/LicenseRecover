name: Apply v1.2.26 modern .NET fix

on:
  push:
    branches: [ main ]
    paths:
      - scripts/apply-v1.2.26.py
      - .github/workflows/apply-v1.2.26.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Apply staged v1.2.26 patch
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/apply-v1.2.26.py

      - name: Review generated changes
        shell: bash
        run: |
          set -euo pipefail
          git status --short
          git diff --check
          test "$(tr -d '\r\n[:space:]' < VERSION.txt)" = "1.2.26"
          test -f scripts/prepare-dotnet-modern-helper.py
          test -f release-notes/v1.2.26.md
          grep -Fq 'findDotNetModernNativeHelper' src/main/java/LicenseRecoverModernGUIAutoRecovery.java
          grep -Fq 'LicenseRecover.NET.Modern.exe' scripts/verify.ps1
          grep -Fq 'appendPersistentLog' src/main/java/LicenseRecoverModernGUI.java

      - name: Commit v1.2.26 source changes
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain)" ]; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: use modern ITMC.Regedit native helper'
          git push origin HEAD:main
