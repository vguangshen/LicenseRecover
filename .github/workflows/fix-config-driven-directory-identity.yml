name: Fix config-driven directory identity

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - run: python3 scripts/fix-config-driven-directory-identity.py
      - shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test "$(git diff --name-only)" = "src/main/java/LicenseRecoverModernGUIJavaPlan.java"
          grep -q '!blank(configDrivenRuntime)' src/main/java/LicenseRecoverModernGUIJavaPlan.java
      - shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main/java/LicenseRecoverModernGUIJavaPlan.java
          git commit -m 'fix: 配置驱动运行ID纳入目录证据判定'
          git push origin HEAD:main
