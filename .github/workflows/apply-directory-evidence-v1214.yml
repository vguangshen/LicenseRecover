name: Apply directory evidence v1.2.14

on:
  push:
    branches: [ main ]
    paths:
      - 'scripts/apply-directory-evidence-v1214.py'
      - '.github/workflows/apply-directory-evidence-v1214.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Apply patch
        run: python3 scripts/apply-directory-evidence-v1214.py
      - name: Validate patch scope
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -F 'hasDirectoryBinaryToken' src/main/java/LicenseRecoverModernGUIJavaPlan.java
          grep -F 'probeTargetRegStr' src/main/java/LicenseRecover.java
          grep -F 'Metadata/string heaps can also expose plain ASCII/UTF-8 runs.' src/main/java/LicenseRecoverModernGUIAutoRecovery.java
          grep -F 'valueOrDash(dotNetRegStr)' src/main/java/LicenseRecoverModernGUI.java
          if grep -F 'FALLBACK_ALL_NUMS' src/main/java/LicenseRecoverModernGUIJavaPlan.java; then
            echo 'Unexpected Java fallback table reintroduced' >&2
            exit 1
          fi
      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main/java/LicenseRecoverModernGUIJavaPlan.java \
                  src/main/java/LicenseRecover.java \
                  src/main/java/LicenseRecoverModernGUIAutoRecovery.java \
                  src/main/java/LicenseRecoverModernGUI.java \
                  src/test/java/RefactorSmokeTest.java \
                  scripts/verify.ps1
          git commit -m 'fix: 扩展目标目录注册证据识别'
          git push origin HEAD:main
