name: Diagnose YX smoke

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/diag-yx-smoke.yml'

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '8'
      - name: Compile and run smoke test
        shell: bash
        run: |
          set +e
          rm -rf build/yxdiag && mkdir -p build/yxdiag/main build/yxdiag/test
          javac -encoding UTF-8 -cp LicenseRecoverGUI.jar -d build/yxdiag/main $(find src/main/java -maxdepth 1 -name '*.java' -print | sort) > build/yxdiag.log 2>&1
          rc=$?
          if [ $rc -eq 0 ]; then
            javac -encoding UTF-8 -cp "build/yxdiag/main:LicenseRecoverGUI.jar" -d build/yxdiag/test src/test/java/RefactorSmokeTest.java >> build/yxdiag.log 2>&1
            rc=$?
          fi
          if [ $rc -eq 0 ]; then
            java -cp "build/yxdiag/main:build/yxdiag/test:LicenseRecoverGUI.jar" RefactorSmokeTest >> build/yxdiag.log 2>&1
            rc=$?
          fi
          echo "EXIT_CODE=$rc" >> build/yxdiag.log
          cat build/yxdiag.log
          cp build/yxdiag.log diagnostics-yx-smoke.txt
          exit 0
      - name: Commit diagnostic
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add diagnostics-yx-smoke.txt
          git commit -m 'chore: capture YX smoke diagnostic'
          git push origin HEAD:main
