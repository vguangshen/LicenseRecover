name: Verify source

on:
  push:
    branches: [ main, "refactor/**" ]
  pull_request:

jobs:
  compile-java:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '8'
      - name: Compile, test and assemble verified distribution
        shell: pwsh
        run: ./scripts/verify.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: LicenseRecover-latest
          path: |
            build/LicenseRecover-latest.zip
            build/SHA256SUMS.txt
          if-no-files-found: error
      - name: Sync verified overlay to refactor branch
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/refactor/')
        shell: bash
        run: |
          set -euo pipefail
          cp build/LicenseRecoverOverlay.jar LicenseRecoverOverlay.jar
          if [ -z "$(git status --porcelain -- LicenseRecoverOverlay.jar)" ]; then
            echo 'Overlay already matches verified build.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add LicenseRecoverOverlay.jar
          git commit -m '同步CI验证的运行时overlay'
          git push origin "HEAD:${GITHUB_REF_NAME}"
      - name: Publish rolling latest release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag='rolling-latest'
          title='LicenseRecover Rolling Latest'
          notes_file='build/rolling-release-notes.md'

          cat > "$notes_file" <<EOF
          Automated verified build from main.

          Commit: ${GITHUB_SHA}
          Workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}

          Assets:
          - LicenseRecover-latest.zip
          - SHA256SUMS.txt

          This is a rolling prerelease. The tag moves to the latest successfully verified main commit.
          EOF

          git tag -f "$tag" "$GITHUB_SHA"
          git push --force origin "refs/tags/$tag"

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --title "$title" --notes-file "$notes_file" --prerelease
          else
            gh release create "$tag" --title "$title" --notes-file "$notes_file" --prerelease
          fi

          gh release upload "$tag" \
            build/LicenseRecover-latest.zip \
            build/SHA256SUMS.txt \
            --clobber
      - name: Publish versioned stable release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n[:space:]' < VERSION.txt)"
          tag="v${version}"
          notes_file="release-notes/${tag}.md"

          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid VERSION.txt value: $version" >&2
            exit 1
          fi
          if [ ! -f "$notes_file" ]; then
            echo "Missing stable release notes: $notes_file" >&2
            exit 1
          fi

          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Stable release $tag already exists; leaving it unchanged."
            exit 0
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "Tag $tag exists without a matching GitHub Release; refusing to overwrite it." >&2
            exit 1
          fi

          gh release create "$tag" \
            build/LicenseRecover-latest.zip \
            build/SHA256SUMS.txt \
            --target "$GITHUB_SHA" \
            --title "LicenseRecover $tag" \
            --notes-file "$notes_file"
