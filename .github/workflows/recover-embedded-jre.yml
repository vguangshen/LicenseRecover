name: Recover embedded JRE

on:
  push:
    branches:
      - fix/embedded-jre-v1.1.1

permissions:
  contents: write

jobs:
  recover-jre:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Recover JRE from pre-refactor distribution
        shell: bash
        run: |
          set -euo pipefail
          OLD_COMMIT=35a6f10678b3bfd3fc7b460655d52d451bb7da0c
          git fetch --depth=1 origin "$OLD_COMMIT"
          git show "$OLD_COMMIT:LicenseRecover-latest.zip" > old-LicenseRecover.zip
          mkdir -p recovered
          unzip -q old-LicenseRecover.zip -d recovered
          JAVA_EXE="$(find recovered -type f -path '*/jre/bin/java.exe' -print -quit)"
          if [ -z "$JAVA_EXE" ]; then
            echo 'No jre/bin/java.exe found in historical distribution.' >&2
            exit 1
          fi
          JRE_DIR="$(dirname "$(dirname "$JAVA_EXE")")"
          test -f "$JRE_DIR/bin/javaw.exe"
          test -f "$JRE_DIR/LICENSE"
          test -f "$JRE_DIR/THIRD_PARTY_README"
          test -f "$JRE_DIR/ASSEMBLY_EXCEPTION"
          echo "Recovered JRE directory: $JRE_DIR"
          echo "Total size: $(du -sh "$JRE_DIR" | cut -f1)"
          if ! grep -a -q 'Corretto-8.492.09.2' "$JRE_DIR/lib/rt.jar"; then
            echo 'Historical JRE is not the expected Amazon Corretto 8.492.09.2 runtime.' >&2
            exit 1
          fi
          PARENT="$(dirname "$JRE_DIR")"
          NAME="$(basename "$JRE_DIR")"
          (cd "$PARENT" && zip -qr "$GITHUB_WORKSPACE/LicenseRecover-jre8-win-x64.zip" "$NAME")
          sha256sum LicenseRecover-jre8-win-x64.zip > LicenseRecover-jre8-win-x64.sha256
          cat > JRE_SOURCE_NOTICE.txt <<'EOF'
          Embedded runtime: Amazon Corretto 8.492.09.2, Windows x64 JRE
          Java runtime version: 1.8.0_492-b09

          The runtime archive preserves Amazon Corretto / OpenJDK license and third-party notice files,
          including LICENSE, ASSEMBLY_EXCEPTION and THIRD_PARTY_README.

          Amazon Corretto 8 source and licensing information:
          https://github.com/corretto/corretto-8
          https://github.com/corretto/corretto-8/releases/tag/8.492.09.2

          The embedded runtime is kept as a separate release asset so the source repository does not
          need to track more than 100 MB of generated/runtime files.
          EOF

      - name: Upload recovered JRE for inspection
        uses: actions/upload-artifact@v7
        with:
          name: recovered-embedded-jre
          path: |
            LicenseRecover-jre8-win-x64.zip
            LicenseRecover-jre8-win-x64.sha256
            JRE_SOURCE_NOTICE.txt
          if-no-files-found: error

      - name: Publish fixed runtime asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag='runtime-corretto8-8.492.09.2-win-x64'
          title='Embedded Runtime - Amazon Corretto 8.492.09.2 Windows x64'
          cat > runtime-release-notes.md <<'EOF'
          Fixed embedded Java runtime used by LicenseRecover portable distributions.

          - Amazon Corretto 8.492.09.2
          - OpenJDK Runtime 1.8.0_492-b09
          - Windows x64 JRE
          - Preserves LICENSE, ASSEMBLY_EXCEPTION and THIRD_PARTY_README
          - Recovered from the pre-refactor LicenseRecover portable distribution and verified against its Corretto version metadata

          This runtime release is a prerelease/support asset and is not considered an application update by the LicenseRecover updater.
          EOF
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --title "$title" --notes-file runtime-release-notes.md --prerelease
          else
            gh release create "$tag" --target main --title "$title" --notes-file runtime-release-notes.md --prerelease
          fi
          gh release upload "$tag" \
            LicenseRecover-jre8-win-x64.zip \
            LicenseRecover-jre8-win-x64.sha256 \
            JRE_SOURCE_NOTICE.txt \
            --clobber
