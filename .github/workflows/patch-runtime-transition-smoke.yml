name: Patch runtime transition smoke

on:
  push:
    branches: [ main ]
    paths:
      - .github/workflows/patch-runtime-transition-smoke.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Patch updater smoke fixture
        run: python3 scripts/patch-runtime-transition-smoke.py
      - name: Validate diff
        run: git diff --check
      - name: Commit test fix
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm -f .github/workflows/patch-runtime-transition-smoke.yml
          rm -f scripts/patch-runtime-transition-smoke.py
          git add -A
          git commit -m "test: cover transition-safe runtime updater"
          git push origin HEAD:main
