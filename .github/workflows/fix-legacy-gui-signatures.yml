name: Fix legacy GUI signatures

on:
  push:
    branches: [ main ]
    paths:
      - 'scripts/fix-legacy-gui-signatures.py'
      - '.github/workflows/fix-legacy-gui-signatures.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Fix signatures
        run: python3 scripts/fix-legacy-gui-signatures.py
      - name: Check diff
        run: git diff --check
      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main/java/LicenseRecoverGUI.java
          git commit -m 'fix: 修正旧GUI严格模式方法签名'
          git push origin HEAD:main
