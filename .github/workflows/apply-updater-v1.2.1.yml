name: Apply updater v1.2.1

on:
  push:
    branches: [ work/updater-v1.2.1 ]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '8'
      - name: Apply exact v1.2.1 source payload
        run: python3 scripts/apply-updater-v1.2.1.py
      - name: Validate generated sources
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test "$(tr -d '\r\n[:space:]' < VERSION.txt)" = "1.2.1"
          grep -q 'LicenseRecoverGUI.exe' run_gui.bat
          if grep -q '&&' run_gui.bat; then
            echo 'run_gui.bat still contains unsafe chained && syntax' >&2
            exit 1
          fi
          mkdir -p build/bootstrap-compile
          javac -source 8 -target 8 -encoding UTF-8 -cp LicenseRecoverGUI.jar -d build/bootstrap-compile src/main/java/*.java
          pwsh -NoProfile -Command '[scriptblock]::Create((Get-Content -LiteralPath ./scripts/package-native-launcher.ps1 -Raw)) | Out-Null'
      - name: Commit prepared v1.2.1 tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'v1.2.1：修复在线更新并统一 EXE 入口'
          git push origin "HEAD:${GITHUB_REF_NAME}"
