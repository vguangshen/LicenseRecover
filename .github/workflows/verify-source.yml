name: Verify source

on:
  push:
    branches: [ main, "refactor/**" ]
  pull_request:

jobs:
  compile-java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
      - name: Compile all Java sources against bundled GUI runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/verify
          javac -encoding UTF-8 -cp LicenseRecoverGUI.jar -d build/verify *.java
