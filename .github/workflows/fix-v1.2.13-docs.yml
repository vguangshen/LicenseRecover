name: Fix v1.2.13 docs
on:
  push:
    branches: [ "fix/yt00138-dotnet-native-1.2.13" ]
permissions:
  contents: write
jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[v1.2.13-docs]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/yt00138-dotnet-native-1.2.13
      - run: python3 tools/fix_v1_2_13_docs.py
      - shell: bash
        run: |
          set -euo pipefail
          rm -f tools/fix_v1_2_13_docs.py .github/workflows/fix-v1.2.13-docs.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'docs: update v1.2.13 metadata [v1.2.13-docs]'
          git push origin HEAD:fix/yt00138-dotnet-native-1.2.13
