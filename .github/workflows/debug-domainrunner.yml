name: Debug helper DomainRunner

on:
  push:
    branches: [ debug-helper-domainrunner ]
    paths:
      - .github/workflows/debug-domainrunner.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Inspect LicenseRecover.NET IL
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update >/dev/null
          sudo apt-get install -y --no-install-recommends mono-utils >/dev/null
          monodis LicenseRecover.NET/LicenseRecover.NET.exe > helper.il
          echo '=== Program method table ==='
          monodis --method LicenseRecover.NET/LicenseRecover.NET.exe | sed -n '/########## LicenseRecoverNet.Program/,/########## LicenseRecoverNet.Program\/TeeWriter/p' | head -n 120
          echo '=== isolation method IL ==='
          sed -n '11120,11390p' helper.il
          echo '=== Program Main / RunDirect references ==='
          grep -n -B 12 -A 35 -E 'Program::RunDirect|Program::RunIsolated|Program::RunIn|DomainRunner::Run|CreateDomain' helper.il | tail -n 700
