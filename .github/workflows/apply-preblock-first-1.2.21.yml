name: Apply pre-block-first 1.2.21

on:
  push:
    branches: [ main ]
    paths:
      - 'scripts/apply-preblock-first-1.2.21.py'
      - '.github/workflows/apply-preblock-first-1.2.21.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply patch
        run: python scripts/apply-preblock-first-1.2.21.py
      - name: Sanity checks
        shell: bash
        run: |
          git diff --check
          grep -q 'PRE-BLOCK -> gencode -> DoRegistry -> CheckReInfo' src/main/java/LicenseRecoverModernGUIAutoRecovery.java
          grep -q 'installJavaAuthorizationNetworkGuard' src/main/java/LicenseRecover.java
          grep -q 'action=block' src/main/java/LicenseRecoverModernGUIAutoRecovery.java
          ! grep -q 'cloud blocking applied afterwards' src/main/java/LicenseRecoverModernGUIAutoRecovery.java
      - name: Commit
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main/java/LicenseRecoverModernGUIAutoRecovery.java src/main/java/LicenseRecover.java src/test/java/RefactorSmokeTest.java
          git commit -m 'fix: 原生注册前先隔离授权云端'
          git push origin HEAD:main
