name: Apply Java plan batch v1.2.2

on:
  push:
    branches: [ work/java-plan-batch-v1.2.2 ]
    paths: [ '.github/workflows/apply-java-plan-batch-v1.2.2.yml' ]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '8'
      - name: Apply v1.2.2 source patches
        run: python3 ./scripts/apply-java-plan-batch-v1.2.2.py
      - name: Compile patched Java sources
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/lr-v122-main /tmp/lr-v122-test
          mkdir -p /tmp/lr-v122-main /tmp/lr-v122-test
          javac -encoding UTF-8 -cp LicenseRecoverGUI.jar -d /tmp/lr-v122-main $(find src/main/java -maxdepth 1 -name '*.java' -print | sort)
          javac -encoding UTF-8 -cp "/tmp/lr-v122-main:LicenseRecoverGUI.jar" -d /tmp/lr-v122-test src/test/java/RefactorSmokeTest.java
          java -cp "/tmp/lr-v122-main:/tmp/lr-v122-test:LicenseRecoverGUI.jar" RefactorSmokeTest
      - name: Commit prepared v1.2.2 tree
        shell: bash
        run: |
          set -euo pipefail
          rm -f scripts/apply-java-plan-batch-v1.2.2.py
          rm -f .github/workflows/apply-java-plan-batch-v1.2.2.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'v1.2.2：Java授权计划可视化与批量一键恢复'
          git push origin HEAD:work/java-plan-batch-v1.2.2
