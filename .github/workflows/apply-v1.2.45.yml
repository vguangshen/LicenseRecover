name: Apply v1.2.45 DS50109 YX030506 regression fix

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/apply-v1.2.45.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '8'
      - name: Apply source and regression patch
        run: python3 scripts/apply-v1.2.45.py
      - name: Compile patched Java source and smoke test
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build/patch-compile
          mkdir -p build/patch-compile/main build/patch-compile/test
          javac -encoding UTF-8 -cp LicenseRecoverGUI.jar -d build/patch-compile/main src/main/java/*.java
          javac -encoding UTF-8 -cp "build/patch-compile/main:LicenseRecoverGUI.jar" -d build/patch-compile/test src/test/java/RefactorSmokeTest.java
      - name: Commit v1.2.45 and remove one-time patch files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f scripts/apply-v1.2.45.py .github/workflows/apply-v1.2.45.yml
          git add src/main/java/LicenseRecoverModernGUIJavaPlan.java src/test/java/RefactorSmokeTest.java VERSION.txt README.md CHANGELOG.md release-notes/v1.2.45.md
          git diff --cached --check
          git commit -m 'Release v1.2.45: restore DS50109 YX030506 batch readiness'
          git push origin HEAD:main
