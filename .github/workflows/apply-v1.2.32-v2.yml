name: Apply v1.2.32 release staging v2

on:
  push:
    branches: [ patch/v1.2.32-direct-helper ]
    paths:
      - .github/workflows/apply-v1.2.32-v2.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Patch release metadata and tests
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def rd(p): return Path(p).read_text(encoding='utf-8')
          def wr(p,s):
              q=Path(p); q.parent.mkdir(parents=True,exist_ok=True); q.write_text(s,encoding='utf-8')
          def one(p,a,b):
              s=rd(p)
              if s.count(a)!=1: raise SystemExit(f'{p}: match count {s.count(a)} for {a[:80]!r}')
              wr(p,s.replace(a,b,1))

          if rd('VERSION.txt').strip()!='1.2.31': raise SystemExit('unexpected VERSION')
          wr('VERSION.txt','1.2.32\n')
          one('README.md','当前稳定版本：**v1.2.31**','当前稳定版本：**v1.2.32**')

          head='''## [1.2.32] - 2026-09-09

### Fixed

- 修复 v1.2.31 在真实 YX030101 上进入 ASP.NET host 后的 `DomainRunner` 子域加载错误。原 helper 对小写 `itmcRegedit.dll` 会创建子 AppDomain，并通过 `Assembly.GetEntryAssembly()` 定位 `LicenseRecoverNet.DomainRunner`；host 反射调用场景下 EntryAssembly 实际变成 `LicenseRecover.NET.AspNetHost.exe`。
- ASP.NET host 不再调用 helper EntryPoint；它加载未修改的 `LicenseRecover.NET.exe`，调用 helper 自己的私有 `ParseArgs()` 后直接调用公开 `RunDirect()`，使 `gencode / doreg / verify` 与目标小写注册组件保持在当前 ASP.NET AppDomain。
- 同域执行同时保证 v1.2.30/31 建立的 `HttpContext.Current` 不会因切换 AppDomain 丢失，目标 `Server.MapPath("~/...")` 继续按真实 Web 根目录解析。
- 不修改目标 `itmcRegedit.dll`，不替换目标申请号、离线授权码、`DoRegistry()` 或 `CheckReInfo()` 算法；大写 `ITMC.Regedit.dll` 回退链保持不变。

### Regression

- CI 要求 ASP.NET host 包含 `ParseArgs` + `RunDirect` 同域派发，并禁止重新通过 `assembly.EntryPoint` 进入 helper 子域派发。
- 保持小写优先、大写回退、PRE-BLOCK FIRST、失败回滚与结构化错误日志不变。

## [1.2.31] - 2026-09-09

### Fixed

- 修复 v1.2.30 在设置 ASP.NET `.appPath/.appVPath` 后又使用五参数 `SimpleWorkerRequest` 覆盖应用路径，导致真实 .NET Framework 抛出“SimpleWorkerRequest 构造函数的无效使用”。
- 改用不覆盖应用路径的三参数 `SimpleWorkerRequest`，继续让 `~/Register.xml` / `~/config.xml` 解析到目标 Web 根目录。

'''
          ch=rd('CHANGELOG.md')
          if not ch.startswith('## [1.2.30]'): raise SystemExit('unexpected changelog head')
          wr('CHANGELOG.md',head+ch)

          notes='''# LicenseRecover v1.2.32

本版根据真实 Windows / .NET Framework 上 YX030101 的 v1.2.31 回归继续修复小写 `itmcRegedit.dll` 注册链。

## 根因

v1.2.31 已成功创建 ASP.NET `HttpContext`，但随后反射调用原 `LicenseRecover.NET.exe` EntryPoint。原 helper 的 `Program.Run()` 在检测到小写 `itmcRegedit.dll` 时会创建子 AppDomain，并用 `Assembly.GetEntryAssembly().Location` 去 `CreateInstanceFromAndUnwrap(..., "LicenseRecoverNet.DomainRunner")`。在 host 场景下 EntryAssembly 是 `LicenseRecover.NET.AspNetHost.exe`，因此真实机报“未能从程序集 LicenseRecover.NET.AspNetHost 中加载类型 LicenseRecoverNet.DomainRunner”。

仅修正程序集名也不够，因为子 AppDomain 不会继承父域的 `HttpContext.Current`，目标注册组件仍会失去其 `Server.MapPath` 上下文。

## 修复

- ASP.NET host 继续加载原始、未修改的 `LicenseRecover.NET.exe`。
- host 反射调用 helper 自己的 `ParseArgs()`，保留原命令行解析语义。
- 随后直接调用 helper 的公开 `RunDirect()`，在同一个 ASP.NET AppDomain 内执行目标注册流程，不再进入 `RunInBinDomain()`。
- `HttpContext.Current` 因此在 `gencode -> doreg -> verify` 期间保持有效；目标 `itmcRegedit.dll` 仍负责动态申请号、离线授权码写入与原生校验。
- 大写 `ITMC.Regedit.dll` / `LicenseRecover.NET.Modern.exe` 路线不变。

## 验证重点

YX030101 日志应出现 `[ASPNET_HOST] helperDispatch=RunDirect/same-AppDomain`，并且不再出现 `LicenseRecoverNet.DomainRunner` 子域加载错误。
'''
          wr('release-notes/v1.2.32.md',notes)

          one('src/test/java/RefactorSmokeTest.java',
              '        check(hostSource230.contains("Assembly.LoadFrom(helper)"), "ASP.NET host forwards to existing helper assembly");\n        check(hostSource230.contains("ResolveAppRoot(runtimeDir)"), "ASP.NET host resolves target web root from runtime dir");',
              '        check(hostSource230.contains("Assembly.LoadFrom(helper)"), "ASP.NET host loads the existing helper assembly");\n        check(hostSource230.contains("ParseArgs") && hostSource230.contains("RunDirect"),\n                "ASP.NET host dispatches helper commands directly in the current AppDomain");\n        check(!hostSource230.contains("assembly.EntryPoint"),\n                "ASP.NET host does not re-enter helper child-AppDomain dispatch through EntryPoint");\n        check(hostSource230.contains("helperDispatch=RunDirect/same-AppDomain"),\n                "ASP.NET host emits same-AppDomain dispatch diagnostics");\n        check(hostSource230.contains("ResolveAppRoot(runtimeDir)"), "ASP.NET host resolves target web root from runtime dir");')

          one('scripts/verify.ps1',
              "foreach ($marker in @('SimpleWorkerRequest','HttpContext','LicenseRecover.NET.exe','ASPNET_HOST')) {\n    if (($aspHostAscii.IndexOf($marker, [StringComparison]::OrdinalIgnoreCase) -lt 0) -and\n        ($aspHostUnicode.IndexOf($marker, [StringComparison]::OrdinalIgnoreCase) -lt 0)) {\n        throw \"ASP.NET host helper is missing marker: $marker\"\n    }\n}\n\nWrite-Host 'Verifying directory-only registration identity policy...'",
              "foreach ($marker in @('SimpleWorkerRequest','HttpContext','LicenseRecover.NET.exe','ASPNET_HOST','ParseArgs','RunDirect')) {\n    if (($aspHostAscii.IndexOf($marker, [StringComparison]::OrdinalIgnoreCase) -lt 0) -and\n        ($aspHostUnicode.IndexOf($marker, [StringComparison]::OrdinalIgnoreCase) -lt 0)) {\n        throw \"ASP.NET host helper is missing marker: $marker\"\n    }\n}\n$aspHostSourceText = Get-Content -LiteralPath $aspNetHostSource -Raw\nif ($aspHostSourceText.Contains('assembly.EntryPoint')) { throw 'ASP.NET host must not re-enter helper EntryPoint/child-AppDomain dispatch.' }\nif (-not $aspHostSourceText.Contains('helperDispatch=RunDirect/same-AppDomain')) { throw 'ASP.NET host same-AppDomain dispatch marker is missing.' }\n\nWrite-Host 'Verifying directory-only registration identity policy...'")
          PY
          git diff --check
      - name: Commit release staging
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add VERSION.txt README.md CHANGELOG.md release-notes/v1.2.32.md src/test/java/RefactorSmokeTest.java scripts/verify.ps1
          git commit -m 'fix: keep lowercase helper in ASP.NET host AppDomain'
          git push origin HEAD:patch/v1.2.32-direct-helper
