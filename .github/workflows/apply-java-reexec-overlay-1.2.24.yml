name: Apply Java reexec Overlay classpath 1.2.24
on:
  push:
    branches: [ main ]
    paths:
      - 'scripts/patch-java-reexec-overlay-1.2.24.py'
      - '.github/workflows/apply-java-reexec-overlay-1.2.24.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply source/test/release patch
        run: python scripts/patch-java-reexec-overlay-1.2.24.py
      - name: Check diff
        run: git diff --check
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main/java/LicenseRecover.java src/test/java/RefactorSmokeTest.java scripts/verify.ps1 VERSION.txt README.md release-notes/v1.2.24.md
          git commit -m 'fix: 修复Java脱壳重跑Overlay classpath并发布v1.2.24'
          git push origin HEAD:main
