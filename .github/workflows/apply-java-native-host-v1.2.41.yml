name: Apply Java target-native recovery refactor

on:
  push:
    branches: [ "refactor/java-native-host-v1.2.41" ]

permissions:
  contents: write

concurrency:
  group: java-native-host-refactor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Apply Java native-host refactor
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/apply-java-native-host-v1.2.41.py
          git diff --check
          git status --short
      - name: Commit refactor
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain -- src/main/java/LicenseRecoverJavaHost.java src/main/java/LicenseRecoverModernGUIAutoRecovery.java src/test/java/RefactorSmokeTest.java scripts/verify.ps1)" ]; then
            echo 'No source changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main/java/LicenseRecoverJavaHost.java src/main/java/LicenseRecoverModernGUIAutoRecovery.java src/test/java/RefactorSmokeTest.java scripts/verify.ps1
          git commit -m 'refactor: Java target-native staged registration recovery'
          git push origin "HEAD:${GITHUB_REF_NAME}"
