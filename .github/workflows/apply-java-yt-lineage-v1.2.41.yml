name: Apply Java YT001xx runtime-profile parity

on:
  push:
    branches:
      - refactor/java-native-host-v1.2.41
    paths:
      - .github/workflows/apply-java-yt-lineage-v1.2.41.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refactor/java-native-host-v1.2.41
          fetch-depth: 0
      - name: Apply patch
        run: python3 scripts/apply-java-yt-lineage-v1.2.41.py
      - name: Commit patch and remove one-shot files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/apply-java-yt-lineage-v1.2.41.yml scripts/apply-java-yt-lineage-v1.2.41.py
          git add src/main/java/JavaRegistrationRuntimeProfile.java \
                  src/main/java/LicenseRecoverJavaHost.java \
                  src/main/java/LicenseRecoverModernGUIAutoRecovery.java \
                  src/test/java/RefactorSmokeTest.java \
                  scripts/verify.ps1 docs/java-runtime-profile-v1.2.41.md
          git commit -m 'fix: mirror YT001xx Java startup registration flow'
          git push origin HEAD:refactor/java-native-host-v1.2.41
