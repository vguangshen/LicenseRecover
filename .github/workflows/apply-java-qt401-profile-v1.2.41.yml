          new='''        Boolean unregistered = null;
        if (o.checkReInfo) {
            Method check = findNoArgMethod(reg.getClass(), "checkReInfo");
            if (check == null) throw new NoSuchMethodException("target RegisterMain has no checkReInfo()");
