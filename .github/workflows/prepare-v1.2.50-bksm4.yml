name: Prepare BKSM4 committed mapping fix

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/prepare-v1.2.50-bksm4.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - name: Apply BKSM4 parser and regression patch
        run: python3 scripts/prepare-v1.2.50-bksm4.py
      - name: Validate patch
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'isRegisterProductBeansAdd' src/main/java/LegacyJavaRegistrationMetadata.java
          grep -q 'stale uncommitted QT04/QT0435' src/test/java/RefactorSmokeTest.java
          git diff --check
      - name: Commit source fix and clean one-time helpers
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/prepare-v1.2.50-bksm4.yml scripts/prepare-v1.2.50-bksm4.py
          git add src/main/java/LegacyJavaRegistrationMetadata.java src/test/java/RefactorSmokeTest.java
          git diff --cached --check
          git commit -m 'fix: require committed Global registration rows for BKSM4'
          git push origin HEAD:main
