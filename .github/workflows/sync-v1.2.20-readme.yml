name: Sync v1.2.20 README metadata

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/sync-v1.2.20-readme.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Sync stable version text
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('README.md')
          s = p.read_text(encoding='utf-8')
          old = '当前稳定版本：**v1.2.19**'
          new = '当前稳定版本：**v1.2.20**'
          if s.count(old) != 1:
              raise SystemExit(f'expected exactly one README version anchor, found {s.count(old)}')
          p.write_text(s.replace(old, new, 1), encoding='utf-8', newline='\n')
          PY
          git diff --check
          git diff -- README.md
      - name: Commit
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md
          git commit -m 'docs: mark v1.2.20 as current stable'
          git push origin HEAD:main
