name: Harden v1.2.30 ASP.NET helper verification

on:
  push:
    branches: [ main ]
    paths:
      - .github/workflows/apply-v1.2.30-ci-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Accept CLR metadata strings in ASCII or UTF-16
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/verify.ps1')
          s = p.read_text(encoding='utf-8')
          old = '''$aspHostBytes = [IO.File]::ReadAllBytes($aspNetHostHelper)
          $aspHostUnicode = [Text.Encoding]::Unicode.GetString($aspHostBytes)
          foreach ($marker in @('SimpleWorkerRequest','HttpContext','LicenseRecover.NET.exe','ASPNET_HOST')) {
              if ($aspHostUnicode.IndexOf($marker, [StringComparison]::OrdinalIgnoreCase) -lt 0) {
                  throw "ASP.NET host helper is missing marker: $marker"
              }
          }'''.replace('          ', '')
          new = '''$aspHostBytes = [IO.File]::ReadAllBytes($aspNetHostHelper)
          $aspHostAscii = [Text.Encoding]::ASCII.GetString($aspHostBytes)
          $aspHostUnicode = [Text.Encoding]::Unicode.GetString($aspHostBytes)
          foreach ($marker in @('SimpleWorkerRequest','HttpContext','LicenseRecover.NET.exe','ASPNET_HOST')) {
              if (($aspHostAscii.IndexOf($marker, [StringComparison]::OrdinalIgnoreCase) -lt 0) -and
                  ($aspHostUnicode.IndexOf($marker, [StringComparison]::OrdinalIgnoreCase) -lt 0)) {
                  throw "ASP.NET host helper is missing marker: $marker"
              }
          }'''.replace('          ', '')
          if old not in s:
              raise SystemExit('verify.ps1 ASP.NET helper marker block not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
          git diff --check
          grep -Fq '$aspHostAscii' scripts/verify.ps1
      - name: Commit CI verification fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/verify.ps1
          git commit -m 'ci: verify ASP.NET helper metadata in both encodings'
          git push origin HEAD:main
