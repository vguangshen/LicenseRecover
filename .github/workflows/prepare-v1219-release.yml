name: Prepare v1.2.19 release

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/prepare-v1219-release.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Prepare metadata
        run: python3 scripts/prepare-v1219-release.py
      - name: Validate metadata
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test "$(tr -d '\r\n[:space:]' < VERSION.txt)" = '1.2.19'
          grep -Fq '当前稳定版本：**v1.2.19**' README.md
          test -f release-notes/v1.2.19.md
          grep -Fq 'YX0102' release-notes/v1.2.19.md
          grep -Fq 'YX030506' release-notes/v1.2.19.md
      - name: Commit release metadata
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md VERSION.txt release-notes/v1.2.19.md
          git commit -m 'release: prepare LicenseRecover v1.2.19'
          git push origin HEAD:main
