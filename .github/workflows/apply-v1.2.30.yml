name: Apply v1.2.30 ASP.NET host fix

on:
  push:
    branches: [ main ]
    paths:
      - scripts/apply-v1.2.30.py
      - .github/workflows/apply-v1.2.30.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Repair staged script for current main
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('scripts/apply-v1.2.30.py')
          s = p.read_text(encoding='utf-8')

          old = "'import java.io.File;\\nimport java.util.ArrayList;'"
          new = "'import java.io.File;\\nimport java.text.SimpleDateFormat;\\nimport java.util.ArrayList;'"
          if old in s:
              s = s.replace(old, new, 1)
          old = "'import java.io.File;\\nimport java.nio.charset.StandardCharsets;\\nimport java.nio.file.Files;\\nimport java.nio.file.StandardOpenOption;\\nimport java.text.SimpleDateFormat;\\nimport java.util.Date;\\nimport java.util.ArrayList;'"
          new = "'import java.io.File;\\nimport java.nio.charset.StandardCharsets;\\nimport java.nio.file.Files;\\nimport java.nio.file.StandardOpenOption;\\nimport java.text.SimpleDateFormat;\\nimport java.util.ArrayList;'"
          if old in s:
              s = s.replace(old, new, 1)

          # verify-source.yml has already been updated directly by the user-authorized
          # GitHub connector. Do not ask github-actions[bot] to modify workflow files.
          pattern = r'\n# CI/toolchain: ensure Mono C# compiler \+ System\.Web reference assembly are present\.\nreplace_once\(\n    "\.github/workflows/verify-source\.yml",.*?\n\)\n\n# verify\.ps1:'
          replacement = '\n# CI/toolchain is already present on main.\n\n# verify.ps1:'
          s2, count = re.subn(pattern, replacement, s, count=1, flags=re.S)
          if count != 1:
              raise SystemExit('could not remove staged verify-source.yml replacement block')
          p.write_text(s2, encoding='utf-8')
          PY

      - name: Apply staged v1.2.30 patch
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/apply-v1.2.30.py

      - name: Review generated changes
        shell: bash
        run: |
          set -euo pipefail
          git status --short
          git diff --check
          test "$(tr -d '\r\n[:space:]' < VERSION.txt)" = "1.2.30"
          test -f release-notes/v1.2.30.md
          test -f src/dotnet/LicenseRecover.AspNetHost.cs
          grep -Fq 'LicenseRecover.NET.AspNetHost.exe' src/main/java/LicenseRecoverModernGUIAutoRecovery.java
          grep -Fq 'SimpleWorkerRequest' src/dotnet/LicenseRecover.AspNetHost.cs
          grep -Fq 'HttpContext.Current = CreateContext' src/dotnet/LicenseRecover.AspNetHost.cs
          grep -Fq 'appendPersistentOneClickLog' src/main/java/LicenseRecoverModernGUIUiPatchLauncher.java
          grep -Fq 'mono-mcs' .github/workflows/verify-source.yml
          if ! git diff --name-only | grep -q '^\.github/workflows/'; then
            echo 'No workflow files in bot-generated diff.'
          else
            echo 'Bot-generated diff unexpectedly contains a workflow file.' >&2
            exit 1
          fi

      - name: Commit v1.2.30 source changes
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain)" ]; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: host lowercase .NET registration in ASP.NET context'
          git push origin HEAD:main
