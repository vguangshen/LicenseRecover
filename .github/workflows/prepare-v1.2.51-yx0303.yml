name: Prepare YX0303 runtime product fix

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/prepare-v1.2.51-yx0303.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - name: Apply YX0303 product selection regression fix
        run: python3 scripts/prepare-v1.2.51-yx0303.py
      - name: Validate patch
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'selectDotNetRegistrationProduct' src/main/java/LicenseRecoverModernGUIAutoRecovery.java
          grep -q 'misleading broad Web.config productName=YX03' src/test/java/RefactorSmokeTest.java
          git diff --check
      - name: Commit source fix and clean one-time helpers
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/prepare-v1.2.51-yx0303.yml scripts/prepare-v1.2.51-yx0303.py
          git add src/main/java/LicenseRecoverModernGUIAutoRecovery.java src/test/java/RefactorSmokeTest.java
          git diff --cached --check
          git commit -m 'fix: use YX0303 runtime product over broad Web.config identity'
          git push origin HEAD:main
