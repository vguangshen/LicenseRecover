name: Apply v1.2.46 Java plan fix

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fix-v1.2.46-java-plan.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Apply source patch
        run: python3 scripts/apply-v1.2.46-java-plan-fix.py
      - name: Validate diff
        run: git diff --check
      - name: Commit patched source
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm -f .github/workflows/fix-v1.2.46-java-plan.yml
          rm -f scripts/apply-v1.2.46-java-plan-fix.py
          git add -A
          git commit -m "fix: prove DS501/YX0305 runtime from target startup chain"
          git push origin HEAD:main
