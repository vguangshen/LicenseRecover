name: ASP.NET host Windows integration

on:
  push:
    branches: [ "fix/v1.2.37-real-aspnet-host" ]
  pull_request:

jobs:
  hosted-map-path:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build realistic YX030101-style fixture and host helpers
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $test = Join-Path $PWD 'build\aspnet-host-integration'
          $app = Join-Path $test 'YX030101'
          $bin = Join-Path $app 'bin'
          $tool = Join-Path $test 'tool'
          New-Item -ItemType Directory -Force -Path $bin,$tool | Out-Null

          Set-Content -LiteralPath (Join-Path $app 'Register.xml') -Value '<ROOT />' -Encoding UTF8
          Set-Content -LiteralPath (Join-Path $app 'config.xml') -Value '<ROOT><reg><regType>1</regType></reg></ROOT>' -Encoding UTF8
          @'
          <?xml version="1.0" encoding="utf-8"?>
          <configuration>
            <appSettings>
              <add key="productName" value="YX0301" />
              <add key="Service" value="http://127.0.0.1:9/Service.asmx" />
            </appSettings>
            <system.web>
              <httpRuntime targetFramework="4.5" />
              <compilation targetFramework="4.5" />
              <identity impersonate="true" />
            </system.web>
          </configuration>
          '@ | Set-Content -LiteralPath (Join-Path $app 'web.config') -Encoding UTF8

          @'
          using System;
          using System.IO;
          using System.Web;

          namespace itmcRegedit
          {
              public sealed class RegeditMain
              {
                  private readonly string product;
                  public RegeditMain(string productName) { product = productName; }

                  public string getRegNo()
                  {
                      if (!string.Equals(product, "YX0302", StringComparison.Ordinal))
                          throw new InvalidOperationException("wrong registration product: " + product);
                      if (HttpContext.Current == null || HttpContext.Current.Server == null)
                          throw new InvalidOperationException("HttpContext.Current/Server missing inside target registration component.");

                      string register = HttpContext.Current.Server.MapPath("~/Register.xml");
                      string config = HttpContext.Current.Server.MapPath("~/config.xml");
                      Console.WriteLine("[FAKE_REGEDIT] Register.xml=" + register);
                      Console.WriteLine("[FAKE_REGEDIT] config.xml=" + config);
                      if (!File.Exists(register) || !File.Exists(config))
                          throw new FileNotFoundException("target registration component did not resolve site-root files");
                      return "F000606A59904719";
                  }
              }
          }
          '@ | Set-Content -LiteralPath (Join-Path $test 'FakeRegedit.cs') -Encoding UTF8

          @'
          using System;
          using System.Reflection;

          namespace LicenseRecoverNet
          {
              internal sealed class Options
              {
                  internal string[] Args;
              }

              public static class Program
              {
                  private static object ParseArgs(string[] args)
                  {
                      return new Options { Args = args };
                  }

                  public static int RunDirect(object options)
                  {
                      if (options == null) throw new ArgumentNullException("options");
                      Console.WriteLine("FAKE_HELPER_RUN_DIRECT_OK");
                      return 0;
                  }
              }

              internal static class AppReflection
              {
                  internal static string GetRegNo(string product)
                  {
                      Assembly assembly = Assembly.Load("itmcRegedit");
                      Type type = assembly.GetType("itmcRegedit.RegeditMain", true);
                      object instance = Activator.CreateInstance(type, new object[] { product });
                      MethodInfo method = type.GetMethod("getRegNo", BindingFlags.Instance | BindingFlags.Public);
                      return (string)method.Invoke(instance, null);
                  }
              }
          }
          '@ | Set-Content -LiteralPath (Join-Path $test 'FakeHelper.cs') -Encoding UTF8

          $csc = "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          if (-not (Test-Path -LiteralPath $csc)) { $csc = "$env:WINDIR\Microsoft.NET\Framework\v4.0.30319\csc.exe" }
          if (-not (Test-Path -LiteralPath $csc)) { throw 'Full .NET Framework csc.exe not found.' }

          & $csc /nologo /target:library /r:System.Web.dll /out:$bin\itmcRegedit.dll (Join-Path $test 'FakeRegedit.cs')
          if ($LASTEXITCODE -ne 0) { throw "fake itmcRegedit compile failed: $LASTEXITCODE" }
          & $csc /nologo /target:exe /out:$tool\LicenseRecover.NET.exe (Join-Path $test 'FakeHelper.cs')
          if ($LASTEXITCODE -ne 0) { throw "fake helper compile failed: $LASTEXITCODE" }
          & $csc /nologo /target:library /r:System.Web.dll /out:$tool\LicenseRecover.NET.AspNetBridge.dll src\dotnet\LicenseRecover.AspNetBridge.cs
          if ($LASTEXITCODE -ne 0) { throw "ASP.NET bridge compile failed: $LASTEXITCODE" }
          & $csc /nologo /target:exe /r:System.Web.dll /out:$tool\LicenseRecover.NET.AspNetHost.exe src\dotnet\LicenseRecover.AspNetHost.cs
          if ($LASTEXITCODE -ne 0) { throw "ASP.NET host compile failed: $LASTEXITCODE" }

          "APP_ROOT=$app" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "APP_BIN=$bin" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "TOOL_DIR=$tool" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Run production host through real ASP.NET ApplicationManager
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $outputFile = Join-Path $env:RUNNER_TEMP 'aspnet-host-output.txt'
          $all = & "$env:TOOL_DIR\LicenseRecover.NET.AspNetHost.exe" gencode "$env:APP_BIN" --product YX0302 2>&1 | Tee-Object -FilePath $outputFile
          $exit = $LASTEXITCODE
          $text = Get-Content -LiteralPath $outputFile -Raw
          Write-Host $text
          if ($exit -ne 0) { throw "host integration failed with exit=$exit" }

          $expectedRegister = Join-Path $env:APP_ROOT 'Register.xml'
          $expectedConfig = Join-Path $env:APP_ROOT 'config.xml'
          foreach ($needle in @(
              '[ASPNET_HOST] hosted AppDomain created; appId=',
              '[ASPNET_HOST] hostingEnvironment appVirtualPath=/',
              ('[ASPNET_HOST] mapPath Register.xml=' + $expectedRegister),
              ('[ASPNET_HOST] mapPath config.xml=' + $expectedConfig),
              '[ASPNET_HOST] target request-code probe=OK; hostIdLength=16',
              '[ASPNET_HOST] helperDispatch=RunDirect/hosted-AppDomain',
              'FAKE_HELPER_RUN_DIRECT_OK'
          )) {
              if ($text.IndexOf($needle, [StringComparison]::OrdinalIgnoreCase) -lt 0) {
                  throw "missing integration marker: $needle"
              }
          }

          $stagedBridge = Join-Path $env:APP_BIN 'LicenseRecover.NET.AspNetBridge.dll'
          if (Test-Path -LiteralPath $stagedBridge) {
              throw "temporary hosted bridge was not cleaned up: $stagedBridge"
          }
          Write-Host 'REAL ASP.NET HOST WINDOWS INTEGRATION PASSED'
