name: Apply Java QT40101 startup-profile parity

on:
  push:
    branches:
      - refactor/java-native-host-v1.2.41
    paths:
      - .github/workflows/apply-java-qt401-profile-v1.2.41.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refactor/java-native-host-v1.2.41
          fetch-depth: 0
      - name: Apply QT40101 parity patch
        run: python3 .github/scripts/apply-java-qt401-profile-v1.2.41.py
      - name: Commit patch and remove one-shot files
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-java-qt401-profile-v1.2.41.yml
          rm -f .github/scripts/apply-java-qt401-profile-v1.2.41.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix: mirror QT40101 classpath-root registration startup'
          git push origin HEAD:refactor/java-native-host-v1.2.41
