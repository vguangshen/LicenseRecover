name: Finalize v1.2.42 metadata

on:
  push:
    branches: [ "feature/batch-backup-cleanup-v1.2.42" ]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/batch-backup-cleanup-v1.2.42
      - name: Update release metadata
        shell: python
        run: |
          from pathlib import Path

          readme = Path("README.md")
          text = readme.read_text(encoding="utf-8")
          text = text.replace("当前稳定版本：**v1.2.41**", "当前稳定版本：**v1.2.42**")
          marker = "## 当前界面与唯一启动入口"
          section = """## 批量备份整理\n\nv1.2.42 起，“批量应用”页增加“批量清理备份”维护功能。选择父目录后可递归扫描 LicenseRecover 自身生成的 `prewrite` / `prepatch` / `preoneclick` 和已知旧版时间戳备份，默认按每个原文件保留最近 3 份。删除前会显示匹配数量、保留数量、拟删除数量和预计释放空间，并要求再次确认；普通 `.bak`、无关时间戳备份和符号链接不会被清理。\n\n"""
          if "## 批量备份整理" not in text:
              if marker not in text:
                  raise SystemExit("README.md insertion marker missing")
              text = text.replace(marker, section + marker, 1)
          readme.write_text(text, encoding="utf-8")

          txt = Path("README.txt")
          text = txt.read_text(encoding="utf-8")
          text = text.replace("LicenseRecover v1.2.41", "LicenseRecover v1.2.42", 1)
          marker = "v1.2.41 Java target-native 一键恢复"
          section = """v1.2.42 批量备份整理\n------------------------\n- “批量应用”页新增“批量清理备份”；\n- 默认按每个原文件保留最近 3 份，可调整为 0-50 份；\n- 清理前显示匹配/保留/删除数量和预计释放空间，并要求再次确认；\n- 只处理 LicenseRecover 管理的备份命名，普通 .bak 和符号链接不会删除。\n\n"""
          if "v1.2.42 批量备份整理" not in text:
              if marker not in text:
                  raise SystemExit("README.txt insertion marker missing")
              text = text.replace(marker, section + marker, 1)
          txt.write_text(text, encoding="utf-8")

          changelog = Path("CHANGELOG.md")
          text = changelog.read_text(encoding="utf-8")
          entry = """## [1.2.42] - 2026-09-11\n\n### Added\n- “批量应用”页新增安全的批量备份清理：按所选父目录递归扫描，仅匹配 LicenseRecover 管理的 prewrite / prepatch / preoneclick 与已知旧版时间戳备份。\n- 默认按每个原文件保留最近 3 份，可配置为 0-50；删除前预览数量和预计释放空间并要求二次确认。\n- 扫描/删除拒绝符号链接，删除前重新校验根目录边界与受管理文件名；普通 .bak 和无关时间戳备份保持不变。\n\n### Regression\n- 新增 backup-cleanup self-test，覆盖跨代命名归组、保留策略、实际删除及无关文件保护。\n\n"""
          if not text.startswith("## [1.2.42]"):
              changelog.write_text(entry + text, encoding="utf-8")
      - name: Commit metadata
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain -- README.md README.txt CHANGELOG.md)" ]; then
            echo "v1.2.42 metadata already finalized."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md README.txt CHANGELOG.md
          git commit -m 'docs: finalize v1.2.42 release metadata'
          git push origin HEAD:feature/batch-backup-cleanup-v1.2.42
