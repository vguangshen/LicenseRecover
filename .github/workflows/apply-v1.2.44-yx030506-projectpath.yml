name: Apply v1.2.44 YX030506 projectPath fix

on:
  push:
    branches: [ "feature/yx030506-projectpath-v1.2.44" ]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/yx030506-projectpath-v1.2.44
      - name: Patch runtime profile and release metadata
        shell: python
        run: |
          from pathlib import Path
          p=Path('src/main/java/JavaRegistrationRuntimeProfile.java')
          s=p.read_text(encoding='utf-8')
          old='''            boolean classpathRootEvidence = projectClasspathProvider\n                    && refs.hasMethodRef("com/itmc/utils/ProjectSourcesPath", "projectPath",\n                    "(Ljava/lang/String;)Ljava/lang/String;")\n                    && refs.hasUtf8("/");'''
          new='''            boolean projectPathCall = refs.hasMethodRef("com/itmc/utils/ProjectSourcesPath", "projectPath",\n                    "(Ljava/lang/String;)Ljava/lang/String;")\n                    && refs.hasUtf8("/");\n            boolean classpathRootEvidence = projectPathCall\n                    && (projectClasspathProvider || hasProjectClasspathRootProviderFallback(classes));'''
          if old not in s: raise SystemExit('candidate pattern not found')
          s=s.replace(old,new,1)
          old2='''    private static boolean hasProjectClasspathRootProvider(File classes) {\n        if (classes == null || !classes.isDirectory()) return false;\n        File provider = new File(classes, "com" + File.separator + "itmc" + File.separator\n                + "utils" + File.separator + "ProjectSourcesPath.class");\n        if (!provider.isFile()) return false;\n        try {\n            ClassRefs refs = ClassRefs.parse(Files.readAllBytes(provider.toPath()));\n            return refs.hasUtf8("classpath:")\n                    && refs.hasMethodRef("org/springframework/util/ResourceUtils", "getURL",\n                    "(Ljava/lang/String;)Ljava/net/URL;")\n                    && refs.hasMethodRef("java/net/URL", "getPath", "()Ljava/lang/String;")\n                    && refs.hasMethodRef("java/io/File", "getAbsolutePath", "()Ljava/lang/String;");\n        } catch (Throwable ignore) {\n            return false;\n        }\n    }'''
          new2='''    private static boolean hasProjectClasspathRootProvider(File classes) {\n        if (classes == null || !classes.isDirectory()) return false;\n        File provider = new File(classes, "com" + File.separator + "itmc" + File.separator\n                + "utils" + File.separator + "ProjectSourcesPath.class");\n        if (!provider.isFile()) return false;\n        try {\n            ClassRefs refs = ClassRefs.parse(Files.readAllBytes(provider.toPath()));\n            return refs.hasUtf8("classpath:")\n                    && refs.hasMethodRef("org/springframework/util/ResourceUtils", "getURL",\n                    "(Ljava/lang/String;)Ljava/net/URL;")\n                    && refs.hasMethodRef("java/net/URL", "getPath", "()Ljava/lang/String;")\n                    && refs.hasMethodRef("java/io/File", "getAbsolutePath", "()Ljava/lang/String;");\n        } catch (Throwable ignore) {\n            return false;\n        }\n    }\n\n    /**\n     * Fallback proof for YX0305 Spring Boot generations. Some deployed class files\n     * are readable by the JVM/javap but their constant-pool shape can make the\n     * minimal parser reject the provider. Keep this fail-closed by requiring the\n     * exact ProjectSourcesPath class plus all bytecode constant strings that prove\n     * classpath: -> ResourceUtils.getURL -> URL.getPath -> File.getAbsolutePath.\n     */\n    private static boolean hasProjectClasspathRootProviderFallback(File classes) {\n        if (classes == null || !classes.isDirectory()) return false;\n        File provider = new File(classes, "com" + File.separator + "itmc" + File.separator\n                + "utils" + File.separator + "ProjectSourcesPath.class");\n        if (!provider.isFile()) return false;\n        try {\n            byte[] data = Files.readAllBytes(provider.toPath());\n            return containsAscii(data, "classpath:")\n                    && containsAscii(data, "org/springframework/util/ResourceUtils")\n                    && containsAscii(data, "getURL")\n                    && containsAscii(data, "java/net/URL")\n                    && containsAscii(data, "getPath")\n                    && containsAscii(data, "java/io/File")\n                    && containsAscii(data, "getAbsolutePath");\n        } catch (Throwable ignore) {\n            return false;\n        }\n    }\n\n    private static boolean containsAscii(byte[] data, String value) {\n        if (data == null || value == null || value.isEmpty()) return false;\n        byte[] needle = value.getBytes(StandardCharsets.UTF_8);\n        outer: for (int i = 0; i + needle.length <= data.length; i++) {\n            for (int j = 0; j < needle.length; j++) if (data[i + j] != needle[j]) continue outer;\n            return true;\n        }\n        return false;\n    }'''
          if old2 not in s: raise SystemExit('provider pattern not found')
          s=s.replace(old2,new2,1)
          p.write_text(s,encoding='utf-8')

          t=Path('src/test/java/RefactorSmokeTest.java')
          ts=t.read_text(encoding='utf-8')
          marker='System.out.println("RefactorSmokeTest: OK");'
          if marker not in ts: raise SystemExit('smoke marker missing')
          insert='''\n        String runtimeProfileSource = new String(Files.readAllBytes(new File("src/main/java/JavaRegistrationRuntimeProfile.java").toPath()), StandardCharsets.UTF_8);\n        require(runtimeProfileSource.contains("hasProjectClasspathRootProviderFallback"), "YX0305 ProjectSourcesPath fallback proof missing");\n        require(runtimeProfileSource.contains("projectPathCall"), "YX0305 ProjectSourcesPath startup-call proof missing");\n'''
          ts=ts.replace(marker,insert+'        '+marker,1)
          t.write_text(ts,encoding='utf-8')

          Path('VERSION.txt').write_text('1.2.44\n',encoding='utf-8')
          Path('release-notes/v1.2.44.md').write_text('''# LicenseRecover v1.2.44\n\n## YX030506 Java runtime-profile 修复\n\n- 修复 YX0305/YX030506 Spring Boot 产品的显式配置路径识别。\n- 目标启动链使用 `ProjectSourcesPath.projectPath("/")`，其实现通过 `ResourceUtils.getURL("classpath:")` 得到 `WEB-INF/classes`，因此三参数 `RegisterMain(product, token, path)` 的真实 path 是 `WEB-INF/classes`，不是 ServletContext WebApp Root。\n- runtime profile 仍然 fail-closed：必须同时证明启动类确实调用 `ProjectSourcesPath.projectPath("/")`，并且目标 `ProjectSourcesPath.class` 具备 `classpath: -> ResourceUtils.getURL -> URL.getPath -> File.getAbsolutePath` 的实现证据，才允许使用 classes-root。\n- 不放宽 Java 的最终成功条件；仍需 target-native DOREG 后由 fresh JVM 完成 RegisterMain 原生校验，只有 `VERIFY_FRESH: OK` 后才显示最终 `OK`。\n''',encoding='utf-8')
          for name in ['README.md','README.txt','CHANGELOG.md']:
              q=Path(name)
              if q.exists():
                  txt=q.read_text(encoding='utf-8')
                  txt=txt.replace('1.2.43','1.2.44',1)
                  q.write_text(txt,encoding='utf-8')
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/main/java/JavaRegistrationRuntimeProfile.java src/test/java/RefactorSmokeTest.java VERSION.txt README.md README.txt CHANGELOG.md release-notes/v1.2.44.md
          git commit -m "fix: mirror YX030506 ProjectSourcesPath startup path"
          git push
# trigger
