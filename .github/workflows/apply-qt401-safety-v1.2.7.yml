name: Apply QT40101 safety v1.2.7

on:
  push:
    branches: [ "feature/qt401-safety-v1.2.7" ]
    paths: [ ".github/workflows/apply-qt401-safety-v1.2.7.yml" ]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/qt401-safety-v1.2.7
      - name: Apply QT40101 and recovery eligibility patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              s = p.read_text(encoding="utf-8")
              if old not in s:
                  raise SystemExit("pattern not found in %s: %r" % (path, old[:220]))
              p.write_text(s.replace(old, new, 1), encoding="utf-8")

          path = "src/main/java/LicenseRecoverModernGUIJavaPlan.java"
          replace(path,
          '''    public final boolean rootConfigStyle;
              public final boolean packedRegistrationJar;

              private LicenseRecoverModernGUIJavaPlan(boolean detected, File appRoot, File libDir, File regJar,
                                                      String softVersionId, String generation, String authorizationFamily,
                                                      String runtimeProductId, String regStr, String configTargets,
                                                      String verificationPlan, boolean rootConfigStyle,
                                                      boolean packedRegistrationJar) {
          ''',
          '''    public final boolean rootConfigStyle;
              public final boolean packedRegistrationJar;
              /** True only when all identifiers needed for automatic write-back are confirmed. */
              public final boolean automaticRecoveryReady;
              /** Human-readable explanation shown by single-app and batch UI. */
              public final String recoveryReadiness;

              private LicenseRecoverModernGUIJavaPlan(boolean detected, File appRoot, File libDir, File regJar,
                                                      String softVersionId, String generation, String authorizationFamily,
                                                      String runtimeProductId, String regStr, String configTargets,
                                                      String verificationPlan, boolean rootConfigStyle,
                                                      boolean packedRegistrationJar, boolean automaticRecoveryReady,
                                                      String recoveryReadiness) {
          ''')
          replace(path,
          '''        this.verificationPlan = verificationPlan;
                  this.rootConfigStyle = rootConfigStyle;
                  this.packedRegistrationJar = packedRegistrationJar;
              }
          ''',
          '''        this.verificationPlan = verificationPlan;
                  this.rootConfigStyle = rootConfigStyle;
                  this.packedRegistrationJar = packedRegistrationJar;
                  this.automaticRecoveryReady = automaticRecoveryReady;
                  this.recoveryReadiness = recoveryReadiness;
              }
          ''')
          replace(path,
          '''        File dataConfig = new File(root, "data" + File.separator + "config.xml");
                  File classesConfig = new File(root, "WEB-INF" + File.separator + "classes" + File.separator + "config.xml");
                  boolean newStyle = !blank(readElement(dataConfig, "regInfo"));
                  boolean rootConfig = dataConfig.isFile() || classesConfig.isFile();

                  String upper = soft == null ? "" : soft.toUpperCase(Locale.ROOT);
                  String generation;
          ''',
          '''        File dataConfig = new File(root, "data" + File.separator + "config.xml");
                  File classesConfig = new File(root, "WEB-INF" + File.separator + "classes" + File.separator + "config.xml");
                  boolean newStyle = !blank(readElement(dataConfig, "regInfo"));
                  boolean rootConfig = dataConfig.isFile() || classesConfig.isFile();

                  String upper = soft == null ? "" : soft.toUpperCase(Locale.ROOT);
                  String confirmedClassesFamily = confirmedClassesAuthorizationFamily(root, soft);
                  String generation;
          ''')
          replace(path,
          '''        } else if (classesConfig.isFile()) {
                      if (upper.startsWith("XMT01")) generation = "XMT / classes-config";
                      else if (upper.startsWith("DS501")) generation = "DS501 / classes-config";
                      else if (upper.startsWith("YX0305")) generation = "YX0305 / classes-config";
                      else generation = "通用 / classes-config";
          ''',
          '''        } else if (classesConfig.isFile()) {
                      if ("QT401".equals(confirmedClassesFamily)) generation = "QT401 / classes-config";
                      else if (upper.startsWith("XMT01")) generation = "XMT / classes-config";
                      else if (upper.startsWith("DS501")) generation = "DS501 / classes-config";
                      else if (upper.startsWith("YX0305")) generation = "YX0305 / classes-config";
                      else generation = "通用 / classes-config";
          ''')
          replace(path,
          '''        String family = authorizationFamilyFor(soft, newStyle, classesConfig.isFile());
                  String runtimeProduct = newStyle && !blank(soft) ? soft.trim() : runtimeProductFor(soft);
                  String products = resolveRegStr(root, soft);
                  File jar = findRegJar(lib);
                  boolean packed = jar != null && isVirboxPackedJar(jar);

                  String libConfig = relative(root, new File(lib, "config.xml"));
          ''',
          '''        String family = !blank(confirmedClassesFamily)
                          ? confirmedClassesFamily : authorizationFamilyFor(soft, newStyle, classesConfig.isFile());
                  String runtimeProduct = !blank(confirmedClassesFamily)
                          ? confirmedClassesFamily : (newStyle && !blank(soft) ? soft.trim() : runtimeProductFor(soft));
                  String products = resolveRegStr(root, soft);
                  boolean ready = true;
                  String readiness = "可安全自动恢复";
                  if (blank(family) || "未确认".equals(family)) {
                      ready = false;
                      readiness = "授权族未确认";
                  } else if (blank(runtimeProduct)) {
                      ready = false;
                      readiness = "运行校验ID未确认";
                  } else if (blank(products)) {
                      ready = false;
                      readiness = "RegStr 未静态声明；需从现有授权动态恢复";
                  }
                  File jar = findRegJar(lib);
                  boolean packed = jar != null && isVirboxPackedJar(jar);

                  String libConfig = relative(root, new File(lib, "config.xml"));
          ''')
          replace(path,
          '''        return new LicenseRecoverModernGUIJavaPlan(true, root, lib, jar,
                          soft, generation, family, runtimeProduct, products, targets, verify, rootConfig, packed);
              }

              public String regStrSummary() {
                  if (blank(regStr)) return "未识别";
          ''',
          '''        return new LicenseRecoverModernGUIJavaPlan(true, root, lib, jar,
                          soft, generation, family, runtimeProduct, products, targets, verify, rootConfig, packed,
                          ready, readiness);
              }

              public String regStrSummary() {
                  if (blank(regStr)) return "未静态声明";
          ''')
          replace(path,
          '''        out.append("[java-plan] verify=").append(verificationPlan).append('\\n');
                  return out.toString();
              }
          ''',
          '''        out.append("[java-plan] verify=").append(verificationPlan).append('\\n');
                  out.append("[java-plan] automatic recovery=")
                          .append(automaticRecoveryReady ? "READY" : "BLOCKED")
                          .append(" (").append(recoveryReadiness).append(")\\n");
                  return out.toString();
              }
          ''')
          replace(path,
          '''        if (softId != null && softId.toUpperCase(Locale.ROOT).startsWith("DS501")) return softId.trim();
                  if (softId != null && softId.toUpperCase(Locale.ROOT).matches("DS28\\\\d{2}")) return softId.trim();
                  if ("YT00129".equalsIgnoreCase(softId)) return "QT0420";
                  return FALLBACK_ALL_NUMS;
              }

              static String authorizationFamilyFor(String softId, boolean newStyle, boolean classesStyle) {
          ''',
          '''        if (softId != null && softId.toUpperCase(Locale.ROOT).startsWith("DS501")) return softId.trim();
                  if (softId != null && softId.toUpperCase(Locale.ROOT).matches("DS28\\\\d{2}")) return softId.trim();
                  if ("YT00129".equalsIgnoreCase(softId)) return "QT0420";
                  if (new File(root, "WEB-INF" + File.separator + "classes" + File.separator + "config.xml").isFile())
                      return null;
                  return FALLBACK_ALL_NUMS;
              }

              static String confirmedClassesAuthorizationFamily(File root, String softId) {
                  if (root == null || blank(softId)) return null;
                  String id = softId.toUpperCase(Locale.ROOT);
                  if (id.matches("QT401\\\\d{2}")) {
                      File config1 = new File(root, "WEB-INF" + File.separator + "classes"
                              + File.separator + "config1.xml");
                      String family = readElement(config1, "SoftVersionID");
                      if ("QT401".equalsIgnoreCase(family)) return "QT401";
                  }
                  return null;
              }

              static String authorizationFamilyFor(String softId, boolean newStyle, boolean classesStyle) {
          ''')
          replace(path,
          '''        return new LicenseRecoverModernGUIJavaPlan(false, null, null, null,
                          null, "未识别", null, null, null, "—", "—", false, false);
          ''',
          '''        return new LicenseRecoverModernGUIJavaPlan(false, null, null, null,
                          null, "未识别", null, null, null, "—", "—", false, false,
                          false, "未识别");
          ''')

          path = "src/main/java/LicenseRecoverModernGUIAutoRecovery.java"
          replace(path,
          '''        LicenseRecoverModernGUIJavaPlan plan = LicenseRecoverModernGUIJavaPlan.inspect(d.appRoot);
                  if (plan.detected) log.accept(plan.logSummary());
                  File cli=new File(toolDir(),"LicenseRecover.jar");
          ''',
          '''        LicenseRecoverModernGUIJavaPlan plan = LicenseRecoverModernGUIJavaPlan.inspect(d.appRoot);
                  if (plan.detected) log.accept(plan.logSummary());
                  if (plan.detected && !plan.automaticRecoveryReady) {
                      return Result.fail("自动恢复已阻止：" + plan.recoveryReadiness + "。未修改任何文件。", d);
                  }
                  File cli=new File(toolDir(),"LicenseRecover.jar");
          ''')

          path = "src/main/java/LicenseRecoverModernGUIUiPatchLauncher.java"
          replace(path,
          '''            jar.setText(plan.registrationJarSummary());
                      verify.setText("待执行: " + plan.verificationPlan);
          ''',
          '''            jar.setText(plan.registrationJarSummary());
                      verify.setText(plan.automaticRecoveryReady
                              ? "待执行: " + plan.verificationPlan
                              : "禁止自动写入: " + plan.recoveryReadiness);
          ''')

          path = "src/main/java/LicenseRecoverModernGUI.java"
          replace(path,
          '''                    batchModel.addRow(new Object[]{child.getName(),
                                      plan.detected ? "Java / " + plan.generation : "Java",
                                      valueOrDash(plan.softVersionId), valueOrDash(plan.authorizationFamily),
                                      valueOrDash(plan.runtimeProductId), plan.regStrSummary(), plan.configTargets,
                                      plan.detected ? "待执行: RegisterMain" : "待识别", "待处理",
                                      info.appRoot.getAbsolutePath()});
          ''',
          '''                    String verifyText = !plan.detected ? "待识别"
                                      : (plan.automaticRecoveryReady ? "待执行: RegisterMain"
                                      : "未执行: " + plan.recoveryReadiness);
                              String statusText = !plan.detected ? "待识别"
                                      : (plan.automaticRecoveryReady ? "待处理" : "待确认");
                              batchModel.addRow(new Object[]{child.getName(),
                                      plan.detected ? "Java / " + plan.generation : "Java",
                                      valueOrDash(plan.softVersionId), valueOrDash(plan.authorizationFamily),
                                      valueOrDash(plan.runtimeProductId), plan.regStrSummary(), plan.configTargets,
                                      verifyText, statusText, info.appRoot.getAbsolutePath()});
          ''')
          replace(path,
          '''                    if (target.type == BatchTarget.Type.NONE) {
                                  done++;
                                  updateBatchProgress(done, "跳过 " + target.name);
                                  continue;
                              }
                              SwingUtilities.invokeLater(() -> {
          ''',
          '''                    if (target.type == BatchTarget.Type.NONE) {
                                  done++;
                                  updateBatchProgress(done, "跳过 " + target.name);
                                  continue;
                              }
                              if (!usePatch) {
                                  final String blockReason = recommendedBatchBlockReason(target);
                                  if (blockReason != null) {
                                      SwingUtilities.invokeLater(() -> {
                                          batchModel.setValueAt("未执行: " + blockReason, currentRow, BATCH_COL_VERIFY);
                                          batchModel.setValueAt("跳过: 待确认", currentRow, BATCH_COL_STATUS);
                                      });
                                      appendLog("[batch] " + target.name + " 自动跳过：" + blockReason + "\\n");
                                      done++;
                                      updateBatchProgress(done, "跳过 " + target.name);
                                      continue;
                                  }
                              }
                              SwingUtilities.invokeLater(() -> {
          ''')
          replace(path,
          '''    private OperationResult runBatchRecommended(BatchTarget target, boolean backup, boolean blockNet, boolean preview) {
          ''',
          '''    private String recommendedBatchBlockReason(BatchTarget target) {
                  if (target == null || target.type == BatchTarget.Type.NONE) return "未识别";
                  if (target.type == BatchTarget.Type.JAVA) {
                      LicenseRecoverModernGUIJavaPlan plan = LicenseRecoverModernGUIJavaPlan.inspect(target.appRoot);
                      return plan.detected && plan.automaticRecoveryReady ? null
                              : (plan.detected ? plan.recoveryReadiness : "Java 授权计划未识别");
                  }
                  LicenseRecoverModernGUIAutoRecovery.Detection d =
                          LicenseRecoverModernGUIAutoRecovery.detect(target.binDir);
                  if (d.kind == LicenseRecoverModernGUIAutoRecovery.Kind.DOTNET_MODERN
                          && (d.productName == null || d.productName.trim().isEmpty()))
                      return ".NET 授权产品号未确认";
                  return null;
              }

              private OperationResult runBatchRecommended(BatchTarget target, boolean backup, boolean blockNet, boolean preview) {
          ''')

          path = "src/main/java/LicenseRecover.java"
          replace(path,
          '''        info.setNet(false);            // 不要求联网
                  info.setCountDay(0);
                  info.setRegStr(resolveJavaRegStr(appRoot, softId));
                  Calendar begin = Calendar.getInstance();
          ''',
          '''        info.setNet(false);            // 不要求联网
                  info.setCountDay(0);
                  String resolvedRegStr = resolveJavaRegStr(appRoot, softId);
                  if (resolvedRegStr == null || resolvedRegStr.trim().isEmpty()) {
                      System.err.println("自动恢复已阻止：当前 classes-config 应用没有静态 regInfo，RegStr 未确认。");
                      System.err.println("不会使用 44 项通用列表猜测授权项，也不会修改任何配置文件。");
                      System.out.println("RESULT: FAILED");
                      return 2;
                  }
                  info.setRegStr(resolvedRegStr);
                  Calendar begin = Calendar.getInstance();
          ''')
          replace(path,
          '''        if (softId != null && softId.toUpperCase(java.util.Locale.ROOT).startsWith("DS501")) return softId.trim();
                  if (softId != null && softId.toUpperCase(java.util.Locale.ROOT).matches("DS28\\\\d{2}")) return softId.trim();
                  if ("YT00129".equalsIgnoreCase(softId)) return "QT0420";
                  return ALL_NUMS;
          ''',
          '''        if (softId != null && softId.toUpperCase(java.util.Locale.ROOT).startsWith("DS501")) return softId.trim();
                  if (softId != null && softId.toUpperCase(java.util.Locale.ROOT).matches("DS28\\\\d{2}")) return softId.trim();
                  if ("YT00129".equalsIgnoreCase(softId)) return "QT0420";
                  if (new File(root, "WEB-INF" + File.separator + "classes" + File.separator + "config.xml").isFile())
                      return null;
                  return ALL_NUMS;
          ''')
          replace(path,
          '''    static String productMainFor(String softId) {
                  if (softId != null && softId.toUpperCase(java.util.Locale.ROOT).startsWith("DS501")) return softId.trim();
          ''',
          '''    static String productMainFor(String softId) {
                  if (softId != null && softId.toUpperCase(java.util.Locale.ROOT).matches("QT401\\\\d{2}")) return "QT401";
                  if (softId != null && softId.toUpperCase(java.util.Locale.ROOT).startsWith("DS501")) return softId.trim();
          ''')
          replace(path,
          '''        if (id.startsWith("DS501")) return "DS501";
                  if (id.startsWith("YX0305")) return "YX0305";
                  if ("DS2601".equals(id)) return "DS26";
          ''',
          '''        if (id.matches("QT401\\\\d{2}")) return "QT401";
                  if (id.startsWith("DS501")) return "DS501";
                  if (id.startsWith("YX0305")) return "YX0305";
                  if ("DS2601".equals(id)) return "DS26";
          ''')

          path = "src/test/java/RefactorSmokeTest.java"
          anchor = '''        check("YX030506".equals(yx305Plan.runtimeProductId)
                                  && "QT100101,QT100102".equals(yx305Plan.regStr),
                          "Java GUI plan separates YX0305 family, runtime id and feature RegStr");

          '''
          insert = anchor + '''        Path qt401Root = base.resolve("java-QT40101");
                  Path qt401Lib = qt401Root.resolve("WEB-INF/lib");
                  Path qt401Classes = qt401Root.resolve("WEB-INF/classes");
                  Files.createDirectories(qt401Lib);
                  Files.createDirectories(qt401Classes);
                  Files.write(qt401Lib.resolve("ITMCReg-1.0.5.jar"), new byte[]{1});
                  Files.write(qt401Root.resolve("systemConfig.yml"), Arrays.asList(
                          "global.system.VersionID=QT40101",
                          "global.system.VersionName=paas管理平台"), StandardCharsets.UTF_8);
                  Files.write(qt401Classes.resolve("config.xml"), Arrays.asList(
                          "<ROOT><SystemSoft><SoftVersionID>QT40101</SoftVersionID></SystemSoft></ROOT>"),
                          StandardCharsets.UTF_8);
                  Files.write(qt401Classes.resolve("config1.xml"), Arrays.asList(
                          "<ROOT><SystemSoft><SoftVersionID>QT401</SoftVersionID></SystemSoft>"
                                  + "<System id=\\\"QT40101\\\"><SoftName>paas管理平台</SoftName></System></ROOT>"),
                          StandardCharsets.UTF_8);
                  check("QT401".equals(LicenseRecover.productMainFor("QT40101")),
                          "QT40101 direct runtime family maps to QT401");
                  check("QT401".equals(LicenseRecover.localRegisterProductFor("QT40101", false)),
                          "QT40101 local family maps to QT401");
                  check(LicenseRecover.resolveJavaRegStr(qt401Root.toString(), "QT40101") == null,
                          "QT40101 does not inherit the 44-item fallback when regInfo is absent");
                  LicenseRecoverModernGUIJavaPlan qt401Plan =
                          LicenseRecoverModernGUIJavaPlan.inspect(qt401Root.toFile());
                  check(qt401Plan.generation.contains("QT401")
                                  && "QT401".equals(qt401Plan.authorizationFamily)
                                  && "QT401".equals(qt401Plan.runtimeProductId),
                          "Java GUI plan confirms QT401 family from config1.xml evidence");
                  check(qt401Plan.regStr == null && !qt401Plan.automaticRecoveryReady
                                  && qt401Plan.recoveryReadiness.contains("RegStr"),
                          "QT401 automatic recovery is blocked until dynamic RegStr can be recovered");

                  Path genericClassesRoot = base.resolve("java-generic-classes");
                  Path genericClassesLib = genericClassesRoot.resolve("WEB-INF/lib");
                  Path genericClassesCfg = genericClassesRoot.resolve("WEB-INF/classes");
                  Files.createDirectories(genericClassesLib);
                  Files.createDirectories(genericClassesCfg);
                  Files.write(genericClassesLib.resolve("ITMCReg.jar"), new byte[]{1});
                  Files.write(genericClassesCfg.resolve("config.xml"), Arrays.asList(
                          "<ROOT><SystemSoft><SoftVersionID>ZZ99999</SoftVersionID></SystemSoft></ROOT>"),
                          StandardCharsets.UTF_8);
                  LicenseRecoverModernGUIJavaPlan genericClassesPlan =
                          LicenseRecoverModernGUIJavaPlan.inspect(genericClassesRoot.toFile());
                  check("未确认".equals(genericClassesPlan.authorizationFamily)
                                  && genericClassesPlan.regStr == null
                                  && !genericClassesPlan.automaticRecoveryReady,
                          "unknown classes-config apps stay blocked instead of receiving catch-all RegStr");

          '''
          replace(path, anchor, insert)

          Path("VERSION.txt").write_text("1.2.7\n", encoding="utf-8")

          p = Path("README.md")
          s = p.read_text(encoding="utf-8")
          s = s.replace("当前稳定版本：**v1.2.6**", "当前稳定版本：**v1.2.7**", 1)
          marker = "## 安全边界\n"
          block = '''## v1.2.7 QT40101 与执行资格保护

          - 根据 QT40101 实际 `systemConfig.yml`、`WEB-INF/classes/config.xml`、`config1.xml` 与业务代码证据，将其识别为 `SoftVersionID=QT40101`、授权族/运行校验ID=`QT401`。
          - QT40101 的配置没有静态 `regInfo`；应用启动后通过 `RegisterMain("QT401").getRegInfo().getRegStr()` 读取授权项，因此本工具不会再显示或写入旧的 44 项通用 fallback。
          - Java `classes-config` 在授权族或 RegStr 未确认时标记为“待确认”，一键恢复和批量推荐操作都会在写文件前自动阻止/跳过。
          - 同样保留 .NET Modern 的产品号安全门：产品号未确认时不会执行自动写回。
          - 方式三是独立高级操作，不依赖本地授权重建所需的 RegStr，因此不受上述推荐操作资格判断影响。

          '''
          if marker not in s:
              raise SystemExit("README safety marker missing")
          p.write_text(s.replace(marker, block + marker, 1), encoding="utf-8")

          p = Path("README.txt")
          s = p.read_text(encoding="utf-8")
          s = s.replace("LicenseRecover v1.2.6", "LicenseRecover v1.2.7", 1)
          marker = "软件自动更新\n------------\n"
          block = '''v1.2.7 QT40101 与执行资格保护
          -------------------------------
          - QT40101：具体版本 QT40101，授权族 / 运行校验ID 为 QT401；
          - QT40101 未静态声明 RegStr，不再回退到 44 项通用列表；
          - 授权族或 RegStr 未确认的 Java classes-config 项目显示“待确认”，推荐一键恢复与批量执行会自动阻止/跳过，确保不猜测写入；
          - .NET Modern 产品号未确认时同样不会自动写回。

          '''
          if marker not in s:
              raise SystemExit("README.txt update marker missing")
          p.write_text(s.replace(marker, block + marker, 1), encoding="utf-8")

          p = Path("CHANGELOG.md")
          s = p.read_text(encoding="utf-8")
          anchor = "All notable user-visible and engineering changes are tracked here from the first stable release onward.\n\n"
          entry = '''## [1.2.7] - 2026-09-07

          ### Fixed

          - 根据 QT40101 实际样本确认 `QT40101 → QT401` 授权族/运行校验ID，不再显示 `QT1001`。
          - QT40101 及其它没有显式 `regInfo` 的未确认 classes-config 项目不再继承 44 项通用 RegStr fallback。
          - 核心 Java CLI 在 RegStr 未确认时会在任何写入前失败，避免绕过 GUI 后误写。

          ### Changed

          - Java 授权计划新增自动恢复执行资格与原因；单应用界面直接显示“禁止自动写入”原因。
          - 批量扫描将信息不足的项目标为“待确认”；推荐批量一键恢复会自动跳过这些项目。
          - .NET Modern 产品号未确认时也纳入推荐批量执行保护。
          - 方式三保持独立高级操作，不受 RegStr 执行资格判断影响。

          ### Tests

          - 新增 QT40101 `systemConfig.yml + config.xml + config1.xml` fixture，验证 `QT401` 识别、动态 RegStr 和自动恢复阻止。
          - 新增未知 classes-config fixture，验证不会再得到 44 项 fallback。

          '''
          if anchor not in s:
              raise SystemExit("CHANGELOG anchor missing")
          p.write_text(s.replace(anchor, anchor + entry, 1), encoding="utf-8")

          Path("release-notes/v1.2.7.md").write_text('''# LicenseRecover v1.2.7

          本版本根据实际 QT40101 平台补齐 QT401 授权族识别，并加入“识别成功不等于可安全写入”的执行资格保护层。

          ## QT40101

          实机样本显示：

          - `systemConfig.yml`: `global.system.VersionID=QT40101`
          - `WEB-INF/classes/config.xml`: `SoftVersionID=QT40101`
          - `WEB-INF/classes/config1.xml`: `SoftVersionID=QT401`
          - 应用授权初始化使用 `RegisterMain("QT401")`
          - 配置中没有静态 `regInfo`；授权项由现有 `RegisterMain.getRegInfo().getRegStr()` 动态读取

          因此 v1.2.7 显示：

          - 类型/授权代际：`Java / QT401 / classes-config`
          - SoftVersionID：`QT40101`
          - 授权族：`QT401`
          - 运行校验ID：`QT401`
          - RegStr：`未静态声明`
          - 状态：`待确认`

          ## 安全执行资格

