name: Retry QT40101 safety v1.2.7

on:
  push:
    branches: [ "feature/qt401-safety-v1.2.7" ]
    paths: [ ".github/workflows/retry-qt401-safety-v1.2.7.yml" ]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/qt401-safety-v1.2.7
      - name: Reuse patch with corrected README marker
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          wf = Path('.github/workflows/apply-qt401-safety-v1.2.7.yml')
          text = wf.read_text(encoding='utf-8')
          text = text.replace('marker = "## 安全边界\\n"', 'marker = "## 安全保护\\n"')
          start_marker = "          from pathlib import Path\n"
          end_marker = "\n          PY\n"
          start = text.index(start_marker)
          end = text.index(end_marker, start)
          body = text[start:end]
          lines = []
          for line in body.splitlines():
              lines.append(line[10:] if line.startswith('          ') else line)
          script = '\n'.join(lines) + '\n'
          exec(compile(script, 'qt401-v1.2.7-patch.py', 'exec'), {})
          retry = Path('.github/workflows/retry-qt401-safety-v1.2.7.yml')
          if retry.exists(): retry.unlink()
          PY
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "v1.2.7：识别 QT40101 并加入执行资格保护"
          git push origin HEAD:feature/qt401-safety-v1.2.7
