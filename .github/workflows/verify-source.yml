name: Verify source

on:
  push:
    branches: [ main, "refactor/**" ]
  pull_request:

jobs:
  compile-java:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '8'
      - name: Compile, test and assemble verified distribution
        shell: pwsh
        run: ./scripts/verify.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: LicenseRecover-test
          path: build/LicenseRecover-test.zip
          if-no-files-found: error
      - name: Sync verified overlay to refactor branch
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/refactor/')
        shell: bash
        run: |
          set -euo pipefail
          cp build/LicenseRecoverOverlay.jar LicenseRecoverOverlay.jar
          if [ -z "$(git status --porcelain -- LicenseRecoverOverlay.jar)" ]; then
            echo 'Overlay already matches verified build.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add LicenseRecoverOverlay.jar
          git commit -m '同步CI验证的运行时overlay'
          git push origin "HEAD:${GITHUB_REF_NAME}"
