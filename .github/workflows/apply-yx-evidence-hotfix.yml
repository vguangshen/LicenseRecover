name: Apply YX target-directory evidence hotfix

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/apply-yx-evidence-hotfix.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply YX evidence patch
        run: python3 scripts/apply-yx-evidence-hotfix.py
      - name: Validate patch scope
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          changed="$(git diff --name-only | sort)"
          test "$changed" = $'src/main/java/LicenseRecoverModernGUI.java\nsrc/main/java/LicenseRecoverModernGUIAutoRecovery.java\nsrc/main/java/LicenseRecoverModernGUIJavaPlan.java\nsrc/test/java/RefactorSmokeTest.java'
          grep -q 'detectDotNetRegStr' src/main/java/LicenseRecoverModernGUIAutoRecovery.java
          grep -q 'confirmedProductAllNumRuntimeProduct' src/main/java/LicenseRecoverModernGUIJavaPlan.java
          grep -q 'YX0102 recovers RegStr from target-local regName' src/test/java/RefactorSmokeTest.java
          grep -q 'YX030506 runtime id is accepted only from target config->PRODUCT_ALL_NUM->RegisterMain flow' src/test/java/RefactorSmokeTest.java
      - name: Commit hotfix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main/java/LicenseRecoverModernGUI.java \
                  src/main/java/LicenseRecoverModernGUIAutoRecovery.java \
                  src/main/java/LicenseRecoverModernGUIJavaPlan.java \
                  src/test/java/RefactorSmokeTest.java
          git commit -m 'fix: 补齐YX0102与YX030506目录注册证据'
          git push origin HEAD:main
