name: Apply v1.2.40 chain parity v3

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/apply-v1.2.40-uppercase-preferred-v3.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Apply v1.2.40
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          def rd(p): return Path(p).read_text(encoding='utf-8')
          def wr(p,s): Path(p).write_text(s,encoding='utf-8',newline='\n')
          def one(s,old,new,label):
              n=s.count(old)
              if n!=1: raise SystemExit(f'{label}: expected 1 match, found {n}')
              return s.replace(old,new,1)
          def rex(s,pat,new,label):
              out,n=re.subn(pat,new,s,count=1,flags=re.S)
              if n!=1: raise SystemExit(f'{label}: expected 1 match, found {n}')
              return out

          if rd('VERSION.txt').strip()!='1.2.39': raise SystemExit('expected v1.2.39 base')

          # Coordinator: modern uppercase registration is authoritative when both generations exist.
          p='src/main/java/LicenseRecoverModernGUIAutoRecovery.java'; s=rd(p)
          s=rex(s,
              r'    static File selectDotNetRegeditAssembly\(File runtimeDir\) \{\s*File lower = findExactChild\(runtimeDir, "itmcRegedit\.dll"\);\s*if \(lower != null\) return lower;\s*return findExactChild\(runtimeDir, "ITMC\.Regedit\.dll"\);\s*\}',
              '''    static File selectDotNetRegeditAssembly(File runtimeDir) {
              // Target ITMC.Web checks the modern uppercase registration generation first.
              File upper = findExactChild(runtimeDir, "ITMC.Regedit.dll");
              if (upper != null) return upper;
              return findExactChild(runtimeDir, "itmcRegedit.dll");
          }''','coordinator chain selection')
          s=one(s,'[dotnet-chain] lowercase itmcRegedit.dll preferred via ASP.NET host; appProduct=',
                  '[dotnet-chain] uppercase ITMC.Regedit.dll absent; lowercase itmcRegedit.dll compatibility fallback via ASP.NET host; appProduct=','lowercase log')
          s=one(s,'[dotnet-chain] lowercase itmcRegedit.dll absent; uppercase ITMC.Regedit.dll fallback via hosted AppDomain; product=',
                  '[dotnet-chain] uppercase ITMC.Regedit.dll preferred via hosted AppDomain; product=','uppercase log')

          anchor='    static String recoverDotNetLocalRegStr(File root, File runtimeDir, String product) {'
          helper='''    static String recoverDotNetLocalRegStrFromConfig(File cfg, String product) {
              if (blank(product) || cfg == null || !cfg.isFile()) return null;
              try {
                  String encrypted = firstElement(readUtf8(cfg), "regName");
                  if (blank(encrypted)) return null;
                  String plain = desDecryptHex(encrypted.trim(), "*ITMC" + product.trim() + "OK*");
                  int begin = plain.indexOf('{'), end = plain.lastIndexOf('}');
                  if (begin < 0 || end <= begin) return null;
                  String json = plain.substring(begin, end + 1);
                  String embeddedProduct = jsonStringField(json, "ProName");
                  String regStr = normalizeProductCsv(jsonStringField(json, "RegStr"));
                  return product.trim().equalsIgnoreCase(embeddedProduct) && !blank(regStr) ? regStr : null;
              } catch (Throwable ignore) {
                  return null;
              }
          }

          '''+anchor
          s=one(s,anchor,helper,'root RegStr reader')
          old='''            log.accept("[dotnet-stage] VERIFY: OK\\n");

                      if (blockNet) {'''
          new='''            log.accept("[dotnet-stage] VERIFY: OK\\n");

                      // Native validity alone is insufficient for the modern chain: the web UI
                      // consumes RegInfo.RegStr. Verify the exact site-root record IIS will read.
                      if (!lowercaseChain) {
                          File siteConfig = new File(d.appRoot, "config.xml");
                          String persistedRegStr = recoverDotNetLocalRegStrFromConfig(siteConfig, appProduct);
                          if (blank(persistedRegStr))
                              throw new IOException("[MODE_VERIFY] uppercase CheckReInfo passed, but site-root config.xml has no readable modern RegStr for ProName=" + appProduct);
                          if (!blank(d.versionId) && !containsRegStrToken(persistedRegStr, d.versionId))
                              throw new IOException("[MODE_VERIFY] site-root persisted RegStr does not contain current SoftVersionID=" + d.versionId + "; RegStr=" + persistedRegStr);
                          log.accept("[dotnet-mode-verify] persisted root RegStr=" + persistedRegStr + "\\n");
                      }

                      if (blockNet) {'''
          s=one(s,old,new,'post-write mode verification'); wr(p,s)

          # Hosted helper and bridge must select/preload the same generation.
          p='src/dotnet/LicenseRecover.AspNetHost.cs'; s=rd(p)
          s=rex(s,
              r'        if \(File\.Exists\(lower\)\)\s*\{\s*chain = "lowercase-itmcRegedit";\s*helper = Path\.Combine\(toolDir, "LicenseRecover\.NET\.exe"\);\s*\}\s*else if \(File\.Exists\(upper\)\)\s*\{\s*chain = "uppercase-ITMC\.Regedit";\s*helper = Path\.Combine\(toolDir, "LicenseRecover\.NET\.Modern\.exe"\);\s*\}',
              '''        if (File.Exists(upper))
                  {
                      chain = "uppercase-ITMC.Regedit";
                      helper = Path.Combine(toolDir, "LicenseRecover.NET.Modern.exe");
                  }
                  else if (File.Exists(lower))
                  {
                      chain = "lowercase-itmcRegedit";
                      helper = Path.Combine(toolDir, "LicenseRecover.NET.exe");
                  }''','host selection'); wr(p,s)

          p='src/dotnet/LicenseRecover.AspNetBridge.cs'; s=rd(p)
          s=rex(s,
              r'        if \(File\.Exists\(lower\)\)\s*\{\s*target = lower;\s*chain = "lowercase-itmcRegedit";\s*\}\s*else if \(File\.Exists\(upper\)\)\s*\{\s*target = upper;\s*chain = "uppercase-ITMC\.Regedit";\s*\}',
              '''        if (File.Exists(upper))
                  {
                      target = upper;
                      chain = "uppercase-ITMC.Regedit";
                  }
                  else if (File.Exists(lower))
                  {
                      target = lower;
                      chain = "lowercase-itmcRegedit";
                  }''','bridge selection'); wr(p,s)

          # Java regressions: dual deployment is uppercase-first, lowercase remains fallback.
          p='src/test/java/RefactorSmokeTest.java'; s=rd(p)
          s=one(s,'"itmcRegedit.dll".equals(LicenseRecoverModernGUIAutoRecovery.selectDotNetRegeditAssembly(\n                        chainBin.toFile()).getName()),\n                ".NET registration chain prefers lowercase itmcRegedit.dll when both assemblies exist"',
                  '"ITMC.Regedit.dll".equals(LicenseRecoverModernGUIAutoRecovery.selectDotNetRegeditAssembly(\n                        chainBin.toFile()).getName()),\n                ".NET registration chain prefers uppercase ITMC.Regedit.dll when both assemblies exist"','chain test first')
          s=one(s,'Files.delete(chainBin.resolve("itmcRegedit.dll"));','Files.delete(chainBin.resolve("ITMC.Regedit.dll"));','chain test delete')
          s=one(s,'"ITMC.Regedit.dll".equals(LicenseRecoverModernGUIAutoRecovery.selectDotNetRegeditAssembly(\n                        chainBin.toFile()).getName()),\n                ".NET registration chain falls back to uppercase ITMC.Regedit.dll only when lowercase is absent"',
                  '"itmcRegedit.dll".equals(LicenseRecoverModernGUIAutoRecovery.selectDotNetRegeditAssembly(\n                        chainBin.toFile()).getName()),\n                ".NET registration chain falls back to lowercase itmcRegedit.dll only when uppercase is absent"','chain test fallback')

          marker='                ".NET final RegStr explicitly contains the current system version mode");'
          extra=marker+'''

                  Path persistedModeConfig = base.resolve("persisted-modern-root-config.xml");
                  String persistedModeJson = "{\\\"RegStr\\\":\\\"YX030101,YX030102\\\",\\\"ProName\\\":\\\"YX0301\\\"}";
                  String persistedModeCipher = LicenseRecoverModernGUIAutoRecovery.desEncryptHex(
                          "12345678" + persistedModeJson, "*ITMCYX0301OK*");
                  Files.write(persistedModeConfig, Arrays.asList(
                          "<ROOT><reg><regType>1</regType><regName>" + persistedModeCipher + "</regName></reg></ROOT>"),
                          StandardCharsets.UTF_8);
                  check("YX030101,YX030102".equals(
                                  LicenseRecoverModernGUIAutoRecovery.recoverDotNetLocalRegStrFromConfig(
                                          persistedModeConfig.toFile(), "YX0301")),
                          ".NET mode verifier reads persisted RegStr from exact site-root modern config");
                  check(LicenseRecoverModernGUIAutoRecovery.recoverDotNetLocalRegStrFromConfig(
                                  persistedModeConfig.toFile(), "YX0302") == null,
                          ".NET mode verifier rejects persisted RegStr with wrong ProName");'''
          s=one(s,marker,extra,'persisted mode test insertion'); wr(p,s)

          # CI source guards.
          p='scripts/verify.ps1'; s=rd(p)
          s=one(s,".NET one-click must use the ASP.NET host for lowercase chain plus uppercase fallback adapter.",
                  ".NET one-click must use the ASP.NET host with uppercase modern and lowercase compatibility helpers.",'guard wording')
          old="if (-not $autoSource.Contains('selectDotNetRegeditAssembly') -or -not $autoSource.Contains('detectLowercaseDotNetRegistrationProduct')) { throw '.NET target-owned lowercase-first registration-chain policy is missing.' }"
          new='''if (-not $autoSource.Contains('selectDotNetRegeditAssembly') -or -not $autoSource.Contains('detectLowercaseDotNetRegistrationProduct')) { throw '.NET registration-chain selection or lowercase compatibility-family probe is missing.' }
          $autoUpperAt = $autoSource.IndexOf('File upper = findExactChild(runtimeDir, "ITMC.Regedit.dll");')
          $autoLowerAt = $autoSource.IndexOf('return findExactChild(runtimeDir, "itmcRegedit.dll");')
          if ($autoUpperAt -lt 0 -or $autoLowerAt -lt 0 -or $autoUpperAt -gt $autoLowerAt) { throw '.NET coordinator is not uppercase-first.' }
          $hostUpperAt = $aspHostSourceText.IndexOf('if (File.Exists(upper))')
          $hostLowerAt = $aspHostSourceText.IndexOf('else if (File.Exists(lower))')
          if ($hostUpperAt -lt 0 -or $hostLowerAt -lt 0 -or $hostUpperAt -gt $hostLowerAt) { throw 'ASP.NET host is not uppercase-first.' }
          $bridgeUpperAt = $aspBridgeSourceText.IndexOf('if (File.Exists(upper))')
          $bridgeLowerAt = $aspBridgeSourceText.IndexOf('else if (File.Exists(lower))')
          if ($bridgeUpperAt -lt 0 -or $bridgeLowerAt -lt 0 -or $bridgeUpperAt -gt $bridgeLowerAt) { throw 'ASP.NET bridge is not uppercase-first.' }
          if (-not $autoSource.Contains('[dotnet-mode-verify] persisted root RegStr=')) { throw '.NET site-root persisted RegStr verification is missing.' }'''
          s=one(s,old,new,'uppercase-first source guard'); wr(p,s)

          # Windows integration test: execute on main and include a lowercase decoy.
          p='.github/workflows/uppercase-host-windows-integration-v2.yml'; s=rd(p)
          s=one(s,'    branches: [ "fix/v1.2.38-uppercase-host" ]','    branches: [ main, "fix/v1.2.38-uppercase-host" ]','windows main trigger')
          s=one(s,'      - name: Build uppercase-only fixture and host','      - name: Build dual-assembly fixture and host','windows fixture name')
          marker='          if ($LASTEXITCODE -ne 0) { throw "fixture compile failed: $LASTEXITCODE" }'
          decoy=marker+'''

                    @'
                    using System;
                    namespace itmcRegedit
                    {
                        public sealed class RegeditMain
                        {
                            public RegeditMain(string productName, string encryptedCheck)
                            {
                                throw new InvalidOperationException("LOWERCASE DECOY MUST NOT BE SELECTED");
                            }
                        }
                    }
                    '@ | Set-Content -LiteralPath (Join-Path $test 'FakeLowerRegedit.cs') -Encoding UTF8
                    & $csc /nologo /target:library /out:$bin\\itmcRegedit.dll (Join-Path $test 'FakeLowerRegedit.cs')
                    if ($LASTEXITCODE -ne 0) { throw "lowercase decoy fixture compile failed: $LASTEXITCODE" }'''
          s=one(s,marker,decoy,'lowercase decoy')
          marker="            if ($text.IndexOf($needle,[StringComparison]::OrdinalIgnoreCase) -lt 0) { throw \"missing marker: $needle\" }\n          }"
          assertion=marker+"\n          if ($text.IndexOf('target registration chain=lowercase-itmcRegedit',[StringComparison]::OrdinalIgnoreCase) -ge 0) { throw 'lowercase decoy stole chain selection' }"
          s=one(s,marker,assertion,'decoy assertion')
          s=s.replace('UPPERCASE HOSTED CHAIN V2 PASSED','DUAL-ASSEMBLY UPPERCASE-PREFERRED HOSTED CHAIN PASSED')
          wr(p,s)

          # Version metadata and docs.
          wr('VERSION.txt','1.2.40\n')
          p='README.md'; s=rd(p)
          s=one(s,'当前稳定版本：**v1.2.39**','当前稳定版本：**v1.2.40**','README version')
          anchor='避免本地授权写入成功但当前系统代号未进入 `RegStr`，最终出现“系统不支持任何模式”。'
          note=' v1.2.40 起，双注册组件部署改为大写 `ITMC.Regedit.dll` 现代链优先，并在现代链成功后验证站点根 `config.xml` 中实际持久化的 `RegStr` 包含当前 `SoftVersionID`。'
          s=one(s,anchor,anchor+note,'README note'); wr(p,s)

          p='README.txt'; s=rd(p)
          if s.startswith('LicenseRecover v1.2.39'): s=s.replace('LicenseRecover v1.2.39','LicenseRecover v1.2.40',1)
          anchor='软件自动更新\n------------\n'
          section='''v1.2.40 .NET 注册链一致性修复
          ----------------------------
          - 双注册 DLL 同时存在时优先 ITMC.Regedit.dll 现代链；
          - itmcRegedit.dll 仅在大写组件缺失时回退；
          - Host、Bridge、Java 协调器统一选择顺序；
          - 现代链结束后验证站点根 config.xml 的持久化 RegStr 包含当前 SoftVersionID。

          '''
          section='\n'.join(x[10:] if x.startswith('          ') else x for x in section.splitlines())+'\n'
          s=one(s,anchor,section+anchor,'README.txt note'); wr(p,s)

          p='CHANGELOG.md'; s=rd(p)
          entry='''## [1.2.40] - 2026-09-10

          ### Fixed

          - .NET 双注册组件部署改为 `ITMC.Regedit.dll` 现代链优先，`itmcRegedit.dll` 仅作为兼容回退，与目标 Web 运行时链顺序保持一致。
          - Java 协调器、ASP.NET Host 与 Bridge 预加载统一采用同一选择顺序。
          - 大写现代链完成 `DoRegistry + CheckReInfo` 后，重新读取站点根 `config.xml`；实际持久化 `RegStr` 必须包含当前 `SoftVersionID`，否则以 `[MODE_VERIFY]` 失败。

          ### Regression

          - Java smoke test 覆盖双 DLL uppercase-first、lowercase-only fallback 和站点根持久化 RegStr 读取。
          - Windows hosted integration 加入可加载但调用即失败的小写 decoy DLL，证明双组件环境仍选择大写现代链。

          '''
          entry='\n'.join(x[10:] if x.startswith('          ') else x for x in entry.splitlines())+'\n'
          wr(p,entry+s)

          notes='''# LicenseRecover v1.2.40

          修复 .NET 本地注册有效、连接限制可读取，但业务层仍显示“系统不支持任何模式”的注册链一致性问题。

          - `ITMC.Regedit.dll` 与 `itmcRegedit.dll` 同时存在时，优先大写现代链；小写链仅作为兼容回退。
          - Java 协调器、ASP.NET Host、Bridge 使用相同链顺序。
          - 保留 v1.2.39 的 `SoftVersionID -> RegStr` 合并规则。
          - 大写链 `DoRegistry()` / `CheckReInfo()` 成功后，再读取站点根 `config.xml`，要求实际持久化 `RegStr` 可按当前 `ProName` 解出且包含当前 `SoftVersionID`；否则返回 `[MODE_VERIFY]`。
          - Windows 双 DLL 回归夹具加入 lowercase decoy，防止以后重新退化为 lowercase-first。
          '''
          notes='\n'.join(x[10:] if x.startswith('          ') else x for x in notes.splitlines())+'\n'
          wr('release-notes/v1.2.40.md',notes)

          p='docs/DOTNET_ONE_CLICK_COMPATIBILITY.md'; s=rd(p).rstrip()
          s+='''

          ## v1.2.40 registration-chain parity

          When both registration generations are present, `ITMC.Regedit.dll` is selected before `itmcRegedit.dll`. The Java coordinator, ASP.NET host and bridge use the same order. After uppercase native verification succeeds, one-click reads the site-root `config.xml` again and requires a modern record whose `ProName` matches the detected application product and whose persisted `RegStr` contains the current `SoftVersionID`. A stale `bin/config.xml` cannot satisfy this check.
          '''
          s='\n'.join(x[10:] if x.startswith('          ') else x for x in s.splitlines())+'\n'; wr(p,s)
          print('v1.2.40 patch ready')
          PY
          git diff --check
          git status --short

      - name: Commit v1.2.40
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add VERSION.txt README.md README.txt CHANGELOG.md release-notes/v1.2.40.md \
            docs/DOTNET_ONE_CLICK_COMPATIBILITY.md scripts/verify.ps1 \
            src/main/java/LicenseRecoverModernGUIAutoRecovery.java src/test/java/RefactorSmokeTest.java \
            src/dotnet/LicenseRecover.AspNetHost.cs src/dotnet/LicenseRecover.AspNetBridge.cs \
            .github/workflows/uppercase-host-windows-integration-v2.yml
          git commit -m 'fix: prefer uppercase .NET registration chain and verify persisted modes (v1.2.40)'
          git push origin HEAD:main
