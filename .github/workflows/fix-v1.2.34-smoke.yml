name: Fix v1.2.34 ASP.NET host smoke assertions

on:
  push:
    branches:
      - fix/v1.2.34-smoke
    paths:
      - .github/workflows/fix-v1.2.34-smoke.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/v1.2.34-smoke
      - name: Patch RefactorSmokeTest for target AppDomain host
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/test/java/RefactorSmokeTest.java')
          s = p.read_text(encoding='utf-8')
          replacements = [
              ('check(hostSource230.contains("HttpContext.Current = CreateContext"), "ASP.NET host installs HttpContext.Current");', 'check(hostSource230.contains("HttpContext.Current = LicenseRecoverAspNetHost.CreateContext(appRoot)"), "ASP.NET host installs HttpContext.Current inside the target AppDomain");'),
              ('"ASP.NET host dispatches helper commands directly in the current AppDomain");', '"ASP.NET host dispatches helper commands directly inside the target AppDomain");'),
              ('check(hostSource230.contains("helperDispatch=RunDirect/same-AppDomain"),', 'check(hostSource230.contains("helperDispatch=RunDirect/target-AppDomain"),'),
              ('"ASP.NET host emits same-AppDomain dispatch diagnostics");', '"ASP.NET host emits target-AppDomain dispatch diagnostics");')
          ]
          for old, new in replacements:
              if old not in s:
                  raise SystemExit('missing smoke marker: ' + old)
              s = s.replace(old, new, 1)
          anchor = '        check(hostSource230.contains("SimpleWorkerRequest"), "ASP.NET host creates SimpleWorkerRequest");\n'
          extra = '        check(hostSource230.contains("LicenseRecoverTargetDomainRunner"), "ASP.NET host defines target AppDomain runner");\n        check(hostSource230.contains("setup.ApplicationBase = WithTrailingSeparator(appRoot)"), "ASP.NET host target AppDomain uses target web root");\n        check(hostSource230.contains("setup.PrivateBinPath = \\\"bin\\\""), "ASP.NET host target AppDomain probes target bin");\n        check(hostSource230.contains("setup.ConfigurationFile = webConfig"), "ASP.NET host target AppDomain uses target web.config");\n'
          if anchor not in s:
              raise SystemExit('SimpleWorkerRequest smoke anchor not found')
          s = s.replace(anchor, anchor + extra, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit smoke-test update
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/test/java/RefactorSmokeTest.java
          git commit -m 'test: align ASP.NET host smoke checks with target AppDomain'
          git push origin HEAD:fix/v1.2.34-smoke
