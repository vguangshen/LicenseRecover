name: Apply DS2802 DS50109 evidence fix

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply targeted evidence fix
        run: python3 scripts/apply-ds2802-ds50109-evidence-fix.py
      - name: Validate patch scope
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          changed="$(git diff --name-only | sort)"
          printf '%s\n' "$changed"
          expected=$(printf '%s\n' \
            src/main/java/ExistingLocalRegStrProbe.java \
            src/main/java/LegacyJavaRegistrationMetadata.java \
            src/main/java/LicenseRecoverModernGUI.java \
            src/main/java/LicenseRecoverModernGUIJavaPlan.java \
            src/test/java/RefactorSmokeTest.java | sort)
          test "$changed" = "$expected"
          grep -q 'globalHasRegistrationDispatch' src/main/java/LegacyJavaRegistrationMetadata.java
          grep -q 'confirmedConfigDrivenRuntimeProduct' src/main/java/LicenseRecoverModernGUIJavaPlan.java
          grep -q 'instantiateTargetRegisterMain' src/main/java/ExistingLocalRegStrProbe.java
          grep -q 'DS2802 accepts DS28' src/test/java/RefactorSmokeTest.java
          grep -q 'config->RegisterMain flow' src/test/java/RefactorSmokeTest.java
      - name: Commit to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main/java/ExistingLocalRegStrProbe.java \
                  src/main/java/LegacyJavaRegistrationMetadata.java \
                  src/main/java/LicenseRecoverModernGUI.java \
                  src/main/java/LicenseRecoverModernGUIJavaPlan.java \
                  src/test/java/RefactorSmokeTest.java
          git commit -m 'fix: 补全DS28与配置驱动Java注册证据'
          git push origin HEAD:main
