name: Fix generic strict smoke

on:
  push:
    branches: [ main ]
    paths:
      - 'scripts/fix-generic-strict-smoke.py'
      - '.github/workflows/fix-generic-strict-smoke.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Update assertion
        run: python3 scripts/fix-generic-strict-smoke.py
      - name: Validate
        run: |
          git diff --check
          grep -F 'unknown classes-config apps expose no guessed identity or catch-all RegStr' src/test/java/RefactorSmokeTest.java
      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/test/java/RefactorSmokeTest.java
          git commit -m 'test: 未知Java应用不再期待默认注册族'
          git push origin HEAD:main
