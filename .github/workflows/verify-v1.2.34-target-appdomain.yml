name: Verify v1.2.34 target AppDomain

on:
  push:
    branches: [ fix/v1.2.34-target-appdomain ]
    paths:
      - src/dotnet/LicenseRecover.AspNetHost.cs
      - .github/workflows/verify-v1.2.34-target-appdomain.yml

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Compile ASP.NET host and inspect target AppDomain markers
        shell: powershell
        run: |
          $src = (Resolve-Path 'src/dotnet/LicenseRecover.AspNetHost.cs').Path
          $text = Get-Content -LiteralPath $src -Raw
          foreach ($marker in @('LicenseRecoverTargetDomainRunner','ApplicationBase','PrivateBinPath','ConfigurationFile','helperDispatch=RunDirect/target-AppDomain','CreateContext(appRoot)','preload target registration assembly')) {
            if (-not $text.Contains($marker)) { throw "missing marker: $marker" }
          }
          $csc = Join-Path $env:WINDIR 'Microsoft.NET\Framework64\v4.0.30319\csc.exe'
          if (-not (Test-Path $csc)) { $csc = Join-Path $env:WINDIR 'Microsoft.NET\Framework\v4.0.30319\csc.exe' }
          & $csc /nologo /target:exe /out:LicenseRecover.NET.AspNetHost.test.exe /reference:System.Web.dll "$src"
          if ($LASTEXITCODE -ne 0) { throw "csc failed: $LASTEXITCODE" }
