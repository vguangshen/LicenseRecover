name: Prepare v1.2.51 YX0303 release

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/prepare-v1.2.51-release.yml'

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - name: Prepare v1.2.51 metadata
        run: python3 scripts/prepare-v1.2.51-release.py
      - name: Validate release metadata
        shell: bash
        run: |
          set -euo pipefail
          test "$(tr -d '\r\n[:space:]' < VERSION.txt)" = '1.2.51'
          grep -q '当前稳定版本：\*\*v1.2.51\*\*' README.md
          grep -q '^# LicenseRecover v1.2.51' release-notes/v1.2.51.md
          grep -q '^## 1.2.51 - 2026-09-14' CHANGELOG.md
          git diff --check
      - name: Commit metadata and clean one-time helpers
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/prepare-v1.2.51-release.yml scripts/prepare-v1.2.51-release.py docs/ci-trigger-yx0303.txt
          git add VERSION.txt README.md CHANGELOG.md release-notes/v1.2.51.md
          git diff --cached --check
          git commit -m 'release: prepare v1.2.51 for YX0303 runtime product fix'
          git push origin HEAD:main
