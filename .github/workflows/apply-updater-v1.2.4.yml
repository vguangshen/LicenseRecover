name: Apply updater v1.2.4 fix

on:
  push:
    branches: [ "fix/updater-v1.2.4" ]
    paths: [ ".github/workflows/apply-updater-v1.2.4.yml" ]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/updater-v1.2.4
      - name: Apply updater reliability patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              s = p.read_text(encoding='utf-8')
              if old not in s:
                  raise SystemExit(f'pattern not found in {path}: {old[:120]!r}')
              p.write_text(s.replace(old, new, 1), encoding='utf-8')

          java = 'src/main/java/LicenseRecoverModernGUILauncher.java'

          replace(java,
          '''    final String checksumUrl;\n\n    LicenseRecoverModernGUIUpdateInfo(String currentVersion, String latestVersion, String tagName,\n                                      String releasePageUrl, String zipUrl, String updateZipUrl,\n                                      String checksumUrl) {\n        this.currentVersion = currentVersion;\n        this.latestVersion = latestVersion;\n        this.tagName = tagName;\n        this.releasePageUrl = releasePageUrl;\n        this.zipUrl = zipUrl;\n        this.updateZipUrl = updateZipUrl;\n        this.checksumUrl = checksumUrl;\n    }\n''',
          '''    final String checksumUrl;\n    final long zipSize;\n    final long updateZipSize;\n\n    LicenseRecoverModernGUIUpdateInfo(String currentVersion, String latestVersion, String tagName,\n                                      String releasePageUrl, String zipUrl, String updateZipUrl,\n                                      String checksumUrl, long zipSize, long updateZipSize) {\n        this.currentVersion = currentVersion;\n        this.latestVersion = latestVersion;\n        this.tagName = tagName;\n        this.releasePageUrl = releasePageUrl;\n        this.zipUrl = zipUrl;\n        this.updateZipUrl = updateZipUrl;\n        this.checksumUrl = checksumUrl;\n        this.zipSize = zipSize;\n        this.updateZipSize = updateZipSize;\n    }\n''')

          replace(java,
          '''            JProgressBar bar = new JProgressBar(0, 100);\n            bar.setIndeterminate(true);\n            bar.setStringPainted(true);\n            bar.setString("准备下载");\n''',
          '''            JProgressBar bar = new JProgressBar(0, 100);\n            bar.setIndeterminate(false);\n            bar.setValue(0);\n            bar.setStringPainted(true);\n            bar.setString("0%");\n''')

          replace(java,
          '''    private static final int CONNECT_TIMEOUT_MS = 8000;\n    private static final int READ_TIMEOUT_MS = 30000;\n''',
          '''    private static final int CONNECT_TIMEOUT_MS = 30000;\n    private static final int READ_TIMEOUT_MS = 60000;\n    private static final int DOWNLOAD_RETRIES = 4;\n    private static final long RETRY_BACKOFF_MS = 1500L;\n''')

          replace(java,
          '''        String base = "https://github.com/" + REPOSITORY + "/releases/download/" + tag + "/";\n        return new LicenseRecoverModernGUIUpdateInfo(current, latest, tag, page,\n                base + "LicenseRecover-latest.zip",\n                base + "LicenseRecover-update.zip",\n                base + "SHA256SUMS.txt");\n''',
          '''        String base = "https://github.com/" + REPOSITORY + "/releases/download/" + tag + "/";\n        long portableSize = parseAssetSize(json, "LicenseRecover-latest.zip");\n        long updateSize = parseAssetSize(json, "LicenseRecover-update.zip");\n        return new LicenseRecoverModernGUIUpdateInfo(current, latest, tag, page,\n                base + "LicenseRecover-latest.zip",\n                base + "LicenseRecover-update.zip",\n                base + "SHA256SUMS.txt", portableSize, updateSize);\n''')

          replace(java,
          '''        String fileName = "LicenseRecover-update.zip";\n        String downloadUrl = info.updateZipUrl;\n        String expected = parseChecksum(sums, fileName);\n        if (expected == null) {\n            fileName = "LicenseRecover-latest.zip";\n            downloadUrl = info.zipUrl;\n            expected = parseChecksum(sums, fileName);\n        }\n        if (expected == null) throw new IOException("校验文件中未找到可用的 LicenseRecover 更新包。");\n\n        File dir = Files.createTempDirectory("LicenseRecover-update-").toFile();\n        File zip = new File(dir, fileName);\n        indicator.status("正在下载 " + fileName + "...");\n        sink.accept("[更新] 下载 " + fileName + "...\\n");\n        download(downloadUrl, zip, indicator);\n''',
          '''        String fileName = "LicenseRecover-update.zip";\n        String downloadUrl = info.updateZipUrl;\n        long expectedSize = info.updateZipSize;\n        String expected = parseChecksum(sums, fileName);\n        if (expected == null) {\n            fileName = "LicenseRecover-latest.zip";\n            downloadUrl = info.zipUrl;\n            expectedSize = info.zipSize;\n            expected = parseChecksum(sums, fileName);\n        }\n        if (expected == null) throw new IOException("校验文件中未找到可用的 LicenseRecover 更新包。");\n\n        File dir = Files.createTempDirectory("LicenseRecover-update-").toFile();\n        File zip = new File(dir, fileName);\n        indicator.status("正在连接 GitHub 下载节点...");\n        indicator.bytes(0L, expectedSize);\n        sink.accept("[更新] 下载 " + fileName + "...\\n");\n        download(downloadUrl, zip, expectedSize, indicator, sink);\n        if (expectedSize > 0L && zip.length() != expectedSize) {\n            long actualSize = zip.length();\n            zip.delete();\n            throw new IOException("更新包下载不完整：" + actualSize + " / " + expectedSize + " 字节。");\n        }\n''')

          replace(java,
          '''    private static void download(String url, File target,\n                                 LicenseRecoverModernGUIUpdateProgress progress) throws IOException {\n        HttpURLConnection c = connection(url);\n        long total = c.getContentLengthLong();\n        progress.bytes(0L, total);\n        long downloaded = 0L;\n        try (InputStream in = c.getInputStream();\n             OutputStream out = new BufferedOutputStream(new FileOutputStream(target))) {\n            byte[] buffer = new byte[65536];\n            int n;\n            while ((n = in.read(buffer)) >= 0) {\n                if (n == 0) continue;\n                out.write(buffer, 0, n);\n                downloaded += n;\n                progress.bytes(downloaded, total);\n            }\n        } finally { c.disconnect(); }\n    }\n\n    private static HttpURLConnection connection(String url) throws IOException {\n        URL u = new URL(url);\n        if (!"https".equalsIgnoreCase(u.getProtocol())) throw new IOException("拒绝非 HTTPS 更新地址。");\n        HttpURLConnection c = (HttpURLConnection) u.openConnection();\n        c.setInstanceFollowRedirects(true);\n        c.setConnectTimeout(CONNECT_TIMEOUT_MS);\n        c.setReadTimeout(READ_TIMEOUT_MS);\n        c.setRequestProperty("User-Agent", "LicenseRecover-Updater");\n        c.setRequestProperty("Accept", "application/vnd.github+json, application/octet-stream;q=0.9, */*;q=0.8");\n        int code = c.getResponseCode();\n        if (code < 200 || code >= 300) {\n            c.disconnect();\n            throw new IOException("GitHub 请求失败，HTTP " + code + "。仓库需为公开状态。");\n        }\n        return c;\n    }\n''',
          '''    private static void download(String url, File target, long expectedTotal,\n                                 LicenseRecoverModernGUIUpdateProgress progress,\n                                 Consumer<String> log) throws IOException {\n        long downloaded = target.isFile() ? target.length() : 0L;\n        if (expectedTotal > 0L && downloaded > expectedTotal) {\n            if (!target.delete() && target.exists()) throw new IOException("无法重置异常的更新临时文件。");\n            downloaded = 0L;\n        }\n        progress.bytes(downloaded, expectedTotal);\n        IOException last = null;\n\n        for (int attempt = 1; attempt <= DOWNLOAD_RETRIES; attempt++) {\n            if (expectedTotal > 0L && downloaded == expectedTotal) return;\n            HttpURLConnection c = null;\n            try {\n                progress.status(attempt == 1\n                        ? "正在连接 GitHub 下载节点..."\n                        : "正在重试下载 (" + attempt + "/" + DOWNLOAD_RETRIES + ")...");\n                c = connection(url, downloaded > 0L ? downloaded : -1L);\n                int code = c.getResponseCode();\n                boolean append = downloaded > 0L && code == HttpURLConnection.HTTP_PARTIAL;\n                if (downloaded > 0L && !append) {\n                    if (!target.delete() && target.exists()) throw new IOException("无法重置部分下载文件。");\n                    downloaded = 0L;\n                }\n\n                long responseLength = c.getContentLengthLong();\n                long total = expectedTotal;\n                if (total <= 0L) {\n                    total = parseContentRangeTotal(c.getHeaderField("Content-Range"));\n                    if (total <= 0L && responseLength >= 0L) total = downloaded + responseLength;\n                }\n                progress.status("正在下载 " + target.getName() + "...");\n                progress.bytes(downloaded, total);\n\n                try (InputStream in = new BufferedInputStream(c.getInputStream());\n                     OutputStream out = new BufferedOutputStream(new FileOutputStream(target, append))) {\n                    byte[] buffer = new byte[65536];\n                    int n;\n                    while ((n = in.read(buffer)) >= 0) {\n                        if (n == 0) continue;\n                        out.write(buffer, 0, n);\n                        downloaded += n;\n                        progress.bytes(downloaded, total);\n                    }\n                }\n\n                if (total > 0L && downloaded != total)\n                    throw new EOFException("下载连接提前结束：" + downloaded + " / " + total + " 字节。");\n                return;\n            } catch (IOException ex) {\n                last = ex;\n                log.accept("[更新] 下载第 " + attempt + " 次连接失败: " + ex.getMessage() + "\\n");\n                if (attempt >= DOWNLOAD_RETRIES) break;\n                progress.status("网络中断，稍后自动重试...");\n                try { Thread.sleep(RETRY_BACKOFF_MS * attempt); }\n                catch (InterruptedException interrupted) {\n                    Thread.currentThread().interrupt();\n                    throw new IOException("更新下载被中断。", interrupted);\n                }\n            } finally {\n                if (c != null) c.disconnect();\n            }\n        }\n        String reason = last == null || last.getMessage() == null ? "未知网络错误" : last.getMessage();\n        throw new IOException("连接 GitHub 下载节点失败，已自动重试 " + DOWNLOAD_RETRIES\n                + " 次。最后错误: " + reason, last);\n    }\n\n    private static HttpURLConnection connection(String url) throws IOException {\n        return connection(url, -1L);\n    }\n\n    private static HttpURLConnection connection(String url, long rangeStart) throws IOException {\n        URL u = new URL(url);\n        if (!"https".equalsIgnoreCase(u.getProtocol())) throw new IOException("拒绝非 HTTPS 更新地址。");\n        HttpURLConnection c = (HttpURLConnection) u.openConnection();\n        c.setInstanceFollowRedirects(true);\n        c.setConnectTimeout(CONNECT_TIMEOUT_MS);\n        c.setReadTimeout(READ_TIMEOUT_MS);\n        c.setRequestProperty("User-Agent", "LicenseRecover-Updater");\n        c.setRequestProperty("Accept", "application/vnd.github+json, application/octet-stream;q=0.9, */*;q=0.8");\n        c.setRequestProperty("Accept-Encoding", "identity");\n        if (rangeStart >= 0L) c.setRequestProperty("Range", "bytes=" + rangeStart + "-");\n        int code = c.getResponseCode();\n        if (code < 200 || code >= 300) {\n            c.disconnect();\n            throw new IOException("GitHub 请求失败，HTTP " + code + "。仓库需为公开状态。");\n        }\n        if (!"https".equalsIgnoreCase(c.getURL().getProtocol())) {\n            c.disconnect();\n            throw new IOException("更新下载被重定向到非 HTTPS 地址，已拒绝。");\n        }\n        return c;\n    }\n''')

          replace(java,
          '''    private static String jsonString(String json, String key) {\n        Matcher m = Pattern.compile("\\\\\\\"" + Pattern.quote(key)\n                + "\\\\\\\"\\\\s*:\\\\s*\\\\\\\"([^\\\\\\\"]+)\\\\\\\"").matcher(json == null ? "" : json);\n        return m.find() ? m.group(1).replace("\\\\/", "/") : null;\n    }\n''',
          '''    static long parseAssetSize(String json, String fileName) {\n        if (json == null || fileName == null || fileName.trim().isEmpty()) return -1L;\n        Matcher m = Pattern.compile("(?s)\\\\\"name\\\\\"\\\\s*:\\\\s*\\\\\""\n                + Pattern.quote(fileName) + "\\\\\".{0,8192}?\\\\\"size\\\\\"\\\\s*:\\\\s*(\\\\d+)")\n                .matcher(json);\n        if (!m.find()) return -1L;\n        try { return Long.parseLong(m.group(1)); }\n        catch (NumberFormatException ex) { return -1L; }\n    }\n\n    static long parseContentRangeTotal(String value) {\n        if (value == null) return -1L;\n        Matcher m = Pattern.compile("/(\\\\d+)\\\\s*$").matcher(value.trim());\n        if (!m.find()) return -1L;\n        try { return Long.parseLong(m.group(1)); }\n        catch (NumberFormatException ex) { return -1L; }\n    }\n\n    private static String jsonString(String json, String key) {\n        Matcher m = Pattern.compile("\\\\\\\"" + Pattern.quote(key)\n                + "\\\\\\\"\\\\s*:\\\\s*\\\\\\\"([^\\\\\\\"]+)\\\\\\\"").matcher(json == null ? "" : json);\n        return m.find() ? m.group(1).replace("\\\\/", "/") : null;\n    }\n''')

          # Enable Windows system proxy discovery for the embedded Java process.
          native = 'src/native/LicenseRecoverGUI.c'
          replace(native,
          '''        !append_arg(cmd, cmdCap, &len, L"-Dfile.encoding=UTF-8") ||\n        !append_arg(cmd, cmdCap, &len, L"-Dsun.java2d.dpiaware=true") ||\n''',
          '''        !append_arg(cmd, cmdCap, &len, L"-Dfile.encoding=UTF-8") ||\n        !append_arg(cmd, cmdCap, &len, L"-Djava.net.useSystemProxies=true") ||\n        !append_arg(cmd, cmdCap, &len, L"-Dsun.java2d.dpiaware=true") ||\n''')

          # Regression tests for deterministic asset size and range parsing.
          test = 'src/test/java/RefactorSmokeTest.java'
          replace(test,
          '''        check(checksum.equals(LicenseRecoverModernGUIGitHubUpdateService.parseChecksum(\n                sums, "LicenseRecover-update.zip")),\n                "GitHub updater parses slim update checksum");\n\n        Path updateInstall = base.resolve("update-install");\n''',
          '''        check(checksum.equals(LicenseRecoverModernGUIGitHubUpdateService.parseChecksum(\n                sums, "LicenseRecover-update.zip")),\n                "GitHub updater parses slim update checksum");\n        String releaseJson = "{\\\"assets\\\":[{\\\"name\\\":\\\"LicenseRecover-update.zip\\\",\\\"size\\\":4416823},"\n                + "{\\\"name\\\":\\\"LicenseRecover-latest.zip\\\",\\\"size\\\":53207200}]}";\n        check(LicenseRecoverModernGUIGitHubUpdateService.parseAssetSize(\n                        releaseJson, "LicenseRecover-update.zip") == 4416823L,\n                "GitHub updater reads release asset size for real progress");\n        check(LicenseRecoverModernGUIGitHubUpdateService.parseContentRangeTotal(\n                        "bytes 1024-2047/4416823") == 4416823L,\n                "GitHub updater parses resumable download total");\n\n        Path updateInstall = base.resolve("update-install");\n''')

          # Version and docs.
          Path('VERSION.txt').write_text('1.2.4\n', encoding='utf-8')

          p = Path('README.md')
          s = p.read_text(encoding='utf-8').replace('当前稳定版本：**v1.2.3**', '当前稳定版本：**v1.2.4**')
          marker = '- v1.2.1 起下载过程显示实时进度、百分比与已下载/总大小（服务器提供大小时）。\n'
          if marker in s:
              s = s.replace(marker, marker + '- v1.2.4 起进度总大小直接取 GitHub Release 资产元数据，不再依赖下载节点是否返回 Content-Length；进度条从 0% 到 100% 对应实际收到的字节数。\n- v1.2.4 起下载连接启用更长超时、4 次自动重试与 Range 断点续传，并让内置 Java 使用 Windows 系统代理设置。\n', 1)
          else:
              raise SystemExit('README updater marker not found')
          p.write_text(s, encoding='utf-8')

          p = Path('README.txt')
          s = p.read_text(encoding='utf-8').replace('LicenseRecover v1.2.3', 'LicenseRecover v1.2.4', 1)
          anchor = '软件自动更新\n------------\n'
          if anchor in s:
              s = s.replace(anchor, 'v1.2.4 更新可靠性\n-------------------\n- 更新进度按 GitHub Release 资产的真实字节大小计算，显示 0%-100% 与 已下载/总大小；\n- GitHub 下载连接超时提高到 30 秒，读取超时提高到 60 秒；\n- 下载失败会自动重试 4 次，并在服务器支持时从已下载字节继续；\n- 原生 EXE 启动内置 Java 时启用 Windows 系统代理发现，避免浏览器能访问 GitHub 而 Java 直连超时。\n\n' + anchor, 1)
          else:
              raise SystemExit('README.txt updater marker not found')
          p.write_text(s, encoding='utf-8')

          p = Path('CHANGELOG.md')
          s = p.read_text(encoding='utf-8')
          entry = '''## [1.2.4] - 2026-09-07\n\n### Fixed\n\n- 修复 GitHub Release 下载节点连接较慢时 8 秒即报 `connect timed out` 的问题；连接超时提高到 30 秒、读取超时提高到 60 秒。\n- 更新包下载增加 4 次自动重试，并在下载节点支持 HTTP Range 时从已下载位置继续。\n- 原生 `LicenseRecoverGUI.exe` 启动 Java 时启用 Windows 系统代理发现，避免浏览器走系统代理而 Java 更新器直连失败。\n\n### Changed\n\n- 下载进度总大小改为使用 GitHub Release API 返回的资产 `size`，不再依赖 CDN 的 `Content-Length`，因此进度条可从 0% 到 100% 显示真实下载字节进度。\n- 下载完成后额外校验实际文件长度，再继续执行既有 SHA-256 校验。\n\n'''
          if not s.startswith('# Changelog\n\n'):
              raise SystemExit('CHANGELOG header unexpected')
          s = '# Changelog\n\nAll notable user-visible and engineering changes are tracked here from the first stable release onward.\n\n' + entry + s.split('All notable user-visible and engineering changes are tracked here from the first stable release onward.\n\n',1)[1]
          p.write_text(s, encoding='utf-8')

          Path('release-notes/v1.2.4.md').write_text('''# LicenseRecover v1.2.4\n\n本版本集中修复软件自更新的网络可靠性与下载进度显示。\n\n## 真实下载进度\n\n- 更新器直接读取 GitHub Latest Release API 中每个发行资产的 `size`。\n- `LicenseRecover-update.zip` / `LicenseRecover-latest.zip` 下载开始前即可得到总字节数。\n- 进度条按“实际已写入临时文件的字节数 / Release 资产总字节数”计算 0%-100%，并显示已下载与总大小。\n- 即使 GitHub CDN 使用 chunked transfer 或没有返回 `Content-Length`，进度仍保持确定值。\n\n## 网络可靠性\n\n- 连接超时由 8 秒提高到 30 秒，读取超时由 30 秒提高到 60 秒。\n- 单次下载最多自动尝试 4 次，并采用递增等待时间。\n- 如果连接在下载中途断开，会保留已下载临时文件；下载节点支持 Range 时从断点继续。若节点忽略 Range，则安全地从 0 重新下载。\n- 原生 `LicenseRecoverGUI.exe` 增加 `-Djava.net.useSystemProxies=true`，让内置 Java 8 使用 Windows 系统代理发现机制。\n- 下载请求显式使用 `Accept-Encoding: identity`，避免压缩传输影响文件字节进度和 Range 语义。\n\n## 完整性保护\n\n- 若 GitHub Release API 给出了资产大小，下载结束后会先校验实际文件长度。\n- 之后仍必须通过 `SHA256SUMS.txt` 中的 SHA-256；任何长度或哈希不一致都不会安装。\n- ZIP 路径穿越防护、覆盖前备份、失败回滚和 EXE 直接重启逻辑保持不变。\n\n## 从旧版升级说明\n\n本修复代码只有在 v1.2.4 已经运行后才会生效。v1.2.2/v1.2.3 在下载 v1.2.4 的第一次升级过程中仍运行旧更新器；如果旧更新器在你的网络环境仍然出现 `connect timed out`，需要使用浏览器手动下载一次 v1.2.4 完整便携版。升级到 v1.2.4 后，后续在线更新将使用本版本的新连接、重试、系统代理与真实进度逻辑。\n''', encoding='utf-8')

          # Self-remove one-shot workflow before committing.
          Path('.github/workflows/apply-updater-v1.2.4.yml').unlink()
          PY
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "v1.2.4：修复更新超时并显示真实下载进度"
          git push origin HEAD:fix/updater-v1.2.4
