name: Apply QT100101 v1.2.8
on:
  push:
    branches:
      - feature/qt100101-v1.2.8
    paths:
      - .github/workflows/apply-qt100101-v1.2.8.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/qt100101-v1.2.8
      - name: Apply patch
        run: python3 scripts/apply-qt100101-v1.2.8.py
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "v1.2.8：确认 QT100101 授权产品ID"
          git push origin HEAD:feature/qt100101-v1.2.8
