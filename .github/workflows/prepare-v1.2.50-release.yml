name: Prepare v1.2.50 BKSM4 release

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/prepare-v1.2.50-release.yml'

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - name: Prepare v1.2.50 metadata
        run: python3 scripts/prepare-v1.2.50-release.py
      - name: Validate release metadata
        shell: bash
        run: |
          set -euo pipefail
          test "$(tr -d '\r\n[:space:]' < VERSION.txt)" = '1.2.50'
          grep -q '当前稳定版本：\*\*v1.2.50\*\*' README.md
          grep -q '^## 1.2.50 - 2026-09-13' CHANGELOG.md
          test -f release-notes/v1.2.50.md
          git diff --check
      - name: Commit metadata and clean one-time helpers
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/prepare-v1.2.50-release.yml scripts/prepare-v1.2.50-release.py
          git add VERSION.txt README.md CHANGELOG.md release-notes/v1.2.50.md
          git diff --cached --check
          git commit -m 'release: prepare v1.2.50 for BKSM4 committed mapping fix'
          git push origin HEAD:main
