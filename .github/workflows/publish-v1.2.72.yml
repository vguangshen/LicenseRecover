name: Publish LicenseRecover v1.2.72 (pinned verified artifacts)

# One-shot publisher. A failed partial draft/tag is left for inspection; never overwritten/deleted.
on:
  push:
    branches: [release/v1.2.72-publish]
    paths: [.github/workflows/publish-v1.2.72.yml]

permissions:
  actions: read
  contents: write

concurrency:
  group: publish-LicenseRecover-v1.2.72
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'vguangshen/LicenseRecover'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: vguangshen/LicenseRecover
      SOURCE_SHA: bd6fcaaaefc869a3dba3e5935a5042512d1dcb31
      VERIFIED_RUN: '41666917304'
      TAG: v1.2.72
      VERSION: 1.2.72
      ARTIFACT_ID: "13244209601"
      ARTIFACT_DIGEST: "sha256:16c9cc610306f6ced18679552f74ab451733012dbca6f80a71bfc338c8181ff7"
      PORTABLE_SHA256: "4e6c872f7c92111b06ad440f78330d3ed930ff5b388ca7f83d2351cfdb1a470b"
      UPDATE_SHA256: "0252c046643b4ab89f3cae5d99403d951b94d09ba45aa1537053b20e7af4e032"
      CHECKSUMS_SHA256: "2f41844cb8379ecff0274fd94e45149bcf015c6d49ef3606088cc44901907f7c"
    steps:
      - name: Require exact frozen source, three successful checks, absent release and tag
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "$REPO"
          test "$GITHUB_REF" = refs/heads/release/v1.2.72-publish
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ && "$VERIFIED_RUN" =~ ^[0-9]+$ ]]
          test "$(gh api "repos/$REPO/commits/$SOURCE_SHA" --jq .sha)" = "$SOURCE_SHA"
          test "$(gh api "repos/$REPO/git/ref/heads/release/v1.2.72" --jq .object.sha)" = "$SOURCE_SHA"
          mkdir -p evidence assets roundtrip
          gh api "repos/$REPO/contents/VERSION.txt?ref=$SOURCE_SHA" --jq .content | base64 -d > evidence/VERSION.txt
          gh api "repos/$REPO/contents/release-notes/$TAG.md?ref=$SOURCE_SHA" --jq .content | base64 -d > evidence/RELEASE_NOTES.md
          test "$(tr -d '\r\n' < evidence/VERSION.txt)" = "$VERSION"
          test -s evidence/RELEASE_NOTES.md
          gh api "repos/$REPO/actions/runs/$VERIFIED_RUN" > evidence/verified-run.json
          jq -e --arg sha "$SOURCE_SHA" --arg repo "$REPO" '
            .head_sha == $sha and .head_repository.full_name == $repo and
            .status == "completed" and .conclusion == "success" and
            .name == "Verify source" and .path == ".github/workflows/verify-source.yml"
          ' evidence/verified-run.json
          gh api --paginate "repos/$REPO/actions/runs?head_sha=$SOURCE_SHA&per_page=100" \
            --jq '.workflow_runs[]' | jq -s . > evidence/all-runs.json
          for name in "Verify source" "Uppercase ITMC.Regedit Windows integration v2" "Dual registration DLL Windows integration v3"; do
            jq -e --arg sha "$SOURCE_SHA" --arg repo "$REPO" --arg name "$name" '
              [.[] | select(.head_sha == $sha and .head_repository.full_name == $repo and .name == $name)]
              | sort_by(.id) | last | .status == "completed" and .conclusion == "success"
            ' evidence/all-runs.json
          done
          gh api --paginate "repos/$REPO/releases?per_page=100" --jq '.[]' | jq -s \
            --arg tag "$TAG" -e 'all(.[]; .tag_name != $tag)'
          # Distinguish a genuine 404 from access/network/server errors.
          require_404() {
            if gh api --include "$1" > evidence/absence-response.txt 2> evidence/absence-error.txt; then
              echo "Refusing existing resource: $1" >&2; exit 1
            fi
            head -n 1 evidence/absence-response.txt | grep -Eq '^HTTP/[^ ]+ 404( |$)'
          }
          require_404 "repos/$REPO/releases/tags/$TAG"
          require_404 "repos/$REPO/git/ref/tags/$TAG"

      - name: Download the exact successful Verify source artifact
        shell: bash
        run: |
          set -euo pipefail
          gh api --paginate "repos/$REPO/actions/runs/$VERIFIED_RUN/artifacts?per_page=100" \
            --jq '.artifacts[]' | jq -s . > evidence/artifacts.json
          jq -e --argjson id "$ARTIFACT_ID" --arg digest "$ARTIFACT_DIGEST" '[.[] | select(.name == "LicenseRecover-latest" and .expired == false)] | length == 1 and .[0].id == $id and .[0].digest == $digest' evidence/artifacts.json
          gh run download "$VERIFIED_RUN" --repo "$REPO" --name LicenseRecover-latest --dir assets
          test "$(find assets -mindepth 1 -maxdepth 1 -type f | wc -l)" -eq 3
          test "$(find assets -mindepth 1 -type d | wc -l)" -eq 0
          for file in LicenseRecover-latest.zip LicenseRecover-update.zip SHA256SUMS.txt; do test -s "assets/$file"; done

      - name: Check ZIPs, source metadata, every runtime class, and portable/update identity
        shell: bash
        run: |
          set -euo pipefail
          cat > evidence/validate.py <<'PY'
          import hashlib, io, os, pathlib, re, stat, sys, zipfile
          folder = pathlib.Path(sys.argv[1])
          expected_notes = pathlib.Path('evidence/RELEASE_NOTES.md').read_bytes()
          version = pathlib.Path('evidence/VERSION.txt').read_bytes()
          required_assets = {'LicenseRecover-latest.zip','LicenseRecover-update.zip','SHA256SUMS.txt'}
          assert {p.name for p in folder.iterdir()} == required_assets, 'unexpected assets'
          sums = {}
          for line in (folder/'SHA256SUMS.txt').read_text(encoding='ascii').splitlines():
              match = re.fullmatch(r'([0-9a-f]{64})  (LicenseRecover-(?:latest|update)\.zip)',line)
              assert match and match[2] not in sums, 'malformed or duplicate checksum'
              sums[match[2]] = match[1]
          assert set(sums) == required_assets-{'SHA256SUMS.txt'}, 'incomplete checksums'
          assert sums == {'LicenseRecover-latest.zip':os.environ['PORTABLE_SHA256'],'LicenseRecover-update.zip':os.environ['UPDATE_SHA256']}, 'not the Windows-tested artifact ZIPs'
          assert hashlib.sha256((folder/'SHA256SUMS.txt').read_bytes()).hexdigest() == os.environ['CHECKSUMS_SHA256'], 'checksum asset differs from Windows-tested bytes'
          def digest(data): return hashlib.sha256(data).hexdigest()
          def archive(blob):
              z = zipfile.ZipFile(blob)
              names = [e.filename for e in z.infolist()]
              assert len(names)==len(set(n.casefold() for n in names)), 'duplicate ZIP path'
              assert sum(e.file_size for e in z.infolist()) < 1024**3, 'archive too large'
              for e in z.infolist():
                  n=e.filename; path=pathlib.PurePosixPath(n)
                  assert n and not path.is_absolute() and '\\' not in n and ':' not in n and '..' not in path.parts, 'unsafe ZIP path'
                  assert not e.flag_bits & 1 and not stat.S_ISLNK(e.external_attr >> 16), 'encrypted or linked ZIP entry'
              assert z.testzip() is None, 'ZIP CRC error'
              return z, {e.filename for e in z.infolist() if not e.is_dir()}
          jars = {}
          zips = {}
          file_sets = {}
          for filename,sha in sums.items():
              assert digest((folder/filename).read_bytes()) == sha, 'ZIP SHA mismatch'
              z, files = archive(folder/filename)
              zips[filename]=z;file_sets[filename]=files
              assert z.read('VERSION.txt') == version and version.strip() == b'1.2.72', 'wrong source version'
              assert z.read('RELEASE_NOTES.md') == expected_notes, 'release notes do not match pinned source'
              for f in ('LicenseRecoverGUI.exe','LicenseRecoverRuntime.jar','LicenseRecoverOverlay.jar','LicenseRecoverGUI.jar','LicenseRecover.jar'):
                  assert f in files and z.getinfo(f).file_size>0, 'missing launcher/runtime'
              assert {f for f in files if '/' not in f and f.lower().endswith('.exe')}=={'LicenseRecoverGUI.exe'}, 'root executable layout'
              assert z.read('LicenseRecoverGUI.exe')[:2] == b'MZ', 'launcher PE header'
              runtime=z.read('LicenseRecoverRuntime.jar')
              assert runtime == z.read('LicenseRecoverOverlay.jar'), 'runtime/overlay differ'
              jar, class_names=archive(io.BytesIO(runtime))
              declared={}
              for line in jar.read('META-INF/LicenseRecover-classes.sha256').decode('ascii').splitlines():
                  match=re.fullmatch(r'([0-9a-f]{64})  ([A-Za-z0-9_$/]+\.class)',line)
                  assert match and match[2] not in declared, 'malformed class inventory'
                  declared[match[2]]=match[1]
              assert len(declared)==208, 'expected exactly 208 compiled main/nested classes'
              assert {n for n in class_names if n.endswith('.class')}==set(declared), 'missing/unlisted runtime classes'
              for name,sha_class in declared.items():
                  data=jar.read(name)
                  assert data[:4]==b'\xca\xfe\xba\xbe' and digest(data)==sha_class, 'class hash mismatch'
              for name in ('LicenseRecoverReadOnlyInspection','LicenseRecoverReadOnlyInspection$Result',
                           'LicenseRecoverReadOnlyPeMetadata','LicenseRecoverReadOnlyPeMetadata$Reader',
                           'LicenseRecoverReadOnlyPatchScanner','LicenseRecoverReadOnlyPatchScanner$Runtime',
                           'LicenseRecoverReadOnlyPatchScanner$Reviewed','LicenseRecoverReadOnlyFingerprint',
                           'LicenseRecoverReadOnlyJavaVerifier','LicenseRecoverReadOnlyDotNetVerifier',
                           'LicenseRecoverReadOnlyMachineIdentity','LicenseRecoverLicenseState$Acceptance',
                           'LicenseRecoverLicenseState$LocalCondition',
                           'LicenseRecoverReadOnlyJavaLocalVerifier','LicenseRecoverReadOnlyJavaLocalVerifier$Profile',
                           'LicenseRecoverReadOnlyJavaLocalVerifier$Code','LicenseRecoverReadOnlyJavaLocalVerifier$Input',
                           'LicenseRecoverReadOnlyJavaLocalVerifier$LocalCheck','LicenseRecoverReadOnlyJavaLocalVerifier$FlatJson',
                           'LicenseRecoverReadOnlyJavaAlternateVerifier','LicenseRecoverReadOnlyJavaAlternateVerifier$Profile',
                           'LicenseRecoverReadOnlyJavaAlternateVerifier$Snapshot','LicenseRecoverReadOnlyJavaAlternateVerifier$Layout',
                           'LicenseRecoverReadOnlyJavaMachineIdentity','LicenseRecoverReadOnlyJavaMachineIdentity$Identity',
                           'LicenseRecoverReadOnlyDotNetExtendedVerifier','LicenseRecoverReadOnlyDotNetExtendedVerifier$Result',
                           'LicenseRecoverReadOnlyJavaScanner','LicenseRecoverReadOnlyJavaScanner$Provider',
                           'LicenseRecoverReadOnlyDotNetScanner','LicenseRecoverReadOnlyDotNetScanner$Result',
                           'LicenseRecoverReadOnlyDotNetCatalog','LicenseRecoverReadOnlyDotNetCatalog$Assessment',
                           'LicenseRecoverReadOnlyDotNetCatalog$Observed','LicenseRecoverReadOnlyDotNetCatalog$UpperBinding',
                           'LicenseRecoverReadOnlyDotNetCatalog$ExtendedBinding','LicenseRecoverReadOnlyDotNetCatalog$Family',
                           'LicenseRecoverReadOnlyPeMetadata$ApiShape','LicenseRecoverReadOnlyPeMetadata$ApiBudget',
                           'LicenseRecoverReadOnlyPeMetadata$TypeSpecFrame','LicenseRecoverReadOnlyPeMetadata$TypeSpecValue',
                           'LicenseRecoverReadOnlyWmicCpuIdentity','LicenseRecoverReadOnlyDotNetRegistrySource',
                           'LicenseRecoverReadOnlyCodeEvidence','LicenseRecoverReadOnlyCodeEvidence$Behavior',
                           'LicenseRecoverReadOnlyCodeEvidence$Component','LicenseRecoverReadOnlyJavaCodeEvidence',
                           'LicenseRecoverReadOnlyDotNetCodeEvidence','LicenseRecoverReadOnlyPatchProfile',
                           'LicenseRecoverReadOnlyPatchProfile$TargetPair','LicenseRecoverReadOnlyPatchProfile$FixedBinding',
                           'LicenseRecoverReadOnlyJavaScanner$Result'):
                  assert name+'.class' in declared, 'missing critical scanner dependency'
              jars[filename]=runtime
          portable=file_sets['LicenseRecover-latest.zip']; update=file_sets['LicenseRecover-update.zip']
          for name in ('jre/bin/java.exe','jre/bin/javaw.exe','jre/lib/rt.jar','jre/LICENSE','jre/ASSEMBLY_EXCEPTION','jre/THIRD_PARTY_README','JRE_SOURCE_NOTICE.txt'):
              assert name in portable, 'missing portable JRE component'
          assert not any(n.startswith('jre/') for n in update), 'update bundles JRE'
          assert not any('/' not in n and n.lower().endswith('.bat') for n in portable), 'portable exposes BAT'
          assert {n for n in update if '/' not in n and n.lower().endswith('.bat')}=={'run_gui.bat'}, 'update BAT layout'
          trampoline=zips['LicenseRecover-update.zip'].read('run_gui.bat')
          assert b'LicenseRecoverGUI.exe' in trampoline and b'&&' not in trampoline, 'invalid update trampoline'
          shared_portable={n for n in portable if not n.startswith('jre/') and n!='JRE_SOURCE_NOTICE.txt'}
          shared_update=update-{'run_gui.bat'}
          assert shared_portable==shared_update, 'portable/update application file sets differ'
          for name in shared_portable:
              assert digest(zips['LicenseRecover-latest.zip'].read(name))==digest(zips['LicenseRecover-update.zip'].read(name)), 'portable/update file differs: '+name
          assert len(set(jars.values()))==1, 'portable/update runtime differs'
          print('PASS: both ZIP hashes, pinned metadata, 208 exact runtime classes, JRE layout and all shared application files')
          PY
          python3 evidence/validate.py assets

      - name: Create new exact-source tag and draft, upload without overwriting, verify round trip
        shell: bash
        run: |
          set -euo pipefail
          # Every mutation is explicit to this repository. Existing tags/assets are never overwritten.
          jq -n --arg tag "refs/tags/$TAG" --arg sha "$SOURCE_SHA" '{ref:$tag,sha:$sha}' > evidence/tag.json
          gh api --method POST "repos/$REPO/git/refs" --input evidence/tag.json > evidence/created-tag.json
          jq -e --arg sha "$SOURCE_SHA" '.object.type == "commit" and .object.sha == $sha' evidence/created-tag.json
          cp evidence/RELEASE_NOTES.md evidence/PUBLIC_RELEASE_NOTES.md
          cat >> evidence/PUBLIC_RELEASE_NOTES.md <<'NOTES'

          ## 实际验证结果

          - 已审核入口通过恢复绿色，“代码证据”列独立说明组件原版对照、静态放行、局部替换候选及未知范围。
          - 重新只读复制并扫描 27 项（17 Java、10 .NET），18 项入口通过、9 项整体待核、0 异常。DS0101、DS0105 均通过；用户说明未使用方式三，不把授权通过误写成已确认代码 Patch。
          - 14 项 J1 组件对照一致、1 项完整静态门槛放行，当前真实可信原版/Patch 文件对仍为空。组件对照或方法形态不等于整站原版、原生有效或可信 Patch。
          - 两个精确 CI ZIP 已在 Windows 随包 JRE 上分别通过 21 组行为测试、208 个主类/内部类清单校验和真实样本逐项比对。
          - 完整包自带 Windows JRE，解压运行 LicenseRecoverGUI.exe；更新包供已有安装升级。附件以 SHA256SUMS.txt 校验。

          源码提交：`bd6fcaaaefc869a3dba3e5935a5042512d1dcb31`
          开发 PR：https://github.com/vguangshen/LicenseRecover/pull/64
          构建检查：https://github.com/vguangshen/LicenseRecover/actions/runs/41666917304
          逐项范围：https://github.com/vguangshen/LicenseRecover/blob/bd6fcaaaefc869a3dba3e5935a5042512d1dcb31/docs/PATCH_EVIDENCE_VALIDATION_20261103.md
          NOTES
          jq -n --arg tag "$TAG" --arg sha "$SOURCE_SHA" --rawfile notes evidence/PUBLIC_RELEASE_NOTES.md \
            '{tag_name:$tag,target_commitish:$sha,name:("LicenseRecover "+$tag),body:$notes,draft:true,prerelease:false,make_latest:"false"}' > evidence/draft.json
          gh api --method POST "repos/$REPO/releases" --input evidence/draft.json > evidence/created-release.json
          release_id="$(jq -r .id evidence/created-release.json)"
          [[ "$release_id" =~ ^[0-9]+$ ]]
          echo "RELEASE_ID=$release_id" >> "$GITHUB_ENV"
          gh release upload "$TAG" --repo "$REPO" assets/LicenseRecover-latest.zip assets/LicenseRecover-update.zip assets/SHA256SUMS.txt
          gh api "repos/$REPO/releases/$release_id" > evidence/draft-with-assets.json
          jq -e --arg tag "$TAG" --arg sha "$SOURCE_SHA" '
            .draft == true and .prerelease == false and .tag_name == $tag and .target_commitish == $sha and
            ([.assets[].name] | sort) == ["LicenseRecover-latest.zip","LicenseRecover-update.zip","SHA256SUMS.txt"]
          ' evidence/draft-with-assets.json
          gh release download "$TAG" --repo "$REPO" --dir roundtrip
          for file in LicenseRecover-latest.zip LicenseRecover-update.zip SHA256SUMS.txt; do cmp "assets/$file" "roundtrip/$file"; done
          python3 evidence/validate.py roundtrip
          gh api "repos/$REPO/git/ref/tags/$TAG" --jq .object.sha | grep -Fx "$SOURCE_SHA"

      - name: Publish verified draft as stable latest and verify final source identity
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_ID" =~ ^[0-9]+$ ]]
          # Publish only the draft created in this run after every round-trip check above passed.
          gh api "repos/$REPO/releases/$RELEASE_ID" --jq '.draft' | grep -Fx true
          gh api "repos/$REPO/git/ref/tags/$TAG" --jq .object.sha | grep -Fx "$SOURCE_SHA"
          jq -n '{draft:false,prerelease:false,make_latest:"true"}' > evidence/publish.json
          gh api --method PATCH "repos/$REPO/releases/$RELEASE_ID" --input evidence/publish.json > evidence/published.json
          jq -e --arg tag "$TAG" --arg sha "$SOURCE_SHA" --argjson id "$RELEASE_ID" '
            .id == $id and .tag_name == $tag and .target_commitish == $sha and .draft == false and .prerelease == false
          ' evidence/published.json
          latest_verified=false
          for attempt in 1 2 3 4 5; do
            gh api "repos/$REPO/releases/latest" > evidence/latest.json
            if jq -e --arg tag "$TAG" --arg sha "$SOURCE_SHA" --argjson id "$RELEASE_ID" '
              .id == $id and .tag_name == $tag and .target_commitish == $sha and .draft == false and .prerelease == false
            ' evidence/latest.json; then latest_verified=true; break; fi
            sleep 5
          done
          test "$latest_verified" = true
          gh api "repos/$REPO/git/ref/tags/$TAG" | jq -e --arg sha "$SOURCE_SHA" '.object.type == "commit" and .object.sha == $sha'
          echo "Published $TAG from exact source $SOURCE_SHA with verified asset round trip."
