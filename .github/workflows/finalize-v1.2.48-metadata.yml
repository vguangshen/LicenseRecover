name: Finalize v1.2.48 metadata

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/finalize-v1.2.48-metadata.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - name: Patch README and changelog
        shell: python
        run: |
          from pathlib import Path
          readme = Path('README.md')
          text = readme.read_text(encoding='utf-8')
          text = text.replace('当前稳定版本：**v1.2.47**', '当前稳定版本：**v1.2.48**', 1)
          readme.write_text(text, encoding='utf-8')

          changelog = Path('CHANGELOG.md')
          text = changelog.read_text(encoding='utf-8')
          if not text.startswith('## 1.2.48'):
              text = '''## 1.2.48 - 2026-09-13

### Fixed
- 修复真实部署版 `YX030506` 仍显示“待确认”：应用模式 `YX030506` 与 classes/config 的启动注册产品列表 `YX0305,QT1001` 分离处理。
- 真实 PRODUCT_ALL_NUM 结构下，只有目标配置、System 枚举、启动循环和 RegisterHttpServlet 均证明时，才确认主运行注册产品 `YX0305`；RegStr 保持 `QT100101,QT100102`。
- 继续 fail-closed：删除 YX0305 servlet 证据的回归夹具必须保持 BLOCKED。

### Verification
- 用户精简真实部署样本证据已核对；回归期望为 `AuthorizationFamily=YX0305`, `RuntimeProductID=YX0305`, `RegStr=QT100101,QT100102`, `automaticRecoveryReady=true`。

''' + text
          changelog.write_text(text, encoding='utf-8')
      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          grep -q '当前稳定版本：\*\*v1.2.48\*\*' README.md
          grep -q '^## 1.2.48 ' CHANGELOG.md
          test "$(tr -d '\r\n[:space:]' < VERSION.txt)" = '1.2.48'
          test -f release-notes/v1.2.48.md
          git diff --check
      - name: Commit metadata and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/finalize-v1.2.48-metadata.yml
          git add README.md CHANGELOG.md
          git diff --cached --check
          git commit -m 'docs: finalize v1.2.48 metadata'
          git push origin HEAD:main

# Existing-on-main trigger: second push intentionally starts this one-time workflow.
