name: Fix LinkedHashSet compile

on:
  push:
    branches: [ main ]
    paths:
      - 'scripts/fix-linkedhashset-import.py'
      - '.github/workflows/fix-linkedhashset-import.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: python3 scripts/fix-linkedhashset-import.py
      - run: |
          git diff --check
          grep -F 'java.util.LinkedHashSet<String> values' src/main/java/LicenseRecover.java
      - shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main/java/LicenseRecover.java
          git commit -m 'fix: 修复目标RegStr探测编译'
          git push origin HEAD:main
